<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>404 · Página não encontrada | DriveParts</title>
  <style>
    body.inventory-page--error { margin: 0; background: #f4f7fb; color: #173658; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .dp-error-page, .dp-error-page * { box-sizing: border-box; }
    .dp-error-page { min-height: 100svh; display: flex; flex-direction: column; padding: 36px 48px 24px; }
    .dp-error-brand { align-self: flex-start; display: inline-flex; }
    .dp-error-brand img { display: block; width: 174px; height: auto; }
    .dp-error-content { width: 100%; max-width: 600px; margin: auto; padding: 56px 0; text-align: center; }
    .dp-error-number { display: block; color: #dce6f2; font-size: clamp(120px, 22vw, 192px); font-weight: 800; letter-spacing: -.07em; line-height: 1; user-select: none; }
    .dp-error-label { display: inline-block; margin: 24px 0 16px; padding: 7px 12px; border: 1px solid #dce6f2; border-radius: 8px; background: #edf3fb; color: #2f68ac; font-size: 12px; font-weight: 600; }
    .dp-error-content h1 { margin: 0 0 16px; font-size: clamp(28px, 5vw, 38px); font-weight: 700; letter-spacing: -.035em; line-height: 1.2; }
    .dp-error-description { margin: 0 auto 10px; color: #405974; font-size: 17px; line-height: 1.6; }
    .dp-error-help { max-width: 460px; margin: 0 auto; color: #6b7e93; font-size: 14px; line-height: 1.7; }
    .dp-error-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
    .dp-error-page .dp-error-action { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; padding: 12px 22px; border: 1px solid #2f68ac; border-radius: 9px; background: #2f68ac; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; transition: background .15s; }
    .dp-error-page .dp-error-action:hover { background: #214d82; color: #fff; }
    .dp-error-action:focus-visible, .dp-error-brand:focus-visible { outline: 3px solid #79a9e4; outline-offset: 4px; }
    .dp-error-action svg { width: 17px; height: 17px; }
    .dp-error-footer { text-align: center; color: #7c8da1; font-size: 12px; }
    .inventory-sidebar-ready .dp-error-page, [data-desktop-spa-shell="topbar"] ~ .dp-error-page { min-height: calc(100svh - 76px); }
    .inventory-sidebar-ready .dp-error-brand, [data-desktop-spa-shell="topbar"] ~ .dp-error-page .dp-error-brand { display: none; }
    @media (max-width: 600px) {
      .dp-error-page { padding: 28px 24px 22px; }
      .dp-error-brand img { width: 150px; }
      .dp-error-content { padding: 44px 0; }
      .dp-error-description { font-size: 16px; }
      .dp-error-action { width: 100%; }
    }
  </style>
</head>
<body class="inventory-page inventory-page--error">
  <main class="dp-error-page" data-driveparts-error-page="404" aria-labelledby="dp-error-title">
    <a class="dp-error-brand" href="/sistema/parts-home" aria-label="DriveParts — voltar ao início">
      <img src="/driveparts_logo.png" alt="DriveParts">
    </a>
    <section class="dp-error-content">
      <span class="dp-error-number" aria-hidden="true">404</span>
      <span class="dp-error-label">Erro 404</span>
      <h1 id="dp-error-title">Página não encontrada</h1>
      <p class="dp-error-description">Não encontramos a página que você está procurando.</p>
      <p class="dp-error-help">O endereço pode ter mudado ou não estar mais disponível. Confira o link ou volte ao início para continuar.</p>
      <div class="dp-error-actions">
        <a class="dp-error-action" href="/sistema/parts-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"></path><path d="M9 21v-8h6v8"></path></svg>
          Voltar ao início
        </a>
      </div>
    </section>
    <footer class="dp-error-footer">DriveParts · Gestão de autopeças</footer>
  </main>


</body></html>
