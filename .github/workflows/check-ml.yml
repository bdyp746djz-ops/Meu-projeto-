name: Checar conexão ML

# Consulta rápida no banco (D1) para ver se a conexão com o Mercado Livre
# foi gravada. Mostra só o TAMANHO de cada valor, nunca o conteúdo secreto.
# Rodar manualmente (workflow_dispatch).

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Ver estado da conexão
        run: npx wrangler d1 execute rafa-desmanche --remote --command "SELECT chave, length(valor) AS tamanho FROM config WHERE chave LIKE 'ml_%' ORDER BY chave"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cc15a419f43d0e368e2fe2b1361b568e
