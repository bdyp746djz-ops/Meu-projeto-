<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafa Busca Peças</title>
<script src="/qrcode.min.js"></script>
<style>
:root{--red:#c62828;--red2:#e53935;--ink:#1d1f23;--mut:#6b7280;--line:#e8eaed;--bg:#f4f5f7;--card:#fff;--ok:#1f9d55;--amber:#e6a800;--olx:#6e0ad6;--blue:#1565c0;--rad:13px;--sh:0 1px 3px rgba(16,24,40,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}
/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.authcard{background:#fff;border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:22px;width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:18px}
label.f{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin:11px 0 5px}
input,select,textarea{width:100%;border:1px solid #d7dbe0;border-radius:9px;padding:10px 12px}
.msg{margin-top:12px;font-size:13px;min-height:16px}.msg.err{color:var(--red)}
.linkb{background:none;border:0;color:var(--red);font-weight:600;cursor:pointer;font-size:13px;padding:0;margin-top:14px}
/* shell */
.app{display:flex;min-height:100vh}
nav.side{width:210px;background:#fff;border-right:1px solid var(--line);padding:12px 9px;flex-shrink:0}
nav.side .brand{padding:6px 8px 12px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#3a3f46;text-decoration:none;font-weight:600;cursor:pointer}
nav a .i{width:18px;text-align:center}
nav a.on{background:#fdecea;color:var(--red)}
nav a:not(.on):hover{background:#f3f4f6}
nav .sep{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#9aa1ab;padding:12px 12px 3px;font-weight:700}
main{flex:1;min-width:0;padding:18px 22px 90px}
nav.bottom{display:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h2{margin:0;font-size:20px;flex:1}
.q input{width:100%}
header.bar{background:var(--red);color:#fff;display:none;align-items:center;gap:10px;padding:9px 14px;position:sticky;top:0;z-index:20}
@media(max-width:760px){
 nav.side{display:none}main{padding:12px 12px 90px}
 header.bar{display:flex}
 nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20}
 nav.bottom a{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:8px 2px;border-radius:0}
}
/* componentes */
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none;display:inline-block}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:14px;box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:16px}
.kpi .l{color:var(--mut);font-size:12.5px;font-weight:600}.kpi .v{font-size:23px;font-weight:800;margin-top:5px}
.kpi.clic{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}
.pc{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column}
.pc.sel{outline:3px solid var(--red);outline-offset:-2px}
.selck{position:absolute;left:7px;top:7px;z-index:3;width:24px;height:24px;border-radius:6px;background:#fff;border:2px solid var(--red);color:var(--red);display:grid;place-items:center;font-weight:800;font-size:14px}
.bulkbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1d1f23;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.28);flex-wrap:wrap;max-width:94vw}
.pc .ph{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#eef1f4,#e3e7ec);display:grid;place-items:center;color:#9aa1ab;font-size:30px}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .ph .loc{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(21,101,192,.94);color:#fff;font-size:10.5px;font-weight:700;border-radius:7px;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ph .loc.none{background:rgba(198,40,40,.94)}
.pc .b{padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.pc .n{font-weight:700;font-size:13.5px;line-height:1.25}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:5px;padding:2px 7px;background:#eef0f3;color:#333;white-space:nowrap}
.tag.price{background:#e7f6ee;color:var(--ok);font-weight:700}.tag.ml{background:#fff6d6;color:#8a6d00}.tag.olx{background:#efe3ff;color:#54279e}.tag.zero{background:#fdecea;color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #d7dbe0;border-radius:20px;padding:6px 12px;background:#fff;cursor:pointer;font-size:13px}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.sugbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh);background:#fff}
.sughd{background:#f7f8fa;padding:7px 11px;font-size:12px;color:var(--mut);font-weight:700}
.sugitem{padding:9px 11px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.sugitem:hover{background:#fdecea}
.sugpr{color:var(--ok);font-weight:700}
.withmic{position:relative}
.withmic>input,.withmic>textarea{width:100%;padding-right:46px}
.mic{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#eef0f3;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
.withmic.ta .mic{top:8px;transform:none}
.mic.on{background:#fdecea;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.mut{color:var(--mut)}.small{font-size:13px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed #d7dbe0}
.tree>ul{padding-left:0;border:0}
.node{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:7px}.node:hover{background:#f4f5f7}
.node .tg{width:20px;text-align:center;cursor:pointer;color:var(--mut)}
.node .nm{font-weight:700}.node .ct{font-size:12px;color:var(--mut);cursor:pointer}
.node .act{margin-left:auto;display:flex;gap:4px}
.occ{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.occ .track{display:inline-block;height:7px;border-radius:4px;background:#eef0f3;overflow:hidden}
.occ .fill{display:block;height:100%;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:26px 12px;overflow:auto}
.modal .box{background:#fff;border-radius:13px;max-width:680px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:23px;cursor:pointer;color:var(--mut)}
.photos{display:flex;gap:8px;overflow-x:auto}.photos img{height:130px;border-radius:9px;object-fit:cover}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:21px;height:21px;background:var(--red);color:#fff;cursor:pointer;font-size:12px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lbl{border:1px dashed #9ca3af;border-radius:7px;background:#fff;padding:8px;display:flex;gap:8px;align-items:center}
.lbl svg{width:80px;height:80px;flex-shrink:0}.lbl .t{font-size:12px;line-height:1.25;overflow:hidden}.lbl .t b{font-size:14px;display:block}
.sel{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:9px;z-index:60;font-size:14px;max-width:90vw}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.bar2{height:8px;border-radius:4px;background:var(--red2)}
.adbox{white-space:pre-wrap;background:#f7f8fa;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13.5px}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cod = n => '#'+String(n).padStart(6,'0');
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

async function api(path, opts={}){
  const o = { headers:{}, ...opts };
  if (o.body && !(o.body instanceof Blob) && typeof o.body!=='string'){ o.body=JSON.stringify(o.body); o.headers['content-type']='application/json'; }
  const r = await fetch('/api'+path, o);
  let d={}; try{ d=await r.json(); }catch{}
  if(!r.ok) throw new Error(d.erro || ('erro '+r.status));
  return d;
}

const S = { user:null, view:'painel', pecas:[], locais:{}, ui:{ q:'', loc:'', status:'todos', periodo:'mes', editId:null, fotos:[], etqTipo:'pecas', etqW:100, etqH:50, etqSel:new Set(), open:new Set(), selMode:false, sel:new Set() } };
const VIEWS = [['painel','📊','Painel'],['estoque','📦','Estoque'],['nova','➕','Nova peça'],['locais','🗄️','Localizações'],['mover','🔀','Mover'],['etiquetas','🏷️','Etiquetas'],['vendas','💰','Vendas'],['integracoes','🔗','Integrações']];

// ---------- boot / auth ----------
async function boot(){
  if(location.pathname==='/api/ml/callback'){ return mlFinaliza(); }
  try{ const { user } = await api('/me'); S.user=user; shell(); }
  catch{ login(false); }
}
async function mlFinaliza(){
  $('#root').innerHTML='<div class="center"><div class="authcard"><div class="brand"><span class="logo">🔧</span> Rafa Busca Peças</div><p class="mut">Finalizando conexão com o Mercado Livre…</p></div></div>';
  const p=new URLSearchParams(location.search);
  try{
    const err=p.get('error'); if(err) throw new Error('Mercado Livre recusou: '+err);
    await api('/ml/exchange',{method:'POST',body:{code:p.get('code'),state:p.get('state')}});
  }catch(e){ /* o motivo fica salvo e aparece na tela de Integrações */ }
  location.replace('/#integracoes');
}
function login(primeiro){
  $('#root').innerHTML = `<div class="center"><form class="authcard" id="f">
    <div class="brand"><span class="logo">🔧</span> Rafa Busca Peças</div>
    <h3>${primeiro?'Criar acesso do administrador':'Entrar'}</h3>
    ${primeiro?'<label class="f">Seu nome</label><input name="nome" placeholder="Ex.: Rafael">':''}
    <label class="f">Login</label><input name="login" autocomplete="username" required>
    <label class="f">Senha</label><input name="senha" type="password" autocomplete="${primeiro?'new-password':'current-password'}" required>
    <button class="btn p" style="width:100%;margin-top:16px" type="submit">${primeiro?'Criar acesso':'Entrar'}</button>
    <div class="msg" id="m"></div>
    <button class="linkb" type="button" id="alt">${primeiro?'Já tenho acesso — entrar':'Primeiro acesso? Criar administrador'}</button>
  </form></div>`;
  $('#alt').onclick=()=>login(!primeiro);
  $('#f').onsubmit=async e=>{
    e.preventDefault(); const b=Object.fromEntries(new FormData(e.target)); const btn=e.target.querySelector('button'); btn.disabled=true;
    try{ if(primeiro) await api('/setup',{method:'POST',body:b});
      const { user }=await api('/login',{method:'POST',body:{login:b.login,senha:b.senha}}); S.user=user; shell();
    }catch(err){ $('#m').className='msg err'; $('#m').textContent=err.message; btn.disabled=false; }
  };
}

// ---------- shell ----------
function shell(){
  $('#root').innerHTML = `<div class="app">
    <nav class="side"><div class="brand"><span class="logo">🔧</span> Rafa Busca Peças</div><div id="nav"></div>
      <a id="sair" style="margin-top:14px;color:var(--mut)"><span class="i">⎋</span> Sair</a></nav>
    <main><header class="bar"><b>🔧 Rafa Busca Peças</b></header>
      <div id="main"></div></main>
    <nav class="bottom" id="navb"></nav></div>`;
  $('#sair').onclick=async()=>{ await api('/logout',{method:'POST'}); location.reload(); };
  renderNav(); go(location.hash.indexOf('integracoes')>=0 ? 'integracoes' : S.view);
}
function renderNav(){
  const link=([k,i,l])=>`<a data-v="${k}" class="${k===S.view?'on':''}"><span class="i">${i}</span>${l}</a>`;
  $('#nav').innerHTML=VIEWS.map(link).join('');
  $('#navb').innerHTML=VIEWS.filter(v=>v[0]!=='nova').map(link).join('');
  document.querySelectorAll('[data-v]').forEach(a=>a.onclick=()=>go(a.dataset.v));
}
async function go(v){ S.view=v; if(v!=='nova'){ S.ui.editId=null; S.ui.fotos=[]; } renderNav(); window.scrollTo(0,0);
  const f={painel,estoque,nova,locais,mover,etiquetas,vendas,integracoes}[v]; $('#main').innerHTML='<p class="mut">carregando…</p>'; try{ await f(); }catch(e){ $('#main').innerHTML='<div class="empty">Erro: '+esc(e.message)+'</div>'; } }

// ---------- dados ----------
async function carregaLocais(){ const { locais }=await api('/locais'); S.locais={}; locais.forEach(l=>S.locais[l.id]=l); }
function locPath(id){ const p=[]; let c=S.locais[id],g=0; while(c&&g++<20){ p.unshift(c.nome); c=S.locais[c.pai]; } return p.join(' › '); }
function locChildren(pai){ return Object.values(S.locais).filter(l=>(l.pai||'')===(pai||'')).sort((a,b)=>a.nome.localeCompare(b.nome,'pt',{numeric:true})); }
function locOptions(sel){ return Object.keys(S.locais).map(id=>[id,locPath(id)]).sort((a,b)=>a[1].localeCompare(b[1],'pt',{numeric:true}))
  .map(([id,p])=>`<option value="${id}" ${sel===id?'selected':''}>${esc(p)}</option>`).join(''); }

// ---------- Painel ----------
async function painel(){
  const p=await api('/painel');
  const canais=p.porCanal||[]; const maxC=Math.max(1,...canais.map(c=>c.total));
  const prod=(await api('/relatorios/produtividade?periodo=hoje').catch(()=>({}))).porFuncionario||[];
  $('#main').innerHTML=`<div class="top"><h2>Painel</h2></div>
  <div class="kpis">
    <div class="card kpi"><div class="l">Peças em estoque</div><div class="v">${p.estoque.pecas}</div><div class="small mut">${p.estoque.cadastros} cadastros</div></div>
    <div class="card kpi"><div class="l">Valor do estoque</div><div class="v">${brl(p.estoque.valor)}</div></div>
    <div class="card kpi"><div class="l">Vendas no mês</div><div class="v">${brl(p.vendasMes.total)}</div><div class="small mut">${p.vendasMes.n} vendas</div></div>
    <div class="card kpi clic" data-st="semanuncio"><div class="l">Sem anúncio</div><div class="v">${p.semAnuncio}</div></div>
    <div class="card kpi clic" data-st="semlocal"><div class="l">Sem localização</div><div class="v">${p.semLocal}</div></div>
    <div class="card kpi clic" data-st="parado"><div class="l">Paradas +90 dias</div><div class="v">${p.parado}</div></div>
  </div>
  <div class="card"><b>Vendas do mês por canal</b>
    ${canais.length?canais.map(c=>`<div style="margin-top:10px"><div class="small" style="display:flex;justify-content:space-between"><span>${esc(c.canal)}</span><b>${brl(c.total)}</b></div><div class="bar2" style="width:${c.total/maxC*100}%"></div></div>`).join(''):'<p class="mut small">Nenhuma venda este mês.</p>'}
  </div>
  <div class="card" style="margin-top:14px"><b>Cadastros de hoje por funcionário</b>
    ${prod.length?prod.map(f=>`<div class="sel small"><span style="flex:1">${esc(f.nome)}</span><b>${f.cadastros}</b></div>`).join(''):'<p class="mut small">Nenhum cadastro hoje ainda.</p>'}
  </div>`;
  document.querySelectorAll('[data-st]').forEach(e=>e.onclick=()=>{ S.ui.status=e.dataset.st; S.ui.loc=''; S.ui.q=''; go('estoque'); });
}

// ---------- Estoque ----------
async function estoque(){
  await carregaLocais();
  const chips=[['todos','Todas'],['disp','Disponíveis'],['zerado','Esgotadas'],['semanuncio','Sem anúncio'],['semlocal','Sem local'],['parado','+90 dias']];
  $('#main').innerHTML=`<div class="top"><h2>Estoque</h2>
    <button class="btn sm" id="selbtn">${S.ui.selMode?'✖ Cancelar':'☑️ Selecionar'}</button>
    <a class="btn p" data-v="nova">+ Nova peça</a></div>
    <div class="q" style="margin-bottom:10px"><div class="withmic"><input id="gq" placeholder="Buscar nome, código, part number ou veículo…" value="${esc(S.ui.q)}"><button type="button" class="mic" title="Ditar por voz">🎤</button></div></div>
    <div class="filters">
      <select id="floc"><option value="">Todas as localizações</option>${locOptions(S.ui.loc)}</select>
      ${chips.map(([k,l])=>`<button class="chip ${S.ui.status===k?'on':''}" data-c="${k}">${l}</button>`).join('')}
    </div><div id="lista"><p class="mut">carregando…</p></div>`;
  $('[data-v="nova"]').onclick=()=>go('nova');
  $('#selbtn').onclick=()=>{ S.ui.selMode=!S.ui.selMode; S.ui.sel=new Set(); const b=document.getElementById('bulkbar'); if(b)b.remove(); estoque(); };
  $('#gq').oninput=e=>{ S.ui.q=e.target.value.trim(); clearTimeout(window._t); window._t=setTimeout(listaEstoque,250); };
  $('#floc').onchange=e=>{ S.ui.loc=e.target.value; listaEstoque(); };
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ S.ui.status=b.dataset.c; estoque(); });
  bindMics();
  listaEstoque();
}
async function listaEstoque(){
  const qs=new URLSearchParams(); if(S.ui.q)qs.set('q',S.ui.q); if(S.ui.loc)qs.set('local',S.ui.loc); if(S.ui.status&&S.ui.status!=='todos')qs.set('status',S.ui.status);
  const { pecas }=await api('/pecas?'+qs); S.pecas=pecas;
  const el=$('#lista'); if(!el) return;
  if(!pecas.length){ el.innerHTML='<div class="empty">Nenhuma peça encontrada.</div>'; return; }
  el.innerHTML=`<p class="small mut">${pecas.length} peça(s)${S.ui.selMode?' · toque para selecionar':''}</p><div class="grid">${pecas.map(cardPeca).join('')}</div>`;
  document.querySelectorAll('[data-pid]').forEach(c=>c.onclick=()=>{
    if(S.ui.selMode){ const id=c.dataset.pid;
      if(S.ui.sel.has(id)){ S.ui.sel.delete(id); c.classList.remove('sel'); c.querySelector('.selck').textContent=''; }
      else { S.ui.sel.add(id); c.classList.add('sel'); c.querySelector('.selck').textContent='✓'; }
      renderBulk();
    } else abrePeca(c.dataset.pid);
  });
  renderBulk();
}
function renderBulk(){
  let bar=document.getElementById('bulkbar');
  if(!S.ui.selMode || !S.ui.sel.size){ if(bar)bar.remove(); return; }
  if(!bar){ bar=document.createElement('div'); bar.id='bulkbar'; bar.className='bulkbar'; document.body.appendChild(bar); }
  bar.innerHTML=`<b>${S.ui.sel.size} selecionada(s)</b>
    <button class="btn sm" id="bpreco">💲 Preço</button>
    <button class="btn sm" id="blocal">📍 Mover</button>
    <button class="btn sm" id="bml">🏷️ ML</button>
    <button class="btn sm" id="betq">🖨️ Etiqueta</button>
    <button class="btn sm" id="bclear">Limpar</button>`;
  $('#bpreco').onclick=bulkPreco; $('#blocal').onclick=bulkLocal; $('#bml').onclick=bulkML; $('#betq').onclick=bulkEtiqueta;
  $('#bclear').onclick=()=>{ S.ui.sel=new Set(); estoque(); };
}
function bulkEtiqueta(){ const d=[...S.ui.sel].map(id=>S.pecas.find(p=>p.id===id)).filter(Boolean).map(labelPeca);
  if(!d.length)return toast('Selecione peças'); imprimeLabels(d); }

let _sugT;
function bindSugestoes(){
  const box=()=>$('#sugwrap'); const f=$('#pf'); if(!f) return;
  const atualiza=()=>{ clearTimeout(_sugT); _sugT=setTimeout(async()=>{
    const b=box(); if(!b) return;
    const q=(f.elements.nome.value+' '+f.elements.pn.value).trim();
    if(q.length<2){ b.innerHTML=''; return; }
    let r; try{ r=await api('/sugestoes?q='+encodeURIComponent(q)); }catch{ return; }
    if(!r.sugestoes||!r.sugestoes.length){ b.innerHTML=''; return; }
    b.innerHTML=`<div class="sugbox"><div class="sughd">📋 Peças parecidas no seu cadastro — toque para preencher</div>${r.sugestoes.map((s,i)=>`<div class="sugitem" data-si="${i}"><b>${esc(s.nome)}</b> <span class="mut">${esc([s.marca,s.modelo,s.ano].filter(Boolean).join(' '))}${s.pn?' · PN '+esc(s.pn):''}</span> <span class="sugpr">${brl(s.preco)}</span>${s.n>1?` <span class="mut">· ${s.n}×</span>`:''}</div>`).join('')}</div>`;
    b.querySelectorAll('[data-si]').forEach(el=>el.onclick=()=>{ preencheDe(r.sugestoes[+el.dataset.si]); b.innerHTML=''; });
  },220); };
  ['nome','pn'].forEach(k=>{ const el=f.elements[k]; if(el) el.addEventListener('input',atualiza); });
}
function preencheDe(s){ const f=$('#pf'); const set=(k,v)=>{ if(f.elements[k]!=null && v!=null && v!=='') f.elements[k].value=v; };
  set('nome',s.nome); set('marca',s.marca); set('modelo',s.modelo); set('ano',s.ano); set('pn',s.pn); if(s.cond)set('cond',s.cond); if(s.preco)set('preco',s.preco);
  toast('Preenchido a partir do seu cadastro — confira e ajuste'); if(f.elements.preco)f.elements.preco.focus();
}
// ditar por voz (Web Speech API — grátis; funciona no Google Chrome, em português)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function iniciaDitado(btn){
  if(!SR){ toast('Ditado por voz não disponível aqui. Use o Google Chrome.'); return; }
  const campo=btn.closest('.withmic').querySelector('input,textarea'); if(!campo||btn.classList.contains('on'))return;
  const rec=new SR(); rec.lang='pt-BR'; rec.interimResults=false; rec.maxAlternatives=1;
  btn.classList.add('on'); btn.textContent='🔴';
  rec.onresult=e=>{ let t=(e.results[0][0].transcript||'').trim(); if(!t)return;
    if(!campo.value.trim()) t=t.charAt(0).toUpperCase()+t.slice(1);
    campo.value=campo.value.trim()?(campo.value.trim()+' '+t):t;
    campo.dispatchEvent(new Event('input',{bubbles:true})); campo.focus(); };
  rec.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed')toast('Permita o microfone no navegador.'); else if(ev.error!=='no-speech'&&ev.error!=='aborted')toast('Não consegui ouvir. Tente de novo.'); };
  rec.onend=()=>{ btn.classList.remove('on'); btn.textContent='🎤'; };
  try{ rec.start(); }catch{ btn.classList.remove('on'); btn.textContent='🎤'; }
}
function bindMics(){ document.querySelectorAll('.mic').forEach(b=>{ if(!b._b){ b._b=1; b.onclick=()=>iniciaDitado(b); } }); }
// sugere uma caixa (folha) com espaço livre — tecnologia de "localização inteligente"
function sugereCaixa(){
  const folhas=Object.values(S.locais).filter(l=>locChildren(l.id).length===0);
  const comEspaco=folhas.filter(l=>l.capacidade && (Number(l.ocupacao)||0)<l.capacidade)
    .sort((a,b)=>(b.capacidade-(Number(b.ocupacao)||0))-(a.capacidade-(Number(a.ocupacao)||0))); // mais espaço livre primeiro
  const semLimite=folhas.filter(l=>!l.capacidade);
  const alvo=comEspaco[0]||semLimite[0];
  if(!alvo){ toast('Nenhuma caixa com espaço. Crie uma em Localizações.'); return; }
  const sel=$('#pf').elements.local_id; sel.value=alvo.id;
  toast('Sugerido: '+locPath(alvo.id));
}
function drawThumbs(){ const t=$('#thumbs'); if(!t)return; t.innerHTML=S.ui.fotos.map((f,i)=>`<div><img src="${f.key?'/api/foto/'+f.key:URL.createObjectURL(f.blob)}"><button type="button" data-i="${i}">×</button></div>`).join('');
  t.querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.ui.fotos.splice(+b.dataset.i,1); drawThumbs(); }); }
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{ const M=900,r=Math.min(1,M/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*r|0; c.height=img.height*r|0; c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>res(b),'image/jpeg',0.72); };
  img.onerror=()=>{ URL.revokeObjectURL(u); rej(); }; img.src=u; }); }
async function salvaPeca(e){
  e.preventDefault(); const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
  const fd=Object.fromEntries(new FormData(e.target).entries());
  const keysExistentes=S.ui.fotos.filter(f=>f.key).map(f=>f.key);
  const body={ nome:fd.nome.trim(),marca:fd.marca.trim(),modelo:fd.modelo.trim(),ano:fd.ano.trim(),pn:fd.pn.trim(),cond:fd.cond,veiculo:fd.veiculo.trim(),preco:fd.preco,qtd:fd.qtd,local_id:fd.local_id,obs:fd.obs.trim(),fotos:keysExistentes };
  try{
    let peca; const editando=!!S.ui.editId;
    if(editando) peca=(await api('/pecas/'+S.ui.editId,{method:'PATCH',body})).peca;
    else peca=(await api('/pecas',{method:'POST',body})).peca;
    for(const f of S.ui.fotos){ if(f.blob) await fetch('/api/pecas/'+peca.id+'/foto',{method:'POST',headers:{'content-type':'image/jpeg'},body:f.blob}); }
    toast(editando?'Peça atualizada':'Peça '+cod(peca.codigo)+' cadastrada');
    const manter=!editando && $('#outra') && $('#outra').checked;
    S.ui.editId=null; S.ui.fotos=[];
    if(manter){ await nova(); ['marca','modelo','ano','veiculo','local_id'].forEach(k=>{ const el=$('#pf').elements[k]; if(el) el.value=body[k]||''; }); $('#pf').elements.nome.focus(); }
    else go('estoque');
  }catch(err){ toast('Erro: '+err.message); btn.disabled=false; }
}

  let titulo=[p.nome,p.pn,veic].filter(Boolean).join(' ').replace(/\s+/g,' ').trim(); if(titulo.length>60)titulo=titulo.slice(0,60).replace(/\s\S*$/,'');
  const desc=`${p.nome}${veic?' '+veic:''}\n\n✅ Condição: ${p.cond||'Usada, em bom estado'}\n${p.pn?'🔢 Código original: '+p.pn+'\n':''}🚗 ${p.veiculo?'Retirada de '+p.veiculo+'. ':''}Confira a compatibilidade pelo código antes de comprar.\n📦 Enviamos para todo o Brasil.\n🛡️ Garantia de 90 dias.\n\nCódigo interno: ${cod(p.codigo)}`;
  modal(`<h3>Anúncio pronto</h3><label class="f">Título (${titulo.length}/60)</label><input id="at" value="${esc(titulo)}">
   <div style="margin:8px 0"><button class="btn sm" id="ct">Copiar título</button></div>
   <label class="f">Descrição</label><div class="adbox" id="ad">${esc(desc)}</div>

     <div style="margin-top:8px"><label><input type="checkbox" id="aml" ${p.ml?'checked':''} style="width:auto"> Mercado Livre</label>
     &nbsp;&nbsp;<label><input type="checkbox" id="aolx" ${p.olx?'checked':''} style="width:auto"> OLX</label></div>
     <button class="btn p sm" id="sa" style="margin-top:10px">Salvar</button></div>`);
  $('#ct').onclick=()=>{ navigator.clipboard?.writeText($('#at').value); toast('Título copiado'); };
  $('#cd').onclick=()=>{ navigator.clipboard?.writeText(desc); toast('Descrição copiada'); };
  $('#sa').onclick=async()=>{ await api('/pecas/'+p.id,{method:'PATCH',body:{ml:$('#aml').checked,olx:$('#aolx').checked}}); toast('Salvo'); fecha(); listaEstoque&&listaEstoque(); };
}

function ocupacaoTotal(id){ let t=Number(S.locais[id]&&S.locais[id].ocupacao)||0; for(const c of locChildren(id)) t+=ocupacaoTotal(c.id); return t; }
function nodeHTML(id){ const l=S.locais[id],ch=locChildren(id),open=S.ui.open.has(id),ehCaixa=!ch.length;
  let info;
  if(ehCaixa && l.capacidade){
    const dir=Number(l.ocupacao)||0, cap=l.capacidade, pct=Math.min(100,Math.round(dir/cap*100));
    const cor=pct>=100?'var(--red)':pct>=80?'var(--amber)':'var(--blue)';
    info=`<span class="occ" data-go="${id}"><span class="track" style="width:60px"><span class="fill" style="width:${pct}%;background:${cor}"></span></span><span class="ct">${dir}/${cap}${pct>=100?' · cheia':''}</span></span>`;
  } else {
    const t=ocupacaoTotal(id); info=`<span class="ct" data-go="${id}">${t?t+' peça(s)':''}</span>`;
  }
  return `<li><div class="node"><span class="tg" data-tg="${id}">${ch.length?(open?'▾':'▸'):'·'}</span>
    <span class="nm">${esc(l.nome)}</span>${info}
    <span class="act"><button class="btn sm" data-add="${id}">+</button><button class="btn sm" data-ren="${id}">✏️</button><button class="btn sm" data-del="${id}">🗑</button></span></div>
    ${ch.length&&open?`<ul>${ch.map(c=>nodeHTML(c.id)).join('')}</ul>`:''}</li>`; }
function bindTree(){
  document.querySelectorAll('[data-tg]').forEach(e=>e.onclick=()=>{ const id=e.dataset.tg; S.ui.open.has(id)?S.ui.open.delete(id):S.ui.open.add(id); locais(); });
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{ S.ui.loc=e.dataset.go; S.ui.q=''; S.ui.status='todos'; go('estoque'); });
  document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>novoLocal(e.dataset.add));
  document.querySelectorAll('[data-ren]').forEach(e=>e.onclick=()=>renomear(e.dataset.ren));
  document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>excluirLocal(e.dataset.del));
}
const NIVEIS=['Galpão/Pátio','Prateleira','Nível','Caixa'];
function depth(id){ let d=0,c=S.locais[id]; while(c&&c.pai){ d++; c=S.locais[c.pai]; } return d; }
function novoLocal(pai){ const d=pai?depth(pai)+1:0; const tipo=NIVEIS[Math.min(d,3)]; const irm=locChildren(pai).length;
  const sug=['GALPÃO-','PRT-','NÍVEL-','CAIXA-'][Math.min(d,3)]+(d===2?String.fromCharCode(65+irm):irm+1);
  modal(`<h3>Novo: ${tipo}</h3>${pai?`<p class="mut small">Dentro de ${esc(locPath(pai))}</p>`:''}
   <div class="form"><label class="f">Nome<input id="ln" value="${esc(sug)}"></label><label class="f">Criar várias<input id="lq" type="number" min="1" max="50" value="1"></label>
   <label class="f full">Capacidade — quantas peças cabem (opcional)<input id="lcap" type="number" min="1" placeholder="ex.: 10 — deixe vazio para sem limite"></label></div>
   <p class="small mut">Para várias, use nome terminado em número/letra (CAIXA-1) que o sistema numera em sequência. A capacidade vale para cada uma.</p>
   <div class="top" style="margin-top:12px"><button class="btn p" id="ok">Criar</button><button class="btn" id="cc">Cancelar</button></div>`);
  $('#cc').onclick=fecha; setTimeout(()=>$('#ln')?.select(),40);
  $('#ok').onclick=async()=>{ const nome=$('#ln').value.trim(); if(!nome)return; await api('/locais',{method:'POST',body:{nome,pai:pai||null,quantidade:$('#lq').value,capacidade:$('#lcap').value}}); if(pai)S.ui.open.add(pai); fecha(); toast('Criado'); locais(); };
}
function renomear(id){ const l=S.locais[id]; modal(`<h3>Editar local</h3><label class="f">Nome<input id="ln" value="${esc(l.nome)}"></label>
   <label class="f">Capacidade (peças, opcional — vazio = sem limite)<input id="lcap" type="number" min="1" value="${l.capacidade||''}"></label>
   <div class="top" style="margin-top:12px"><button class="btn p" id="ok">Salvar</button><button class="btn" id="cc">Cancelar</button></div>`);
  $('#cc').onclick=fecha; $('#ok').onclick=async()=>{ const v=$('#ln').value.trim(); if(v){ await api('/locais/'+id,{method:'PATCH',body:{nome:v,capacidade:$('#lcap').value}}); fecha(); locais(); } }; }
async function excluirLocal(id){ try{ await api('/locais/'+id,{method:'DELETE'}); toast('Excluído'); locais(); }catch(e){ toast(e.message); } }

function qrSVG(text){ if(typeof qrcode!=='function')return '<svg viewBox="0 0 10 10"><rect width="10" height="10" fill="#eee"/></svg>';
  const q=qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(); let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; }
function labelPeca(p){ return {qr:'P:'+String(p.codigo).padStart(6,'0'),big:cod(p.codigo),l1:p.nome,l2:[p.marca,p.modelo,p.ano].filter(Boolean).join(' '),l3:p.local_id&&S.locais[p.local_id]?locPath(p.local_id):'',price:brl(p.preco)}; }
function etqData(){ const t=S.ui.etqTipo;
  if(t==='pecas')return [...S.ui.etqSel].map(id=>S.pecas.find(p=>p.id===id)).filter(Boolean).map(labelPeca);
  return [...S.ui.etqSel].filter(id=>S.locais[id]).map(id=>({qr:'L:'+id,big:S.locais[id].nome,l1:locPath(id),l2:'',l3:'',price:''})); }
function previewEtq(){ const el=$('#prev'); if(!el)return; const d=etqData();
  el.innerHTML=d.length?d.map(l=>`<div class="lbl">${qrSVG(l.qr)}<div class="t"><b>${esc(l.big)}</b>${esc(l.l1)}<br><span class="mut">${esc(l.l2)}</span>${l.l3?'<br>📍 '+esc(l.l3):''}${l.price?'<br><b>'+esc(l.price)+'</b>':''}</div></div>`).join(''):'<div class="empty">Selecione itens ao lado.</div>'; }
function imprimeEtq(){ const d=etqData(); if(!d.length)return toast('Selecione itens'); imprimeLabels(d); }
function imprimeLabels(d){ if(!d||!d.length)return toast('Selecione itens');
  // impressora térmica: 1 etiqueta por página, deitada, preenchendo a etiqueta toda
  const W=Math.max(20,parseInt(S.ui.etqW)||100), H=Math.max(15,parseInt(S.ui.etqH)||50);
  const qr=Math.max(8,Math.min(H-3, W*0.42));
  const fB=Math.max(8,Math.round(H/3.2)), fT=Math.max(6,Math.round(H/4.5));
  const w=window.open('','_blank'); w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Etiquetas</title><style>
@page{size:${W}mm ${H}mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,sans-serif}
.e{width:${W}mm;height:${H}mm;display:flex;gap:1.5mm;align-items:center;padding:1.5mm;overflow:hidden;page-break-after:always}
.e:last-child{page-break-after:auto}
.e svg{width:${qr}mm;height:${qr}mm;flex-shrink:0}
.t{flex:1;font-size:${fT}pt;line-height:1.15;overflow:hidden;word-break:break-word}
.t b{font-size:${fB}pt;display:block;line-height:1.1}
.t .pr{font-weight:bold;font-size:${fB}pt}
</style></head><body>${d.map(l=>`<div class="e">${qrSVG(l.qr)}<div class="t"><b>${esc(l.big)}</b>${esc(l.l1)}${l.l2?'<br>'+esc(l.l2):''}${l.l3?'<br>'+esc(l.l3):''}${l.price?'<br><span class="pr">'+esc(l.price)+'</span>':''}</div></div>`).join('')}<script>onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`); w.document.close(); }

let MV={ modo:'mover', destino:'', fila:[], confBox:'', confAchadas:new Set(), confEsper:[] };
async function mover(){
  await carregaLocais();
  $('#main').innerHTML=`<div class="top"><h2>Mover / Conferir com o leitor</h2></div>
   <div class="filters"><button class="chip ${MV.modo==='mover'?'on':''}" data-mm="mover">Mover peças</button><button class="chip ${MV.modo==='conferir'?'on':''}" data-mm="conferir">Conferir caixa</button></div>

  document.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{ MV.modo=b.dataset.mm; mover(); });
  if(MV.modo==='mover') renderMover(); else renderConferir();
}
function renderMover(){
  $('#movbody').innerHTML=`<div class="card">
    <label class="f">Caixa de destino<select id="mdest"><option value="">— escolha —</option>${locOptions(MV.destino)}</select></label>
    <label class="f" style="margin-top:10px">Leia ou digite o código da peça<input id="mscan" placeholder="Ex.: 123 ou P:000123" autocomplete="off"></label>
    <p class="small mut">Aponte o leitor para o QR da peça (ou digite o número) e aperte Enter. Repita para cada peça.</p>
    <div id="mfila"></div>
    <button class="btn p" id="mok" style="margin-top:12px">Mover peças</button>
   </div>`;
  $('#mdest').onchange=e=>{ MV.destino=e.target.value; atualizaMok(); };
  const scan=$('#mscan'); scan.focus();
  scan.onkeydown=async e=>{ if(e.key!=='Enter')return; e.preventDefault(); const v=scan.value.trim(); scan.value=''; if(!v)return;
    const mm=v.match(/^(?:P[:\-]?)?0*(\d+)$/i); if(!mm){ toast('Use o número da peça'); scan.focus(); return; }
    const codigo=parseInt(mm[1]);
    if(MV.fila.find(x=>Number(x.codigo)===codigo)){ toast('Já está na lista'); scan.focus(); return; }

  };
  $('#mok').onclick=async()=>{ if(!MV.destino){ toast('Escolha a caixa de destino'); return; } if(!MV.fila.length){ toast('Leia ao menos uma peça'); return; }
    await api('/mover',{method:'POST',body:{ids:MV.fila.map(p=>p.id),local_id:MV.destino}});
    toast(MV.fila.length+' peça(s) movida(s) para '+locPath(MV.destino)); MV.fila=[]; renderMover();
  };
  renderFila();
}
function renderFila(){ const el=$('#mfila'); if(!el)return;
  el.innerHTML=MV.fila.length?`<div style="margin-top:8px">${MV.fila.map((p,i)=>`<div class="sel small"><span style="flex:1">${cod(p.codigo)} ${esc(p.nome)}</span><span class="mut">${p.local_id&&S.locais[p.local_id]?esc(locPath(p.local_id)):'sem local'}</span><button class="btn sm" data-rm="${i}">✖</button></div>`).join('')}</div>`:'<p class="small mut" style="margin-top:8px">Nenhuma peça lida ainda.</p>';
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ MV.fila.splice(+b.dataset.rm,1); renderFila(); });
  atualizaMok();
}
function atualizaMok(){ const ok=$('#mok'); if(ok){ ok.disabled=!(MV.fila.length&&MV.destino); ok.textContent='Mover '+MV.fila.length+' peça(s)'; } }
async function renderConferir(){
  $('#movbody').innerHTML=`<div class="card">
    <label class="f">Caixa a conferir<select id="cbox"><option value="">— escolha —</option>${locOptions(MV.confBox)}</select></label>
    <div id="cwrap">${MV.confBox?'<p class="small mut">carregando…</p>':'<p class="small mut">Escolha a caixa para começar.</p>'}</div>
   </div>`;
  $('#cbox').onchange=e=>{ MV.confBox=e.target.value; MV.confAchadas=new Set(); renderConferir(); };
  if(!MV.confBox)return;
  const {pecas}=await api('/pecas?local='+MV.confBox); MV.confEsper=pecas.filter(p=>Number(p.qtd)>0);

  scan.onkeydown=e=>{ if(e.key!=='Enter')return; e.preventDefault(); const v=scan.value.trim(); scan.value=''; const mm=v.match(/^(?:P[:\-]?)?0*(\d+)$/i); if(mm)MV.confAchadas.add(parseInt(mm[1])); renderConfRes(); scan.focus(); };
  renderConfRes();

function renderConfRes(){ const el=$('#cres'); if(!el)return; const esp=MV.confEsper||[];
  const codsEsper=new Set(esp.map(p=>Number(p.codigo)));
  const faltando=esp.filter(p=>!MV.confAchadas.has(Number(p.codigo)));
  const fora=[...MV.confAchadas].filter(c=>!codsEsper.has(c));
  el.innerHTML=`<div class="small" style="margin-top:10px">
    <p>✅ Conferidas: <b>${esp.length-faltando.length}</b> de ${esp.length}</p>
    ${faltando.length?`<p class="mut">❌ Faltando (${faltando.length}): ${faltando.map(p=>cod(p.codigo)+' '+esc(p.nome)).join(' · ')}</p>`:'<p style="color:var(--ok)">Tudo conferido nesta caixa. 🎉</p>'}
    ${fora.length?`<p class="mut">⚠️ Lidas que não são desta caixa: ${fora.map(c=>cod(c)).join(', ')}</p>`:''}
  </div>`;
}

// ---------- modal ----------
function modal(html){ $('#modal').innerHTML=`<div class="modal" id="ov"><div class="box"><button class="x" id="xb">×</button>${html}</div></div>`;
  $('#ov').onclick=e=>{ if(e.target.id==='ov')fecha(); }; $('#xb').onclick=fecha; }
function fecha(){ $('#modal').innerHTML=''; }

boot();
</script>
</body>
</html>
