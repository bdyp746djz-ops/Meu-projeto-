      try{ for(let i=0;i<itens.length;i+=50){ $('#improg2').innerHTML=`<span class="spin-s"></span> Importando ${Math.min(i+50,itens.length)} de ${itens.length}… (não feche esta tela)`;
          const r=await api('/importar/pecas',{method:'POST',body:{itens:itens.slice(i,i+50),conflito:conf,evitar}});
          tot.criadas+=r.criadas; tot.iguais+=r.iguais; tot.conf+=r.conflitos.length; tot.renum.push(...r.renumeradas); (tot.lib=tot.lib||[]).push(...(r.liberadas||[])); tot.erros.push(...r.erros); r.locaisCriados.forEach(x=>tot.locais.add(x)); } }
      catch(err){ $('#improg2').innerHTML='⚠️ Parou no meio: '+esc(err.message)+'. Pode importar o mesmo arquivo de novo: o que já entrou não duplica.'; return; }
      $('#improg2').innerHTML=`✅ <b>${tot.criadas} peça(s) importada(s)</b>${tot.locais.size?` · ${tot.locais.size} local(is) criado(s)`:''}${tot.iguais?` · ${tot.iguais} já estavam`:''}${tot.conf?` · ${tot.conf} pulada(s) por número repetido`:''}${tot.renum.length?`<br>Importadas com número novo (reimprima a etiqueta): ${tot.renum.slice(0,10).map(x=>esc(cod(x.de)+' → '+cod(x.para))).join(', ')}${tot.renum.length>10?' …':''}`:''}${(tot.lib||[]).length?`<br>Peças que já estavam no sistema e mudaram de número (reimprima a etiqueta delas): ${tot.lib.slice(0,10).map(x=>esc(x.nome+' '+cod(x.de)+' → '+cod(x.para))).join(', ')}${tot.lib.length>10?' …':''}`:''}${tot.erros.length?`<br>⚠️ ${tot.erros.length} com erro: ${tot.erros.slice(0,5).map(x=>esc(x.codigo+' '+x.motivo)).join('; ')}`:''}`;
      toast('✅ Importação concluída'); try{ await carregaLocais(); const {pecas}=await api('/pecas?todas=1'); S.pecas=pecas; }catch(_){ } if(S.view==='estoque')listaEstoque(); };
  };
}

// ---------- Vendas ----------
async function vendas(){
  const { vendas:lista }=await api('/vendas?periodo='+S.ui.periodo);
  const ok=lista.filter(v=>!v.cancelada); const tot=ok.reduce((a,v)=>a+v.total,0);
  if(S.view!=='vendas')return; // usuário já foi para outra tela
  $('#main').innerHTML=`<div class="top"><h2>Vendas</h2><button class="btn sm" id="vexp" ${lista.length?'':'disabled'}>⬇️ Exportar planilha</button></div>
   <div class="filters">${[['hoje','Hoje'],['7d','7 dias'],['30d','30 dias'],['mes','Este mês'],['mesant','Mês passado']].map(([k,l])=>`<button class="chip ${S.ui.periodo===k?'on':''}" data-p="${k}">${l}</button>`).join('')}</div>
   <div class="kpis"><div class="card kpi"><div class="l">Faturamento</div><div class="v">${brl(tot)}</div></div><div class="card kpi"><div class="l">Vendas</div><div class="v">${ok.length}</div></div><div class="card kpi"><div class="l">Ticket médio</div><div class="v">${brl(ok.length?tot/ok.length:0)}</div></div></div>
   ${lista.length?`<div class="tw"><table><tr><th>Data</th><th>Peça</th><th>Qtd</th><th>Total</th><th>Canal</th><th>Pagamento</th><th></th></tr>
   ${lista.map(v=>`<tr style="${v.cancelada?'opacity:.5;text-decoration:line-through':''}"><td>${new Date(v.data).toLocaleDateString('pt-BR')}</td><td>${cod(v.codigo)} ${esc(v.nome)}</td><td>${v.qtd}</td><td><b>${brl(v.total)}</b></td><td>${esc(v.canal)}</td><td>${esc(v.pagamento||'—')}</td><td>${v.cancelada?'':`<button class="btn sm" data-cv="${v.id}">Cancelar</button>`}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma venda no período.</div>'}`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ S.ui.periodo=b.dataset.p; vendas(); });
  if(lista.length)$('#vexp').onclick=()=>baixarCSV('vendas-'+S.ui.periodo+'-'+new Date().toISOString().slice(0,10),
    [['Data',v=>new Date(v.data).toLocaleString('pt-BR')],['Código',v=>cod(v.codigo)],['Peça',v=>v.nome],['Qtd',v=>v.qtd],['Valor unitário',v=>num(v.unit)],['Total',v=>num(v.total)],['Canal',v=>v.canal],['Pagamento',v=>v.pagamento],['Cliente',v=>v.cliente],['Retirado de',v=>v.local_path],['Pedido ML',v=>v.ml_pedido],['Situação',v=>v.cancelada?'Cancelada':'OK']],lista);
  document.querySelectorAll('[data-cv]').forEach(b=>b.onclick=async()=>{ if(confirm('Cancelar esta venda? A peça volta ao estoque.')){ await api('/vendas/'+b.dataset.cv+'/cancelar',{method:'POST'}); toast('Venda cancelada'); vendas(); } });
}

// ---------- Mover / Conferir com o leitor ----------
let MV={ modo:'mover', destino:'', fila:[], confBox:'', confAchadas:new Set(), confEsper:[] };
async function mover(){
  await carregaLocais();
  if(S.view!=='mover')return; // usuário já foi para outra tela
  $('#main').innerHTML=`<div class="top"><h2>Mover / Conferir com o leitor</h2></div>
   <div class="filters"><button class="chip ${MV.modo==='mover'?'on':''}" data-mm="mover">Mover peças</button><button class="chip ${MV.modo==='conferir'?'on':''}" data-mm="conferir">Conferir caixa</button></div>
   <div id="movbody"></div>`;
  document.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{ MV.modo=b.dataset.mm; mover(); });
  if(MV.modo==='mover') renderMover(); else renderConferir();
}
function renderMover(){
  $('#movbody').innerHTML=`<div class="card">
    <label class="f">Caixa de destino<select id="mdest"><option value="">— escolha —</option>${locOptions(MV.destino)}</select></label>
    <label class="f" style="margin-top:10px">Leia ou digite o código da peça<input id="mscan" placeholder="Ex.: 123 ou P:000123" autocomplete="off"></label>
    <p class="small mut">Aponte o leitor para o QR da peça (ou digite o número) e aperte Enter. Repita para cada peça.</p>
    <div id="mfila"></div>
    <button class="btn p" id="mok" style="margin-top:12px">Mover peças</button>
   </div>`;
  $('#mdest').onchange=e=>{ MV.destino=e.target.value; atualizaMok(); };
  const scan=$('#mscan'); scan.focus();
  scan.onkeydown=async e=>{ if(e.key!=='Enter')return; e.preventDefault(); const v=scan.value.trim(); scan.value=''; if(!v)return;
    const codigo=lePeca(v); if(codigo==null){ toast('Use o número da peça'); scan.focus(); return; }
    if(MV.fila.find(x=>Number(x.codigo)===codigo)){ toast('Já está na lista'); scan.focus(); return; }
    try{ const {peca}=await api('/peca-codigo/'+codigo); MV.fila.push(peca); renderFila(); }
    catch{ toast('Peça '+cod(codigo)+' não encontrada'); }
    scan.focus();
  };
  $('#mok').onclick=async()=>{ if(!MV.destino){ toast('Escolha a caixa de destino'); return; } if(!MV.fila.length){ toast('Leia ao menos uma peça'); return; }
    await api('/mover',{method:'POST',body:{ids:MV.fila.map(p=>p.id),local_id:MV.destino}});
    toast(MV.fila.length+' peça(s) movida(s) para '+locPath(MV.destino)); MV.fila=[]; renderMover();
  };
  renderFila();
}
function renderFila(){ const el=$('#mfila'); if(!el)return;
  el.innerHTML=MV.fila.length?`<div style="margin-top:8px">${MV.fila.map((p,i)=>`<div class="sel small"><span style="flex:1">${cod(p.codigo)} ${esc(p.nome)}</span><span class="mut">${p.local_id&&S.locais[p.local_id]?esc(locPath(p.local_id)):'sem local'}</span><button class="btn sm" data-rm="${i}">✖</button></div>`).join('')}</div>`:'<p class="small mut" style="margin-top:8px">Nenhuma peça lida ainda.</p>';
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ MV.fila.splice(+b.dataset.rm,1); renderFila(); });
  atualizaMok();
}
function atualizaMok(){ const ok=$('#mok'); if(ok){ ok.disabled=!(MV.fila.length&&MV.destino); ok.textContent='Mover '+MV.fila.length+' peça(s)'; } }
async function renderConferir(){
  $('#movbody').innerHTML=`<div class="card">
    <label class="f">Caixa a conferir<select id="cbox"><option value="">— escolha —</option>${locOptions(MV.confBox)}</select></label>
    <div id="cwrap">${MV.confBox?'<p class="small mut">carregando…</p>':'<p class="small mut">Escolha a caixa para começar.</p>'}</div>
   </div>`;
  $('#cbox').onchange=e=>{ MV.confBox=e.target.value; MV.confAchadas=new Set(); renderConferir(); };
  if(!MV.confBox)return;
  const {pecas}=await api('/pecas?local='+MV.confBox); MV.confEsper=pecas.filter(p=>Number(p.qtd)>0);
  $('#cwrap').innerHTML=`<label class="f" style="margin-top:4px">Leia/digite as peças que estão na caixa<input id="cscan" placeholder="Ex.: 123" autocomplete="off"></label><div id="cres"></div>`;
  const scan=$('#cscan'); scan.focus();
  scan.onkeydown=e=>{ if(e.key!=='Enter')return; e.preventDefault(); const v=scan.value.trim(); scan.value=''; const cp=lePeca(v); if(cp!=null)MV.confAchadas.add(cp); renderConfRes(); scan.focus(); };
  renderConfRes();
}
function renderConfRes(){ const el=$('#cres'); if(!el)return; const esp=MV.confEsper||[];
  const codsEsper=new Set(esp.map(p=>Number(p.codigo)));
  const faltando=esp.filter(p=>!MV.confAchadas.has(Number(p.codigo)));
  const fora=[...MV.confAchadas].filter(c=>!codsEsper.has(c));
  el.innerHTML=`<div class="small" style="margin-top:10px">
    <p>✅ Conferidas: <b>${esp.length-faltando.length}</b> de ${esp.length}</p>
    ${faltando.length?`<p class="mut">❌ Faltando (${faltando.length}): ${faltando.map(p=>cod(p.codigo)+' '+esc(p.nome)).join(' · ')}</p>`:'<p style="color:var(--ok)">Tudo conferido nesta caixa. 🎉</p>'}
    ${fora.length?`<p class="mut">⚠️ Lidas que não são desta caixa: ${fora.map(c=>cod(c)).join(', ')}</p>`:''}
  </div>`;
}

// ---------- modal ----------
// ---------- Download do estoque (planilha CSV que abre no Excel) ----------
const num=v=>v==null||v===''?'':String(Number(v)||0).replace('.',',');
// planilha CSV que abre no Excel (BOM, separador ;, protege fórmulas)
function baixarCSV(nome,cols,linhas){
  const cel=v=>{ v=v==null?'':String(v); if(/^[=+\-@]/.test(v)&&isNaN(Number(v.replace(',','.'))))v="'"+v; return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const txt=[cols.map(c=>c[0]).join(';'),...linhas.map(p=>cols.map(([,f])=>cel(f(p))).join(';'))].join('\r\n');
  const blob=new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8'});
  entregaArquivo(blob,nome+'.csv');
  toast(linhas.length+' linha(s) na planilha');
}
async function baixarEstoque(){
  try{
    toast('Gerando planilha…');
    await carregaLocais();
    const { pecas }=await api('/pecas?todas=1');
    baixarCSV('estoque-rafa-busca-pecas-'+new Date().toISOString().slice(0,10),[['Código',p=>cod(p.codigo)],['Peça',p=>p.nome],['Marca',p=>p.marca],['Modelo',p=>p.modelo],['Ano',p=>p.ano],['Part number',p=>p.pn],['Condição',p=>p.cond],['Qualidade',p=>p.qualidade],['Sucata de origem',p=>p.veiculo],['Preço',p=>num(p.preco)],['Custo',p=>num(p.custo)],['Quantidade',p=>p.qtd],['Localização',p=>p.local_id&&S.locais[p.local_id]?locPath(p.local_id):''],['Item de segurança',p=>p.seguranca?'Sim':''],['Rastreável',p=>p.rastreavel?'Sim':''],['Peso (g)',p=>p.peso_g],['Altura (cm)',p=>num(p.alt_cm)],['Largura (cm)',p=>num(p.larg_cm)],['Comprimento (cm)',p=>num(p.comp_cm)],['Fotos',p=>(p.fotos||[]).length],['Etiqueta impressa',p=>p.etq_em?dataBR(p.etq_em):''],['Mercado Livre',p=>p.ml?'Sim':'Não'],['Status ML',p=>p.ml?stML(p.ml_status):''],['Link ML',p=>p.ml_link],['Observações',p=>p.obs]],pecas);
  }catch(e){ toast('Erro: '+e.message); }
}

// ---------- Leitor de QR pela câmera ----------
let jsqrPromessa=null;
function carregaJsQR(){ if(window.jsQR)return Promise.resolve();
  if(!jsqrPromessa)jsqrPromessa=new Promise((ok,err)=>{ const sc=document.createElement('script'); sc.src='/jsQR.js'; sc.onload=ok; sc.onerror=()=>{ jsqrPromessa=null; err(new Error('não carregou o leitor')); }; document.head.appendChild(sc); });
  return jsqrPromessa; }
async function escanear(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return toast('Este navegador não libera a câmera');
  modal(`<h3>Escanear etiqueta</h3><p class="small mut">Aponte a câmera para o QR da peça ou da caixa.</p>
    <div class="scanbox"><video id="scv" playsinline muted autoplay></video><div class="scanmira"></div></div>
    <p class="small mut" id="scmsg">Abrindo a câmera…</p>`);
  let stream;
  try{ await carregaJsQR(); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); }
  catch(e){ const m=$('#scmsg'); if(m)m.textContent='Não consegui abrir a câmera: '+(e.name==='NotAllowedError'?'permissão negada — libere a câmera para este site nas configurações do navegador':e.message); return; }
  const v=$('#scv'); if(!v){ stream.getTracks().forEach(t=>t.stop()); return; }
  v.srcObject=stream; await v.play().catch(()=>{});
  $('#scmsg').textContent='Procurando QR…';
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  const para=()=>stream.getTracks().forEach(t=>t.stop());
  const loop=()=>{
    if(!document.body.contains(v)){ para(); return; }
    if(v.readyState>=2&&v.videoWidth){
      const w=Math.min(640,v.videoWidth), h=Math.round(v.videoHeight*w/v.videoWidth); cv.width=w; cv.height=h; cx.drawImage(v,0,0,w,h);
      const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});
      if(r&&r.data){ para(); if(navigator.vibrate)navigator.vibrate(80); fecha(); tratarCodigo(r.data.trim()); return; }
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
// P:000123 = peça · L:<id> = localização · outro texto = busca
async function tratarCodigo(t){
  const cp=/^\d+$/.test(t)?null:lePeca(t);
  if(cp!=null){ try{ const { peca }=await api('/peca-codigo/'+cp); abreFicha(peca); }catch(e){ toast('Peça '+cod(cp)+' não encontrada'); } return; }
  const lc=leLocal(t);
  if(lc){ await carregaLocais(); if(!S.locais[lc])return toast('Localização não encontrada'); S.ui.loc=lc; S.ui.q=''; S.ui.status='todos'; await go('estoque'); toast('📍 '+locPath(lc)); return; }
  S.ui.q=t; S.ui.status='todos'; S.ui.loc=''; go('estoque');
}

function modal(html){ $('#modal').innerHTML=`<div class="modal" id="ov"><div class="box"><button class="x" id="xb">×</button>${html}</div></div>`;
  $('#ov').onclick=e=>{ if(e.target.id==='ov')fecha(); }; $('#xb').onclick=fecha; }
function fecha(){ $('#modal').innerHTML=''; }

// o app instalável foi retirado: desliga o serviço que algum aparelho tenha registrado nesse meio-tempo
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  if(window.caches)caches.keys().then(ks=>ks.filter(k=>/^rafa-/.test(k)).forEach(k=>caches.delete(k))).catch(()=>{}); }catch(_){ } }

// ---------- versão nova do sistema ----------
// o iPhone deixa a página aberta na memória e não pega sozinho o que foi publicado: confere de tempos em tempos
let versaoAtual=null;
const assinaturaHtml=t=>{ let h=0; for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0; return h; };
async function versaoServidor(){ const r=await fetch('/?v='+Date.now(),{cache:'no-store'}); if(!r.ok)throw 0; return assinaturaHtml(await r.text()); }
function podeRecarregar(){ if(S.view==='nova'||$('#modal').innerHTML.trim())return false;
  return ![...document.querySelectorAll('textarea,input[type=text],input:not([type])')].some(e=>e.value&&e.value.trim()&&e.id!=='gbusca'&&e.id!=='pgass'); }
async function confereVersao(aoVoltar){
  try{ const v=await versaoServidor(); if(versaoAtual==null){ versaoAtual=v; return; } if(v===versaoAtual)return;
    if(aoVoltar&&podeRecarregar()){ location.reload(); return; }
    if(!$('#novaversao')){ const d=document.createElement('div'); d.id='novaversao';
      d.style.cssText='position:fixed;left:12px;right:12px;bottom:84px;z-index:60;background:#212121;color:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 4px 12px rgba(0,0,0,.3);font-size:14px;cursor:pointer;text-align:center';
      d.innerHTML='🔄 <b>Tem versão nova do sistema</b> — toque aqui para atualizar'; d.onclick=()=>location.reload(); document.body.appendChild(d); }
  }catch(_){ }
}
confereVersao(false);
setInterval(()=>confereVersao(false),5*60e3);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible')confereVersao(true); });
boot();
