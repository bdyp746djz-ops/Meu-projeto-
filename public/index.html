<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafa Busca Peças</title>
<meta name="theme-color" content="#3f51b5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="/qrcode.min.js"></script>
<style>
:root{--pri:#3f51b5;--pri2:#5c6bc0;--pri-t:#e8eaf6;--red:#d32f2f;--red2:#e53935;--ink:#212121;--mut:#757575;--line:#e0e0e0;--bg:#f5f5f5;--card:#fff;--ok:#2e7d32;--amber:#f9a825;--olx:#6e0ad6;--blue:#1565c0;--rad:4px;--sh:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12);--sh2:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px 0 rgba(0,0,0,.14),0 1px 18px 0 rgba(0,0,0,.12);--tb:64px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.material-icons{font-family:'Material Icons';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
/* carregando */
.splash{position:fixed;inset:0;background:var(--pri);display:grid;place-items:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--pri)}
.authcard{background:#fff;border-radius:var(--rad);box-shadow:var(--sh2);padding:26px;width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand .logo{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:18px}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:400;margin:14px 0 2px}
input,select,textarea{width:100%;border:0;border-bottom:1px solid #bdbdbd;border-radius:0;padding:8px 2px;background:transparent;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{border:1px solid #bdbdbd;border-radius:var(--rad);padding:8px 10px}
input:focus,select:focus{outline:0;border-bottom-color:var(--pri);box-shadow:0 1px 0 0 var(--pri)}
textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.msg{margin-top:12px;font-size:13px;min-height:16px}.msg.err{color:var(--red)}
.linkb{background:none;border:0;color:var(--pri);font-weight:500;cursor:pointer;font-size:13px;padding:0;margin-top:14px}
/* barra superior */
.topbar{position:sticky;top:0;z-index:30;height:var(--tb);background:var(--pri);color:#fff;display:flex;align-items:center;box-shadow:0 2px 4px -1px rgba(0,0,0,.2),0 4px 5px 0 rgba(0,0,0,.14),0 1px 10px 0 rgba(0,0,0,.12)}
.tb-brand{width:235px;flex-shrink:0;padding-left:28px;line-height:1;cursor:pointer;user-select:none}
.tb-brand b{display:block;font-size:20px;font-weight:900;letter-spacing:.12em;font-style:italic}
.tb-brand small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin-top:3px}
.tb-search{flex:1;max-width:710px;padding:0 16px 0 84px}
.tb-search input{background:#fff;border:0;border-radius:2px;padding:11px 16px;color:var(--ink)}
.tb-search input:focus{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.tb-btn{margin-left:auto;margin-right:14px;background:none;border:0;color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.tb-btn:hover{background:rgba(255,255,255,.14)}
.tb-btn .material-icons{font-size:26px}
.scanbox{position:relative;background:#000;border-radius:var(--rad);overflow:hidden;height:min(78vw,380px);margin:10px 0}
.scanbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanmira{position:absolute;left:50%;top:50%;width:62%;height:62%;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.95);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
/* shell */
.app{display:flex;min-height:calc(100vh - var(--tb))}
nav.side{width:235px;background:#fff;border-right:1px solid var(--line);padding:12px 0;flex-shrink:0;position:sticky;top:var(--tb);align-self:flex-start;height:calc(100vh - var(--tb));overflow-y:auto}
nav a{position:relative;display:flex;align-items:center;gap:22px;padding:12px 26px;color:#424242;text-decoration:none;font-weight:400;font-size:14.5px;cursor:pointer;transition:background .13s,color .13s}
nav a .i{width:24px;text-align:center;color:#616161}
nav a.on{background:var(--pri-t);color:var(--pri);font-weight:500}
nav a.on .i{color:var(--pri)}
nav a:not(.on):hover{background:#f5f5f5}
main{flex:1;min-width:0;padding:22px 26px 30px;display:flex;flex-direction:column}
#main{flex:1}
.foot{text-align:center;color:#9e9e9e;font-size:13px;padding:28px 0 6px}
nav.bottom{display:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h2{margin:0;font-size:21px;font-weight:500;flex:1}
.q input{width:100%}
@media(max-width:760px){
 :root{--tb:56px}
 .tb-brand{width:auto;padding:0 12px 0 14px}
 .tb-brand b{font-size:16px}.tb-brand small{font-size:8px}
 .tb-search{padding:0 4px 0 0}
 .tb-btn{margin-right:6px}
 .tb-search input{padding:9px 12px}
 nav.side{display:none}main{padding:14px 12px 96px}
 nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;box-shadow:0 -2px 6px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom)}
 nav.bottom a{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:7px 1px;color:#757575;text-align:center}
 nav.bottom a .i{color:inherit;font-size:22px;width:auto}
 nav.bottom a.on{background:transparent;color:var(--pri)}
}
/* lista no estilo Drive Parts (etiquetas) */
.dp-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#e8e8e8;margin:-22px -26px 18px;padding:10px 26px}
.dp-busca{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;color:#757575;margin:0}
.dp-busca input{border:0;background:transparent;padding:9px 0;font-size:15px}
.dp-busca input:focus{box-shadow:none}
.dp-ops{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dp-op{display:flex;align-items:center;gap:6px;color:#757575;font-size:13.5px;white-space:nowrap}
.dp-op select{width:auto;border:0;padding:4px 2px;color:#424242;font-size:13.5px;background:transparent}
.dp-op select:focus{box-shadow:none}
.dp-gerar{display:inline-flex;align-items:center;gap:6px;background:#4caf50;color:#fff;border:0;border-radius:2px;padding:9px 14px;font-weight:500;font-size:13px;letter-spacing:.02em;cursor:pointer;box-shadow:var(--sh)}
.dp-gerar:hover{filter:brightness(1.07)}
.dp-gerar .material-icons{font-size:17px}
.dp-gerar .n{background:rgba(255,255,255,.28);border-radius:9px;padding:0 7px;font-size:12px}
.dp-mini{max-width:960px;margin:0 auto 8px;font-size:13px;color:#9e9e9e;text-align:right}
.dp-mini a{color:var(--pri);cursor:pointer}
.dp-lista{background:#fff;box-shadow:var(--sh);border-radius:2px;margin:0 auto;max-width:960px}
.dp-row{display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid #eee;cursor:pointer}
.dp-row:last-child{border-bottom:0}
.dp-row:hover{background:#fafafa}
.dp-ft{width:84px;height:84px;flex-shrink:0;background:#eceff1;display:grid;place-items:center;color:#90a4ae;overflow:hidden;position:relative}
.dp-ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dp-ft .material-icons{font-size:36px}
.dp-tx{flex:1;min-width:0}
.dp-tt{color:#1e88e5;font-size:15px;line-height:1.3}
.dp-sb{color:#9e9e9e;font-size:13px;margin-top:4px;line-height:1.4}
.dp-ck{width:36px;height:36px;border-radius:50%;border:0;background:#9e9e9e;color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0}
.dp-ck .material-icons{font-size:20px}
.dp-row.on .dp-ck{background:#eeeeee;color:#757575}
.dp-chk{max-height:52vh;overflow:auto;padding:4px 0}
.dp-ci{display:flex;align-items:center;gap:14px;padding:6px 4px;color:#616161;font-size:14px;cursor:pointer}
.dp-ci input{width:18px;height:18px;margin:0;flex-shrink:0}
.dp-cfg{display:flex;gap:18px;flex-wrap:wrap;padding:12px 4px 4px;border-top:1px solid #eee;margin-top:8px;font-size:13px;color:#757575;align-items:center}
.dp-cfg input{width:62px;display:inline-block;text-align:center}
.dp-rod{display:flex;justify-content:center;gap:30px;border-top:1px solid #eee;margin-top:10px;padding:14px 0 2px}
.dp-tb{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:#424242;font-size:14px;letter-spacing:.03em;cursor:pointer;padding:6px}
.dp-tb .material-icons{font-size:17px}
.dp-azul{background:var(--pri)}
.dp-gerar:disabled{background:#bdbdbd;cursor:not-allowed;box-shadow:none}
.dp-st{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#9e9e9e}
.dp-st .material-icons{font-size:18px}
.dp-st.ok{color:var(--ok)}
.dp-cx{max-width:960px;margin:0 auto 14px}
.dp-pub{display:inline-block;margin-top:5px;font-size:12px;color:#9e9e9e}
.dp-pub.on{color:var(--ok);font-weight:500}
.dp-ac{flex-shrink:0}
.dp-act{display:inline-flex;align-items:center;gap:5px;color:var(--pri);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.02em;padding:8px 6px}
.dp-act .material-icons{font-size:17px}
.dp-act.mut{color:#9e9e9e}
@media(max-width:760px){
 .dp-bar{margin:-14px -12px 12px;padding:8px 12px}
 .dp-ops{gap:10px;width:100%}.dp-gerar{margin-left:auto}
 .dp-row{padding:12px;gap:12px}.dp-ft{width:58px;height:58px}
 .dp-tt{font-size:14px}.dp-sb{font-size:12px}
 .dp-row{flex-wrap:wrap}.dp-ac{width:100%;display:flex;justify-content:flex-end}
}
.lc-row{display:flex;align-items:center;gap:10px;padding:10px 14px 10px calc(12px + var(--d,0)*24px);border-bottom:1px solid #eee}
.lc-row:last-child{border-bottom:0}
.lc-row:hover{background:#fafafa}
.lc-tg{width:24px;color:#757575;cursor:pointer;flex-shrink:0;user-select:none}
.lc-ic{color:#90a4ae;flex-shrink:0}
.lc-tx{flex:1;min-width:0}
.lc-nm{font-weight:500;font-size:15px}
.lc-sig{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-t);border-radius:3px;padding:1px 6px;letter-spacing:.03em;vertical-align:1px}
.lc-sb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:#9e9e9e}
.lc-sb .ct{cursor:pointer}
.lc-rg{display:inline-flex;align-items:center;gap:3px;color:#7e57c2}
.lc-rg .material-icons{font-size:14px}
.lc-ac{display:flex;gap:2px;flex-shrink:0}
.lc-b{width:36px;height:36px;border:0;background:none;border-radius:50%;color:#757575;display:grid;place-items:center;cursor:pointer;padding:0}
.lc-b:hover{background:#eee;color:var(--ink)}
.lc-b .material-icons{font-size:20px}
@media(max-width:760px){.lc-row{flex-wrap:wrap;padding-left:calc(6px + var(--d,0)*12px)}.lc-ac{width:100%;justify-content:flex-end}.lc-b{width:34px;height:34px}}
.mlsec{margin:14px 0 4px;padding-top:12px;border-top:1px solid #eee}
.mlcats{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.mlcat{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid #e0e0e0;border-radius:var(--rad);cursor:pointer;font-size:13.5px;line-height:1.35}
.mlcat.on{border-color:var(--pri);background:var(--pri-t)}
.mlcat input{width:auto;margin:3px 0 0;flex-shrink:0}
.mlbusca{display:flex;gap:8px;align-items:center}
.mlattrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 16px}
.mlmais{margin-top:8px}.mlmais summary{cursor:pointer;color:var(--pri);font-size:13px;padding:6px 0}
/* componentes */
.btn{border:1px solid #d0d0d0;background:#fff;border-radius:var(--rad);padding:9px 16px;cursor:pointer;font-weight:500;color:var(--ink);text-decoration:none;display:inline-block;transition:filter .13s,box-shadow .13s,background .13s}
.btn:hover{background:#f5f5f5}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:var(--sh)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:var(--sh)}
.btn.p:hover,.btn.g:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55}
.card{background:#fff;border:0;border-radius:var(--rad);padding:14px;box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px;margin-bottom:18px}
.kpi .l{color:var(--mut);font-size:12.5px;font-weight:600}.kpi .v{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.kpi.clic{cursor:pointer;transition:box-shadow .15s,transform .15s}
.kpi.clic:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}
.pc{position:relative;background:#fff;border:0;border-radius:var(--rad);overflow:hidden;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.pc:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.pc.sel{outline:3px solid var(--pri);outline-offset:-2px}
.selck{position:absolute;left:7px;top:7px;z-index:3;width:24px;height:24px;border-radius:6px;background:#fff;border:2px solid var(--pri);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:14px}
.bulkbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1d1f23;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.28);flex-wrap:wrap;max-width:94vw}
.pc .ph{position:relative;height:150px;background:linear-gradient(135deg,#eef1f4,#e3e7ec);display:grid;place-items:center;color:#9aa1ab;font-size:30px;overflow:hidden}
.pc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .ph .loc{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(21,101,192,.94);color:#fff;font-size:10.5px;font-weight:700;border-radius:7px;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ph .loc.none{background:rgba(198,40,40,.94)}
.pc .b{padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.pc .n{font-weight:700;font-size:13.5px;line-height:1.25}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:5px;padding:2px 7px;background:#eef0f3;color:#333;white-space:nowrap}
.tag.price{background:#e7f6ee;color:var(--ok);font-weight:700}.tag.ml{background:#fff6d6;color:#8a6d00}.tag.olx{background:#efe3ff;color:#54279e}.tag.zero{background:#fdecea;color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #d7dbe0;border-radius:20px;padding:6px 12px;background:#fff;cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.sugbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh);background:#fff}
.sughd{background:#f7f8fa;padding:7px 11px;font-size:12px;color:var(--mut);font-weight:700}
.sugitem{padding:9px 11px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.sugitem:hover{background:var(--pri-t)}
.sugpr{color:var(--ok);font-weight:700}
.withmic{position:relative}
.withmic>input,.withmic>textarea{width:100%;padding-right:46px}
.mic{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#eef0f3;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
.withmic.ta .mic{top:8px;transform:none}
.mic.on{background:var(--pri-t);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.mut{color:var(--mut)}.small{font-size:13px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed #d7dbe0}
.tree>ul{padding-left:0;border:0}
.node{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:7px}.node:hover{background:#f4f5f7}
.node .tg{width:20px;text-align:center;cursor:pointer;color:var(--mut)}
.node .nm{font-weight:700}.node .ct{font-size:12px;color:var(--mut);cursor:pointer}
.node .act{margin-left:auto;display:flex;gap:4px}
.occ{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.occ .track{display:inline-block;height:7px;border-radius:4px;background:#eef0f3;overflow:hidden}
.occ .fill{display:block;height:100%;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:26px 12px;overflow:auto}
.modal .box{background:#fff;border-radius:var(--rad);box-shadow:var(--sh2);max-width:680px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:23px;cursor:pointer;color:var(--mut)}
.photos{display:flex;gap:8px;overflow-x:auto}.photos img{height:130px;border-radius:9px;object-fit:cover}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:21px;height:21px;background:var(--red);color:#fff;cursor:pointer;font-size:12px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lbl{border:1px dashed #9ca3af;border-radius:7px;background:#fff;padding:8px;display:flex;gap:8px;align-items:center}
.lbl svg{width:80px;height:80px;flex-shrink:0}.lbl .t{font-size:12px;line-height:1.25;overflow:hidden}.lbl .t b{font-size:14px;display:block}
.sel{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:9px;z-index:60;font-size:14px;max-width:90vw}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.bar2{height:8px;border-radius:4px;background:var(--pri2)}
.adbox{white-space:pre-wrap;background:#f7f8fa;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13.5px}
</style>
</head>
<body>
<div id="root"><div class="splash"><div class="spin"></div></div></div>
<div id="modal"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cod = n => '#'+String(n).padStart(6,'0');
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

async function api(path, opts={}){
  const o = { headers:{}, ...opts };
  if (o.body && !(o.body instanceof Blob) && typeof o.body!=='string'){ o.body=JSON.stringify(o.body); o.headers['content-type']='application/json'; }
  const r = await fetch('/api'+path, o);
  let d={}; try{ d=await r.json(); }catch{}
  if(!r.ok) throw new Error(d.erro || ('erro '+r.status));
  return d;
}

// ---------- boot / auth ----------
async function boot(){
  if(location.pathname==='/api/ml/callback'){ return mlFinaliza(); }
  try{ const { user } = await api('/me'); S.user=user; shell(); }
  catch{ login(false); }
}
async function mlFinaliza(){
  $('#root').innerHTML='<div class="center"><div class="authcard"><div class="brand"><span class="logo">🔧</span> Rafa Busca Peças</div><p class="mut">Finalizando conexão com o Mercado Livre…</p></div></div>';
  const p=new URLSearchParams(location.search);
  try{
    const err=p.get('error'); if(err) throw new Error('Mercado Livre recusou: '+err);
    await api('/ml/exchange',{method:'POST',body:{code:p.get('code'),state:p.get('state')}});
  }catch(e){ /* o motivo fica salvo e aparece na tela de Integrações */ }
  location.replace('/#integracoes');
}

async function go(v){ S.view=v; if(v!=='nova'){ S.ui.editId=null; S.ui.fotos=[]; } renderNav(); window.scrollTo(0,0);

async function carregaLocais(){ const { locais }=await api('/locais'); S.locais={}; locais.forEach(l=>S.locais[l.id]=l); }
function locPath(id){ const p=[]; let c=S.locais[id],g=0; while(c&&g++<20){ p.unshift(c.nome); c=S.locais[c.pai]; } return p.join(' › '); }
function locChildren(pai){ return Object.values(S.locais).filter(l=>(l.pai||'')===(pai||'')).sort((a,b)=>a.nome.localeCompare(b.nome,'pt',{numeric:true})); }
function locOptions(sel){ return Object.keys(S.locais).map(id=>[id,locPath(id)]).sort((a,b)=>a[1].localeCompare(b[1],'pt',{numeric:true}))
  .map(([id,p])=>`<option value="${id}" ${sel===id?'selected':''}>${esc(p)}</option>`).join(''); }

async function estoque(){
  await carregaLocais();
  const chips=[['todos','Todas'],['disp','Disponíveis'],['zerado','Esgotadas'],['semanuncio','Sem anúncio'],['semlocal','Sem local'],['parado','+90 dias']];
  $('#main').innerHTML=`<div class="top"><h2>Consulta de Peças</h2>
    <button class="btn sm" id="dlbtn" title="Baixar planilha do estoque">⬇️ Download</button>
    <button class="btn sm" id="selbtn">${S.ui.selMode?'✖ Cancelar':'☑️ Selecionar'}</button>
    <a class="btn p" data-v="nova">+ Nova peça</a></div>
    <div class="q" style="margin-bottom:10px"><div class="withmic"><input id="gq" placeholder="Buscar nome, código, part number ou veículo…" value="${esc(S.ui.q)}"><button type="button" class="mic" title="Ditar por voz">🎤</button></div></div>
    <div class="filters">
      <select id="floc"><option value="">Todas as localizações</option>${locOptions(S.ui.loc)}</select>
      ${chips.map(([k,l])=>`<button class="chip ${S.ui.status===k?'on':''}" data-c="${k}">${l}</button>`).join('')}
    </div><div id="lista"><p class="mut">carregando…</p></div>`;
  $('[data-v="nova"]').onclick=()=>go('nova');
  $('#dlbtn').onclick=baixarEstoque;
  $('#selbtn').onclick=()=>{ S.ui.selMode=!S.ui.selMode; S.ui.sel=new Set(); const b=document.getElementById('bulkbar'); if(b)b.remove(); estoque(); };
  $('#gq').oninput=e=>{ S.ui.q=e.target.value.trim(); clearTimeout(window._t); window._t=setTimeout(listaEstoque,250); };
  $('#floc').onchange=e=>{ S.ui.loc=e.target.value; listaEstoque(); };
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ S.ui.status=b.dataset.c; estoque(); });
  bindMics();
  listaEstoque();
}
async function listaEstoque(){
  const qs=new URLSearchParams(); if(S.ui.q)qs.set('q',S.ui.q); if(S.ui.loc)qs.set('local',S.ui.loc); if(S.ui.status&&S.ui.status!=='todos')qs.set('status',S.ui.status);
  const { pecas }=await api('/pecas?'+qs); S.pecas=pecas;
  const el=$('#lista'); if(!el) return;
  if(!pecas.length){ el.innerHTML='<div class="empty">Nenhuma peça encontrada.</div>'; return; }
  el.innerHTML=`<p class="small mut">${pecas.length} peça(s)${S.ui.selMode?' · toque para selecionar':''}</p><div class="grid">${pecas.map(cardPeca).join('')}</div>`;
  document.querySelectorAll('[data-pid]').forEach(c=>c.onclick=()=>{
    if(S.ui.selMode){ const id=c.dataset.pid;
      if(S.ui.sel.has(id)){ S.ui.sel.delete(id); c.classList.remove('sel'); c.querySelector('.selck').textContent=''; }
      else { S.ui.sel.add(id); c.classList.add('sel'); c.querySelector('.selck').textContent='✓'; }
      renderBulk();
    } else abrePeca(c.dataset.pid);
  });
  renderBulk();
}
function renderBulk(){
  let bar=document.getElementById('bulkbar');
  if(!S.ui.selMode || !S.ui.sel.size){ if(bar)bar.remove(); return; }
  if(!bar){ bar=document.createElement('div'); bar.id='bulkbar'; bar.className='bulkbar'; document.body.appendChild(bar); }
  bar.innerHTML=`<b>${S.ui.sel.size} selecionada(s)</b>
    <button class="btn sm" id="bpreco">💲 Preço</button>
    <button class="btn sm" id="blocal">📍 Mover</button>
    <button class="btn sm" id="bml">🏷️ ML</button>
    <button class="btn sm" id="betq">🖨️ Etiqueta</button>
    <button class="btn sm" id="bclear">Limpar</button>`;
  $('#bpreco').onclick=bulkPreco; $('#blocal').onclick=bulkLocal; $('#bml').onclick=bulkML; $('#betq').onclick=bulkEtiqueta;
  $('#bclear').onclick=()=>{ S.ui.sel=new Set(); estoque(); };
}

function cardPeca(p){
  const img=p.fotos&&p.fotos[0]?`<img src="/api/foto/${p.fotos[0]}" alt="">`:'📦';
  const loc=p.local_id&&S.locais[p.local_id]?`<span class="loc">📍 ${esc(locPath(p.local_id))}</span>`:'<span class="loc none">sem localização</span>';
  const q=Number(p.qtd)||0;
  const checked=S.ui.selMode&&S.ui.sel.has(p.id);
  return `<div class="pc${checked?' sel':''}" data-pid="${p.id}">${S.ui.selMode?`<div class="selck">${checked?'✓':''}</div>`:''}<div class="ph">${img}${loc}</div><div class="b">
    <div class="n">${esc(p.nome)}</div>
    <div class="small mut">${esc([p.marca,p.modelo,p.ano].filter(Boolean).join(' '))}${p.pn?' · PN '+esc(p.pn):''}</div>
    <div class="tags"><span class="tag price">${brl(p.preco)}</span><span class="tag ${q>0?'':'zero'}">${q} un</span><span class="tag">${cod(p.codigo)}</span>${p.ml?'<span class="tag ml">ML</span>':''}${p.olx?'<span class="tag olx">OLX</span>':''}</div>
  </div></div>`;
}

async function publicarML(p){
  let cfg; try{ cfg=await api('/config'); }catch{ cfg={}; }
  if(!(cfg.ml&&cfg.ml.conectado))return toast('Conecte o Mercado Livre primeiro (Anúncios ML → Conexão)');
  modal('<h3>Montando anúncio…</h3><p class="mut small">Buscando as categorias no Mercado Livre.</p>');
  let r; try{ r=await api('/ml/rascunho/'+p.id); }catch(e){ fecha(); return toast(e.message); }
  const d=r.rascunho, st={cats:d.categorias||[],cat:d.categoria,attrs:[],vals:{}};
  const sku=String(p.codigo).padStart(6,'0');
  const daPeca={BRAND:p.marca,MODEL:p.modelo,PART_NUMBER:p.pn,OEM:p.pn,ORIGINAL_PART_NUMBER:p.pn,SELLER_SKU:sku,VEHICLE_YEAR:p.ano};
  modal(`<h3>Publicar no Mercado Livre</h3>
   <label class="f">Título (máx. 60)<input id="mtit" maxlength="60" value="${esc(d.titulo)}"></label>
   <div class="form"><label class="f">Preço (R$)<input id="mpre" type="number" step="0.01" min="0" value="${esc(d.preco)}"></label>
   <label class="f">Tipo do anúncio<select id="mtipo"><option value="gold_special">Clássico</option><option value="free">Grátis (bom p/ testar)</option><option value="gold_pro">Premium</option></select></label></div>
   <div class="mlsec"><b>Categoria</b> <span class="small mut">— sugeridas pelo Mercado Livre a partir do título</span>
     <div id="mcats" class="mlcats"></div>
     <div class="mlbusca"><input id="mcq" placeholder="Não é nenhuma? Busque outra (ex.: farol, módulo de injeção)"><button class="btn sm" id="mcb" type="button">Buscar</button></div></div>
   <div class="mlsec"><b>Ficha técnica</b> <span class="small mut">— * = obrigatório no Mercado Livre</span><div id="mattrs"><p class="small mut">Escolha a categoria.</p></div></div>
   <label class="f">Descrição<textarea id="mdesc" rows="5" style="width:100%">${esc(d.desc)}</textarea></label>
   <p class="small mut">${d.fotos.length} foto(s) · Condição: usado · Garantia do vendedor: 90 dias</p>
   <div class="card small" style="background:#fff7e6;box-shadow:none;margin:8px 0">⚠️ Ao publicar, o anúncio fica <b>ativo no Mercado Livre</b>. Confira os dados; depois dá pra pausar ou excluir pela sua conta do ML.</div>
   <div class="top" style="margin-top:12px"><button class="btn p" id="mok">🛒 Publicar de verdade</button><button class="btn" id="mcc">Cancelar</button></div>`);
  const valorDe=a=>{ if(a.id in st.vals)return st.vals[a.id]; const c=st.cats.find(x=>x.id===st.cat)||{}; const pv=(c.previstos||{})[a.id];
    if(pv&&pv.nome)return pv.nome; if(daPeca[a.id])return String(daPeca[a.id]);
    if(a.id==='EMPTY_GTIN_REASON'){ const v=a.valores.find(x=>/n[aã]o tem c[oó]digo|sem c[oó]digo/i.test(x.nome)); if(v)return v.nome; }
    return ''; };
  const campo=a=>{ const v=valorDe(a); let inp;
    if(a.valores.length&&a.tipo!=='number_unit') inp=`<input data-at="${a.id}" list="dl_${a.id}" value="${esc(v)}" placeholder="${a.valores.length>12?'digite ou escolha':'escolha'}" autocomplete="off"><datalist id="dl_${a.id}">${a.valores.map(x=>`<option value="${esc(x.nome)}">`).join('')}</datalist>`;
    else if(a.tipo==='number') inp=`<input data-at="${a.id}" type="number" step="any" value="${esc(v)}">`;
    else if(a.tipo==='number_unit') inp=`<input data-at="${a.id}" value="${esc(v)}" placeholder="ex.: 10 ${esc(a.unidade||a.unidades[0]||'')}">`;
    else inp=`<input data-at="${a.id}" value="${esc(v)}" ${a.max?`maxlength="${a.max}"`:''} autocomplete="off">`;
    return `<label class="f">${esc(a.nome)}${a.obrig?' <b style="color:var(--red)">*</b>':''}${a.cond?' <span class="mut">(pode ser exigido)</span>':''}${inp}${a.dica?`<span class="small mut" style="display:block;font-weight:400">${esc(a.dica)}</span>`:''}</label>`; };

let _sugT;
function bindSugestoes(){
  const box=()=>$('#sugwrap'); const f=$('#pf'); if(!f) return;
  const atualiza=()=>{ clearTimeout(_sugT); _sugT=setTimeout(async()=>{

    b.innerHTML=`<div class="sugbox"><div class="sughd">📋 Peças parecidas no seu cadastro — toque para preencher</div>${r.sugestoes.map((s,i)=>`<div class="sugitem" data-si="${i}"><b>${esc(s.nome)}</b> <span class="mut">${esc([s.marca,s.modelo,s.ano].filter(Boolean).join(' '))}${s.pn?' · PN '+esc(s.pn):''}</span> <span class="sugpr">${brl(s.preco)}</span>${s.n>1?` <span class="mut">· ${s.n}×</span>`:''}</div>`).join('')}</div>`;
    b.querySelectorAll('[data-si]').forEach(el=>el.onclick=()=>{ preencheDe(r.sugestoes[+el.dataset.si]); b.innerHTML=''; });

function preencheDe(s){ const f=$('#pf'); const set=(k,v)=>{ if(f.elements[k]!=null && v!=null && v!=='') f.elements[k].value=v; };
  set('nome',s.nome); set('marca',s.marca); set('modelo',s.modelo); set('ano',s.ano); set('pn',s.pn); if(s.cond)set('cond',s.cond); if(s.preco)set('preco',s.preco);
  toast('Preenchido a partir do seu cadastro — confira e ajuste'); if(f.elements.preco)f.elements.preco.focus();

// ditar por voz (Web Speech API — grátis; funciona no Google Chrome, em português)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function iniciaDitado(btn){
  if(!SR){ toast('Ditado por voz não disponível aqui. Use o Google Chrome.'); return; }
  const campo=btn.closest('.withmic').querySelector('input,textarea'); if(!campo||btn.classList.contains('on'))return;
  const rec=new SR(); rec.lang='pt-BR'; rec.interimResults=false; rec.maxAlternatives=1;
  btn.classList.add('on'); btn.textContent='🔴';
  rec.onresult=e=>{ let t=(e.results[0][0].transcript||'').trim(); if(!t)return;
    if(!campo.value.trim()) t=t.charAt(0).toUpperCase()+t.slice(1);
    campo.value=campo.value.trim()?(campo.value.trim()+' '+t):t;
    campo.dispatchEvent(new Event('input',{bubbles:true})); campo.focus(); };
  rec.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed')toast('Permita o microfone no navegador.'); else if(ev.error!=='no-speech'&&ev.error!=='aborted')toast('Não consegui ouvir. Tente de novo.'); };
  rec.onend=()=>{ btn.classList.remove('on'); btn.textContent='🎤'; };
  try{ rec.start(); }catch{ btn.classList.remove('on'); btn.textContent='🎤'; }
}
function bindMics(){ document.querySelectorAll('.mic').forEach(b=>{ if(!b._b){ b._b=1; b.onclick=()=>iniciaDitado(b); } }); }
// sugere uma caixa (folha) com espaço livre — tecnologia de "localização inteligente"
function sugereCaixa(){
  const f=$('#pf'), r=regraPara(f.elements.nome.value), alvo=melhorCaixa(r?r.l.id:'');
  if(!alvo){ toast('Nenhuma caixa com espaço. Crie uma em Localizações.'); return; }
  f.elements.local_id.value=alvo.id; dicaLocal(alvo,r);
}
function dicaLocal(cx,r){ const el=$('#locdica'); if(el)el.innerHTML=`📍 <b>${esc(codigoTxt(cx.id))}</b> — ${esc(locPath(cx.id))}${r?` <span class="mut">· regra “${esc(r.w)}”</span>`:''}`; }
// localização inteligente: ao terminar de digitar o nome, se o local estiver vazio, escolhe pela regra
function autoLocal(){ const f=$('#pf'); if(!f||f.elements.local_id.value)return; const r=regraPara(f.elements.nome.value); if(!r)return;
  const cx=melhorCaixa(r.l.id); if(cx){ f.elements.local_id.value=cx.id; dicaLocal(cx,r); } }
function drawThumbs(){ const t=$('#thumbs'); if(!t)return; t.innerHTML=S.ui.fotos.map((f,i)=>`<div><img src="${f.key?'/api/foto/'+f.key:URL.createObjectURL(f.blob)}"><button type="button" data-i="${i}">×</button></div>`).join('');
  t.querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.ui.fotos.splice(+b.dataset.i,1); drawThumbs(); }); }
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{ const M=900,r=Math.min(1,M/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*r|0; c.height=img.height*r|0; c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>res(b),'image/jpeg',0.72); };
  img.onerror=()=>{ URL.revokeObjectURL(u); rej(); }; img.src=u; }); }
async function salvaPeca(e){
  e.preventDefault(); const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
  const fd=Object.fromEntries(new FormData(e.target).entries());

  const keysExistentes=S.ui.fotos.filter(f=>f.key).map(f=>f.key);
  const body={ nome:fd.nome.trim(),marca:fd.marca.trim(),modelo:fd.modelo.trim(),ano:fd.ano.trim(),pn:fd.pn.trim(),cond:fd.cond,veiculo:fd.veiculo.trim(),preco:fd.preco,qtd:fd.qtd,local_id:fd.local_id,obs:fd.obs.trim(),fotos:keysExistentes };
  try{
    let peca; const editando=!!S.ui.editId;
    if(editando) peca=(await api('/pecas/'+S.ui.editId,{method:'PATCH',body})).peca;
    else peca=(await api('/pecas',{method:'POST',body})).peca;
    for(const f of S.ui.fotos){ if(f.blob) await fetch('/api/pecas/'+peca.id+'/foto',{method:'POST',headers:{'content-type':'image/jpeg'},body:f.blob}); }
    toast(editando?'Peça atualizada':'Peça '+cod(peca.codigo)+' cadastrada');
    const manter=!editando && $('#outra') && $('#outra').checked;
    S.ui.editId=null; S.ui.fotos=[];

// ---------- Localizações (com Localização Inteligente) ----------
const ICON_NIVEL=['warehouse','view_week','layers'];
// sigla curta de cada nível (ex.: GALPÃO-1 → 01, PRT-17E → 17E, NÍVEL-A → A, CAIXA-1 → CX1)
function siglaDe(id){ const l=S.locais[id]; if(!l)return ''; if(l.sigla)return String(l.sigla).toUpperCase();
  const d=depth(id), folha=d>0&&!locChildren(id).length, t=String(l.nome).trim().split(/[-\s]+/).pop()||l.nome;
  let s=t.length<=4?t:t.slice(0,3);
  if(d===0&&/^\d+$/.test(s))s=s.padStart(2,'0');
  if(folha&&/^(caixa|cx)/.test(nrm(l.nome))&&!/^cx/i.test(s))s='CX'+s;
  return s.toUpperCase(); }
// código curto no padrão da etiqueta da caixa: caixa → ['01 – 17E D 6','CX1'] · demais níveis → ['','01 – 17E D']
function siglasAte(id){ const ids=[]; let c=S.locais[id],g=0; while(c&&g++<20){ ids.unshift(c.id); c=S.locais[c.pai]; } return ids.map(siglaDe); }
const juntaSig=sg=>sg.length?sg[0]+(sg.length>1?' – '+sg.slice(1).join(' '):''):'';
const ehCaixa=id=>depth(id)>0&&!locChildren(id).length;
function codigoLocal(id){ const sg=siglasAte(id); if(ehCaixa(id)){ const u=sg.pop(); return [juntaSig(sg),u]; } return ['',juntaSig(sg)]; }
const codigoTxt=id=>codigoLocal(id).filter(Boolean).join(' · ');
const regrasDe=l=>String(l&&l.regras||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
// regra que casa com o nome da peça (a palavra mais específica vence)
function regraPara(nome){ const t=nrm(nome); let m=null;
  for(const l of Object.values(S.locais))for(const w of regrasDe(l)){ const n=nrm(w); if(n&&t.includes(n)&&(!m||n.length>m.n.length))m={l,w,n}; }
  return m; }
function folhasDe(raiz){ const r=[]; const v=id=>{ const ch=locChildren(id); if(!ch.length){ if(id)r.push(S.locais[id]); } else ch.forEach(c=>v(c.id)); }; v(raiz||''); return r; }
// caixa com mais espaço livre (dentro da área, se houver); sem limite fica por último
function melhorCaixa(raiz){ const f=folhasDe(raiz);
  const com=f.filter(l=>l.capacidade&&(Number(l.ocupacao)||0)<l.capacidade).sort((a,b)=>(b.capacidade-(Number(b.ocupacao)||0))-(a.capacidade-(Number(a.ocupacao)||0)));
  return com[0]||f.find(l=>!l.capacidade)||null; }
async function locais(){
  await carregaLocais();
  const ui=S.ui; ui.locQ=ui.locQ||'';
  $('#main').innerHTML=`<div class="dp-bar">
     <label class="dp-busca"><span class="material-icons">search</span><input id="lq" placeholder="Procurar localização..." value="${esc(ui.locQ)}" autocomplete="off"></label>
     <div class="dp-ops">
       <button class="dp-gerar dp-azul" id="lint"><span class="material-icons">auto_awesome</span>LOCALIZAÇÃO INTELIGENTE</button>
       <button class="dp-gerar" id="addr"><span class="material-icons">add</span>GALPÃO / PÁTIO</button>
     </div></div>
   <div class="dp-lista" id="llista"></div>`;
  const desenha=()=>{
    const q=nrm(ui.locQ).split(/\s+/).filter(Boolean); let html;
    if(q.length){ const l=Object.keys(S.locais).filter(id=>{ const t=nrm(locPath(id)+' '+codigoTxt(id)+' '+(S.locais[id].regras||'')); return q.every(w=>t.includes(w)); }).sort((a,b)=>locPath(a).localeCompare(locPath(b),'pt',{numeric:true}));
      html=l.map(id=>nodeHTML(id,0,true)).join(''); }
    else html=locChildren('').map(l=>nodeHTML(l.id,0)).join('');
    $('#llista').innerHTML=html||`<div class="empty">${q.length?'Nada encontrado.':'Nenhuma localização ainda. Comece criando um Galpão/Pátio.'}</div>`;
    bindTree();
  };
  $('#lq').oninput=e=>{ ui.locQ=e.target.value; desenha(); };
  $('#addr').onclick=()=>novoLocal('');
  $('#lint').onclick=telaRegras;
  S.ui._redesenhaLoc=desenha; desenha();
}
function ocupacaoTotal(id){ let t=Number(S.locais[id]&&S.locais[id].ocupacao)||0; for(const c of locChildren(id)) t+=ocupacaoTotal(c.id); return t; }
function nodeHTML(id,d,plano){ const l=S.locais[id],ch=locChildren(id),open=S.ui.open.has(id),folha=!ch.length;
  let info;
  if(folha&&l.capacidade){ const dir=Number(l.ocupacao)||0, cap=l.capacidade, pct=Math.min(100,Math.round(dir/cap*100));
    const cor=pct>=100?'var(--red)':pct>=80?'var(--amber)':'var(--ok)';
    info=`<span class="occ" data-go="${id}"><span class="track" style="width:70px"><span class="fill" style="width:${pct}%;background:${cor}"></span></span><span class="ct">${dir}/${cap}${pct>=100?' · cheia':' · '+(cap-dir)+' livre(s)'}</span></span>`; }
  else { const t=ocupacaoTotal(id); info=`<span class="ct" data-go="${id}">${t} peça(s)</span>`; }
  const rg=regrasDe(l);
  const ic=folha&&depth(id)>0?'inventory_2':ICON_NIVEL[Math.min(depth(id),2)];
  return `<div class="lc-row" style="--d:${plano?0:d}">
    <span class="lc-tg material-icons" ${ch.length&&!plano?`data-tg="${id}"`:''}>${ch.length&&!plano?(open?'expand_more':'chevron_right'):''}</span>
    <span class="material-icons lc-ic">${ic}</span>
    <div class="lc-tx"><div class="lc-nm">${esc(plano?locPath(id):l.nome)} <span class="lc-sig">${esc(codigoTxt(id))}</span></div>
      <div class="lc-sb">${info}${rg.length?` <span class="lc-rg" title="Regras de localização automática"><span class="material-icons">auto_awesome</span>${esc(rg.join(', '))}</span>`:''}</div></div>
    <div class="lc-ac">
      <button class="lc-b" data-add="${id}" title="Criar dentro"><span class="material-icons">add</span></button>
      <button class="lc-b" data-etq="${id}" title="Etiqueta"><span class="material-icons">qr_code_2</span></button>
      <button class="lc-b" data-ren="${id}" title="Editar / regras"><span class="material-icons">edit</span></button>
      <button class="lc-b" data-del="${id}" title="Excluir"><span class="material-icons">delete_outline</span></button></div></div>
    ${ch.length&&open&&!plano?ch.map(c=>nodeHTML(c.id,d+1)).join(''):''}`; }
function bindTree(){
  const red=()=>S.ui._redesenhaLoc?S.ui._redesenhaLoc():locais();
  document.querySelectorAll('[data-tg]').forEach(e=>e.onclick=()=>{ const id=e.dataset.tg; S.ui.open.has(id)?S.ui.open.delete(id):S.ui.open.add(id); red(); });
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{ S.ui.loc=e.dataset.go; S.ui.q=''; S.ui.status='todos'; go('estoque'); });
  document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>novoLocal(e.dataset.add));
  document.querySelectorAll('[data-etq]').forEach(e=>e.onclick=()=>abreGerador([itemLocal(e.dataset.etq)]));
  document.querySelectorAll('[data-ren]').forEach(e=>e.onclick=()=>renomear(e.dataset.ren));
  document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>excluirLocal(e.dataset.del));
}
// visão geral das regras
function telaRegras(){
  const com=Object.keys(S.locais).filter(id=>regrasDe(S.locais[id]).length).sort((a,b)=>locPath(a).localeCompare(locPath(b),'pt',{numeric:true}));

     :'<div class="empty" style="padding:14px">Nenhuma regra ainda. Toque no ✏️ de um galpão, prateleira ou caixa e escreva as palavras (ex.: <b>farol, lanterna, retrovisor</b>).</div>'}
   <label class="f">Testar: nome de uma peça<input id="rtst" placeholder="ex.: Farol dianteiro direito"></label>
   <div class="small" id="rres" style="margin-top:8px;min-height:20px"></div>`);
  $('#rtst').oninput=e=>{ const n=e.target.value.trim(); if(!n){ $('#rres').textContent=''; return; } const r=regraPara(n), cx=melhorCaixa(r?r.l.id:'');
    $('#rres').innerHTML=cx?`📍 Vai para <b>${esc(codigoTxt(cx.id))}</b> — ${esc(locPath(cx.id))}${r?` <span class="mut">(regra: “${esc(r.w)}”)</span>`:' <span class="mut">(sem regra: caixa com mais espaço)</span>'}`:'Nenhuma caixa com espaço.'; };
}
const NIVEIS=['Galpão/Pátio','Prateleira','Nível','Caixa'];
function depth(id){ let d=0,c=S.locais[id]; while(c&&c.pai){ d++; c=S.locais[c.pai]; } return d; }
function novoLocal(pai){ const d=pai?depth(pai)+1:0; const tipo=NIVEIS[Math.min(d,3)]; const irm=locChildren(pai).length;
  const sug=['GALPÃO-','PRT-','NÍVEL-','CAIXA-'][Math.min(d,3)]+(d===2?String.fromCharCode(65+irm):irm+1);
  modal(`<h3>Novo: ${tipo}</h3>${pai?`<p class="mut small">Dentro de ${esc(locPath(pai))}</p>`:''}
   <div class="form"><label class="f">Nome<input id="ln" value="${esc(sug)}"></label><label class="f">Criar várias<input id="lq" type="number" min="1" max="50" value="1"></label>

   <p class="small mut">Para várias, use nome terminado em número/letra (CAIXA-1) que o sistema numera em sequência. A capacidade vale para cada uma.</p>
   <div class="top" style="margin-top:12px"><button class="btn p" id="ok">Criar</button><button class="btn" id="cc">Cancelar</button></div>`);

}
function renomear(id){ const l=S.locais[id]; const auto=(()=>{ const sv=l.sigla; l.sigla=''; const x=siglaDe(id); l.sigla=sv; return x; })();
  modal(`<h3>Editar local</h3><p class="small mut">${esc(locPath(id))}</p>
   <label class="f">Nome<input id="ln" value="${esc(l.nome)}"></label>
   <label class="f">Sigla na etiqueta (opcional — automático: <b>${esc(auto)}</b>)<input id="lsg" maxlength="12" value="${esc(l.sigla||'')}" placeholder="${esc(auto)}"></label>
   <label class="f">Capacidade (peças, opcional — vazio = sem limite)<input id="lcap" type="number" min="1" value="${l.capacidade||''}"></label>
   <label class="f">Regras de localização automática — palavras separadas por vírgula<textarea id="lrg" rows="2" placeholder="ex.: farol, lanterna, retrovisor">${esc(l.regras||'')}</textarea></label>
   <p class="small mut">Peças com essas palavras no nome serão guardadas aqui (ou na caixa com mais espaço dentro deste local).</p>
   <div class="top" style="margin-top:12px"><button class="btn p" id="ok">Salvar</button><button class="btn" id="cc">Cancelar</button></div>`);
  $('#cc').onclick=fecha; $('#ok').onclick=async()=>{ const v=$('#ln').value.trim(); if(!v)return;
    await api('/locais/'+id,{method:'PATCH',body:{nome:v,capacidade:$('#lcap').value,sigla:$('#lsg').value,regras:$('#lrg').value}}); fecha(); toast('Local salvo'); locais(); }; }
async function excluirLocal(id){ try{ await api('/locais/'+id,{method:'DELETE'}); toast('Excluído'); locais(); }catch(e){ toast(e.message); } }

const LOJA='Rafa Busca Peças', SITE='rafabuscapecas';
const nrm=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const dataBR=ms=>ms?new Date(Number(ms)).toLocaleDateString('pt-BR'):'—';
function itemPeca(p){

function itemLocal(id){ const [cima,baixo]=codigoLocal(id); return { tipo:'local', rotulo:codigoTxt(id)+' — '+locPath(id), qr:'L:'+id, acima:cima, grande:baixo }; }

  $('#eq').oninput=e=>{ ui.etqQ=e.target.value; desenha(); };

  $('#etodos').onclick=()=>{ vis.forEach(id=>ui.etqSel.add(id)); desenha(); };

  desenha();
}
// janela "Gerar etiquetas": confere a lista, cópias e tamanho → IMPRIMIR abre o PDF
function abreGerador(itens){

   <div class="dp-cfg"><label>Cópias de cada <input id="gcop" type="number" min="1" max="50" value="1"></label>
     <label>Tamanho da etiqueta (mm) <input id="gw" type="number" min="20" value="${W}"> × <input id="gh" type="number" min="15" value="${H}"></label></div>
   <div class="dp-rod"><button class="dp-tb" id="gimp"><span class="material-icons">add_circle_outline</span>IMPRIMIR</button><button class="dp-tb" id="gfec"><span class="material-icons">highlight_off</span>FECHAR</button></div>`);
  $('#gfec').onclick=fecha;
  $('#gimp').onclick=async()=>{
    const sel=[...document.querySelectorAll('.dp-ci input')].filter(c=>c.checked).map(c=>itens[+c.dataset.i]);
    if(!sel.length)return toast('Marque ao menos uma etiqueta');

    try{ const url=await gerarPDF(sel,cop);
      if(win&&!win.closed) win.location.href=url; else { const a=document.createElement('a'); a.href=url; a.download='etiquetas.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
      fecha(); }
    catch(e){ if(win)win.close(); toast('Erro: '+e.message); }
  };

let pdfPromessa=null;
function carregaPDF(){ if(window.jspdf)return Promise.resolve();
  if(!pdfPromessa)pdfPromessa=new Promise((ok,err)=>{ const sc=document.createElement('script'); sc.src='/jspdf.umd.min.js'; sc.onload=ok; sc.onerror=()=>{ pdfPromessa=null; err(new Error('não carregou o gerador de PDF')); }; document.head.appendChild(sc); });
  return pdfPromessa; }
const PT=0.3528; // 1 ponto em mm
const pdfTxt=x=>String(x??'').replace(/›/g,'>').replace(/[–—]/g,'-').replace(/[^\x20-\x7E -ÿ]/g,'').trim();
async function gerarPDF(itens,copias){
  await carregaPDF();
  const W=Math.max(20,parseFloat(S.ui.etqW)||100), H=Math.max(15,parseFloat(S.ui.etqH)||50), ori=W>=H?'landscape':'portrait';
  const doc=new window.jspdf.jsPDF({orientation:ori,unit:'mm',format:[W,H]});
  doc.setProperties({title:'Gerador de Etiquetas',creator:LOJA});
  let n=0;
  for(const it of itens)for(let c=0;c<(copias||1);c++){ if(n++)doc.addPage([W,H],ori); it.tipo==='local'?desenhaLocal(doc,it,W,H):desenhaPeca(doc,it,W,H); }
  return doc.output('bloburl');
}
function qrPDF(doc,txt,x,y,t){ const q=qrcode(0,'M'); q.addData(txt); q.make(); const n=q.getModuleCount(), m=t/n; doc.setFillColor(0,0,0);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))doc.rect(x+c*m,y+r*m,m+0.02,m+0.02,'F'); }
// escreve um bloco de linhas centralizado na altura, reduzindo a fonte até caber
function blocoTexto(doc,partes,x,w,H,pad){
  // 1º: cada linha longa encolhe sozinha (até 60%) pra caber no nº de linhas dela
  for(const pt of partes){ pt.k=1; const t=pdfTxt(pt.t); if(!t)continue; doc.setFont('helvetica',pt.bold?'bold':'normal');
    while(pt.k>0.6){ doc.setFontSize(pt.size*pt.k); if(doc.splitTextToSize(t,w).length<=(pt.max||2))break; pt.k-=0.04; } }
  // 2º: se o bloco não couber na altura, reduz tudo junto
  for(let k=1;;k-=0.05){
    const lin=[]; let alt=0, estourou=false, ultimo=k<=0.42;
    for(const pt of partes){ const t=pdfTxt(pt.t); if(!t)continue; const fs=pt.size*pt.k*k;
      doc.setFont('helvetica',pt.bold?'bold':'normal'); doc.setFontSize(fs);
      let ls=doc.splitTextToSize(t,w); const mx=pt.max||2;
      if(ls.length>mx){ estourou=true; if(ultimo){ ls=ls.slice(0,mx); ls[mx-1]=ls[mx-1].replace(/\s*\S{0,3}$/,'')+'...'; } }
      for(const l of ls){ lin.push({l,fs,b:pt.bold,c:pt.centro}); alt+=fs*PT*1.2; } }
    if((alt<=H-2*pad&&!estourou)||ultimo){ let y=Math.max(pad,(H-alt)/2);
      for(const L of lin){ doc.setFont('helvetica',L.b?'bold':'normal'); doc.setFontSize(L.fs); if(L.c)doc.text(L.l,x+w/2,y+L.fs*PT*0.92,{align:'center'}); else doc.text(L.l,x,y+L.fs*PT*0.92); y+=L.fs*PT*1.2; }
      return; }
  }
}
// etiqueta de peça: loja, veículo em negrito, PN/sucata, código, peça · QR à direita · site na vertical
function desenhaPeca(doc,it,W,H){
  const pad=Math.min(W,H)*0.06, vt=H*0.09, q=Math.min(H-2*pad,W*0.33);
  const qx=W-pad-vt-q; qrPDF(doc,it.qr,qx,(H-q)/2,q);
  doc.setFont('helvetica','bold'); doc.setFontSize(10); const w10=doc.getTextWidth(SITE);
  const fsv=Math.min(10*(H-2*pad)*0.78/w10, vt/(0.72*PT)); doc.setFontSize(fsv); const sw=doc.getTextWidth(SITE);
  doc.text(SITE, W-pad-vt+(vt-fsv*PT*0.72)/2, (H-sw)/2, {angle:-90});
  const k=H/50;
  blocoTexto(doc,[{t:it.loja,size:10*k,max:1},{t:it.titulo,size:14*k,bold:true,max:2},...it.linhas.map(l=>({t:l,size:10*k,max:1})),{t:it.rodape,size:11*k,max:2}],pad,qx-pad*1.8,H,pad);
}
// etiqueta de caixa/prateleira: QR à esquerda, caminho e nome grande
function desenhaLocal(doc,it,W,H){
  const pad=Math.min(W,H)*0.06, q=Math.min(H-2*pad,W*0.42);
  qrPDF(doc,it.qr,pad,(H-q)/2,q);
  const x=pad+q+pad*1.5, k=H/50;
  blocoTexto(doc,[{t:it.acima,size:26*k,bold:true,max:1,centro:true},{t:it.grande,size:30*k,bold:true,max:1,centro:true}],x,W-x-pad,H,pad);
}

// ---------- Mover / Conferir com o leitor ----------
let MV={ modo:'mover', destino:'', fila:[], confBox:'', confAchadas:new Set(), confEsper:[] };
async function mover(){
  await carregaLocais();
  $('#main').innerHTML=`<div class="top"><h2>Mover / Conferir com o leitor</h2></div>
   <div class="filters"><button class="chip ${MV.modo==='mover'?'on':''}" data-mm="mover">Mover peças</button><button class="chip ${MV.modo==='conferir'?'on':''}" data-mm="conferir">Conferir caixa</button></div>
   <div id="movbody"></div>`;
  document.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{ MV.modo=b.dataset.mm; mover(); });
  if(MV.modo==='mover') renderMover(); else renderConferir();
}
function renderMover(){
  $('#movbody').innerHTML=`<div class="card">
    <label class="f">Caixa de destino<select id="mdest"><option value="">— escolha —</option>${locOptions(MV.destino)}</select></label>
    <label class="f" style="margin-top:10px">Leia ou digite o código da peça<input id="mscan" placeholder="Ex.: 123 ou P:000123" autocomplete="off"></label>
    <p class="small mut">Aponte o leitor para o QR da peça (ou digite o número) e aperte Enter. Repita para cada peça.</p>
    <div id="mfila"></div>
    <button class="btn p" id="mok" style="margin-top:12px">Mover peças</button>
   </div>`;
  $('#mdest').onchange=e=>{ MV.destino=e.target.value; atualizaMok(); };
  const scan=$('#mscan'); scan.focus();
  scan.onkeydown=async e=>{ if(e.key!=='Enter')return; e.preventDefault(); const v=scan.value.trim(); scan.value=''; if(!v)return;
    const mm=v.match(/^(?:P[:\-]?)?0*(\d+)$/i); if(!mm){ toast('Use o número da peça'); scan.focus(); return; }
    const codigo=parseInt(mm[1]);
    if(MV.fila.find(x=>Number(x.codigo)===codigo)){ toast('Já está na lista'); scan.focus(); return; }
    try{ const {peca}=await api('/peca-codigo/'+codigo); MV.fila.push(peca); renderFila(); }
    catch{ toast('Peça '+cod(codigo)+' não encontrada'); }
    scan.focus();
  };
  $('#mok').onclick=async()=>{ if(!MV.destino){ toast('Escolha a caixa de destino'); return; } if(!MV.fila.length){ toast('Leia ao menos uma peça'); return; }
    await api('/mover',{method:'POST',body:{ids:MV.fila.map(p=>p.id),local_id:MV.destino}});
    toast(MV.fila.length+' peça(s) movida(s) para '+locPath(MV.destino)); MV.fila=[]; renderMover();
  };
  renderFila();
}
function renderFila(){ const el=$('#mfila'); if(!el)return;
  el.innerHTML=MV.fila.length?`<div style="margin-top:8px">${MV.fila.map((p,i)=>`<div class="sel small"><span style="flex:1">${cod(p.codigo)} ${esc(p.nome)}</span><span class="mut">${p.local_id&&S.locais[p.local_id]?esc(locPath(p.local_id)):'sem local'}</span><button class="btn sm" data-rm="${i}">✖</button></div>`).join('')}</div>`:'<p class="small mut" style="margin-top:8px">Nenhuma peça lida ainda.</p>';
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ MV.fila.splice(+b.dataset.rm,1); renderFila(); });
  atualizaMok();
}
function atualizaMok(){ const ok=$('#mok'); if(ok){ ok.disabled=!(MV.fila.length&&MV.destino); ok.textContent='Mover '+MV.fila.length+' peça(s)'; } }
async function renderConferir(){
  $('#movbody').innerHTML=`<div class="card">
    <label class="f">Caixa a conferir<select id="cbox"><option value="">— escolha —</option>${locOptions(MV.confBox)}</select></label>
    <div id="cwrap">${MV.confBox?'<p class="small mut">carregando…</p>':'<p class="small mut">Escolha a caixa para começar.</p>'}</div>
   </div>`;
  $('#cbox').onchange=e=>{ MV.confBox=e.target.value; MV.confAchadas=new Set(); renderConferir(); };
  if(!MV.confBox)return;
  const {pecas}=await api('/pecas?local='+MV.confBox); MV.confEsper=pecas.filter(p=>Number(p.qtd)>0);
  $('#cwrap').innerHTML=`<label class="f" style="margin-top:4px">Leia/digite as peças que estão na caixa<input id="cscan" placeholder="Ex.: 123" autocomplete="off"></label><div id="cres"></div>`;
  const scan=$('#cscan'); scan.focus();
  scan.onkeydown=e=>{ if(e.key!=='Enter')return; e.preventDefault(); const v=scan.value.trim(); scan.value=''; const mm=v.match(/^(?:P[:\-]?)?0*(\d+)$/i); if(mm)MV.confAchadas.add(parseInt(mm[1])); renderConfRes(); scan.focus(); };
  renderConfRes();
}
function renderConfRes(){ const el=$('#cres'); if(!el)return; const esp=MV.confEsper||[];
  const codsEsper=new Set(esp.map(p=>Number(p.codigo)));
  const faltando=esp.filter(p=>!MV.confAchadas.has(Number(p.codigo)));
  const fora=[...MV.confAchadas].filter(c=>!codsEsper.has(c));
  el.innerHTML=`<div class="small" style="margin-top:10px">
    <p>✅ Conferidas: <b>${esp.length-faltando.length}</b> de ${esp.length}</p>
    ${faltando.length?`<p class="mut">❌ Faltando (${faltando.length}): ${faltando.map(p=>cod(p.codigo)+' '+esc(p.nome)).join(' · ')}</p>`:'<p style="color:var(--ok)">Tudo conferido nesta caixa. 🎉</p>'}
    ${fora.length?`<p class="mut">⚠️ Lidas que não são desta caixa: ${fora.map(c=>cod(c)).join(', ')}</p>`:''}
  </div>`;
}

async function baixarEstoque(){
  try{
    toast('Gerando planilha…');
    await carregaLocais();
    const { pecas }=await api('/pecas?todas=1');
    const cols=[['Código',p=>cod(p.codigo)],['Peça',p=>p.nome],['Marca',p=>p.marca],['Modelo',p=>p.modelo],['Ano',p=>p.ano],['Part number',p=>p.pn],['Condição',p=>p.cond],['Sucata de origem',p=>p.veiculo],['Preço',p=>String(Number(p.preco)||0).replace('.',',')],['Quantidade',p=>p.qtd],['Localização',p=>p.local_id&&S.locais[p.local_id]?locPath(p.local_id):''],['Mercado Livre',p=>p.ml?'Sim':'Não'],['Link ML',p=>p.ml_link],['Observações',p=>p.obs]];
    const cel=v=>{ v=v==null?'':String(v); if(/^[=+\-@]/.test(v)&&isNaN(Number(v.replace(',','.'))))v="'"+v; return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const linhas=[cols.map(c=>c[0]).join(';'),...pecas.map(p=>cols.map(([,f])=>cel(f(p))).join(';'))];
    const blob=new Blob(['﻿'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='estoque-rafa-busca-pecas-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    toast(pecas.length+' peça(s) na planilha');
  }catch(e){ toast('Erro: '+e.message); }
}

// ---------- Leitor de QR pela câmera ----------
let jsqrPromessa=null;
function carregaJsQR(){ if(window.jsQR)return Promise.resolve();
  if(!jsqrPromessa)jsqrPromessa=new Promise((ok,err)=>{ const sc=document.createElement('script'); sc.src='/jsQR.js'; sc.onload=ok; sc.onerror=()=>{ jsqrPromessa=null; err(new Error('não carregou o leitor')); }; document.head.appendChild(sc); });
  return jsqrPromessa; }
async function escanear(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return toast('Este navegador não libera a câmera');
  modal(`<h3>Escanear etiqueta</h3><p class="small mut">Aponte a câmera para o QR da peça ou da caixa.</p>
    <div class="scanbox"><video id="scv" playsinline muted autoplay></video><div class="scanmira"></div></div>
    <p class="small mut" id="scmsg">Abrindo a câmera…</p>`);
  let stream;
  try{ await carregaJsQR(); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); }
  catch(e){ const m=$('#scmsg'); if(m)m.textContent='Não consegui abrir a câmera: '+(e.name==='NotAllowedError'?'permissão negada — libere a câmera para este site nas configurações do navegador':e.message); return; }
  const v=$('#scv'); if(!v){ stream.getTracks().forEach(t=>t.stop()); return; }
  v.srcObject=stream; await v.play().catch(()=>{});
  $('#scmsg').textContent='Procurando QR…';
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  const para=()=>stream.getTracks().forEach(t=>t.stop());
  const loop=()=>{
    if(!document.body.contains(v)){ para(); return; }
    if(v.readyState>=2&&v.videoWidth){
      const w=Math.min(640,v.videoWidth), h=Math.round(v.videoHeight*w/v.videoWidth); cv.width=w; cv.height=h; cx.drawImage(v,0,0,w,h);
      const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});
      if(r&&r.data){ para(); if(navigator.vibrate)navigator.vibrate(80); fecha(); tratarCodigo(r.data.trim()); return; }
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
// P:000123 = peça · L:<id> = localização · outro texto = busca
async function tratarCodigo(t){
  let m=t.match(/^P:?0*(\d+)$/i);
  if(m){ try{ const { peca }=await api('/peca-codigo/'+parseInt(m[1],10)); await carregaLocais(); if(!S.pecas.find(x=>x.id===peca.id))S.pecas.push(peca); abrePeca(peca.id); }catch(e){ toast('Peça '+t+' não encontrada'); } return; }
  m=t.match(/^L:(.+)$/i);
  if(m){ await carregaLocais(); if(!S.locais[m[1]])return toast('Localização não encontrada'); S.ui.loc=m[1]; S.ui.q=''; S.ui.status='todos'; await go('estoque'); toast('📍 '+locPath(m[1])); return; }
  S.ui.q=t; S.ui.status='todos'; S.ui.loc=''; go('estoque');
}

function modal(html){ $('#modal').innerHTML=`<div class="modal" id="ov"><div class="box"><button class="x" id="xb">×</button>${html}</div></div>`;
  $('#ov').onclick=e=>{ if(e.target.id==='ov')fecha(); }; $('#xb').onclick=fecha; }
function fecha(){ $('#modal').innerHTML=''; }

boot();
