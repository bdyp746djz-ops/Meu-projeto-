<style>
:root{--pri:#2c8ec4;--pri2:#44a1d9;--pri-t:#e3f2fd;--pri-dark:#00556f;--red:#d32f2f;--red2:#e53935;--ink:#212121;--ink-light:#34383c;--mut:#757575;--mut2:#6b7280;--line:#e0e0e0;--line-dim:#e5e7eb;--bg:#f5f5f5;--card:#fff;--ok:#2e7d32;--ok-light:#4fb06d;--amber:#f9a825;--olx:#6e0ad6;--blue:#1565c0;--rad:4px;--rad-lg:8px;--sh:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12);--sh2:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px 0 rgba(0,0,0,.14),0 1px 18px 0 rgba(0,0,0,.12);--tb:64px;--transition:.1s ease-out}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit}
button{transition:all var(--transition)}
button:active{transform:scale(.98)}
.material-icons{font-family:'Material Icons';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
/* carregando */
.splash{position:fixed;inset:0;background:var(--pri);display:grid;place-items:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--pri) 0%,var(--pri-dark) 100%)}
.authcard{background:#fff;border-radius:var(--rad-lg);box-shadow:0 10px 40px rgba(0,0,0,.15);padding:32px;width:100%;max-width:400px;animation:slideIn .4s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;margin-bottom:8px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 12px rgba(44,142,196,.3)}
label.f{display:block;font-size:13px;color:var(--mut2);font-weight:500;margin:18px 0 6px;letter-spacing:-.01em}
input,select,textarea{width:100%;border:0;border-bottom:2px solid var(--line-dim);border-radius:0;padding:10px 4px;background:transparent;color:var(--ink-light);transition:border-color var(--transition),box-shadow var(--transition);font-size:15px}
textarea{border:2px solid var(--line-dim);border-radius:var(--rad);padding:10px 12px}
input:focus,select:focus{outline:0;border-bottom-color:var(--pri);box-shadow:0 2px 0 0 var(--pri)}
textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 2px rgba(44,142,196,.1)}
input::placeholder{color:var(--mut);opacity:.7}
.msg{margin-top:12px;font-size:13px;min-height:16px}.msg.err{color:var(--red)}
.linkb{background:none;border:0;color:var(--pri);font-weight:500;cursor:pointer;font-size:13px;padding:0;margin-top:14px}
/* barra superior */
.topbar{position:sticky;top:0;z-index:30;height:var(--tb);background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12);backdrop-filter:blur(10px)}
.tb-brand{width:235px;flex-shrink:0;padding-left:28px;line-height:1;cursor:pointer;user-select:none}
.tb-brand b{display:block;font-size:20px;font-weight:900;letter-spacing:.12em;font-style:italic}
.tb-brand small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin-top:3px}
.tb-search{flex:1;max-width:710px;padding:0 16px 0 84px}
.tb-search input{background:#fff;border:0;border-radius:2px;padding:11px 16px;color:var(--ink)}
.tb-search input:focus{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.tb-btn{margin-left:auto;margin-right:14px;background:none;border:0;color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.tb-btn:hover{background:rgba(255,255,255,.14)}
.tb-btn .material-icons{font-size:26px}
.scanbox{position:relative;background:#000;border-radius:var(--rad);overflow:hidden;height:min(78vw,380px);margin:10px 0}
.scanbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanmira{position:absolute;left:50%;top:50%;width:62%;height:62%;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.95);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
/* shell */
.app{display:flex;min-height:calc(100vh - var(--tb))}
nav.side{width:235px;background:#fff;border-right:1px solid var(--line);padding:12px 0;flex-shrink:0;position:sticky;top:var(--tb);align-self:flex-start;height:calc(100vh - var(--tb));overflow-y:auto}
nav a{position:relative;display:flex;align-items:center;gap:22px;padding:12px 26px;color:#424242;text-decoration:none;font-weight:400;font-size:14.5px;cursor:pointer;transition:background .13s,color .13s}
nav a .i{width:24px;text-align:center;color:#616161}
nav a.on{background:var(--pri-t);color:var(--pri);font-weight:500}
nav a.on .i{color:var(--pri)}
nav a:not(.on):hover{background:#f5f5f5}
main{flex:1;min-width:0;padding:22px 26px 30px;display:flex;flex-direction:column}
#main{flex:1}
.foot{text-align:center;color:#9e9e9e;font-size:13px;padding:28px 0 6px}
nav.bottom{display:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h2{margin:0;font-size:21px;font-weight:500;flex:1}
.q input{width:100%}
@media(max-width:760px){
 :root{--tb:56px}
 .tb-brand{width:auto;padding:0 12px 0 14px}
 .tb-brand b{font-size:16px}.tb-brand small{font-size:8px}
 .tb-search{padding:0 4px 0 0}
 .tb-btn{margin-right:6px}
 .tb-search input{padding:9px 12px}
 nav.side{display:none}main{padding:14px 12px 96px}
 #main>.top{flex-wrap:wrap}#main>.top h2{flex-basis:100%}
 nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;box-shadow:0 -2px 6px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom)}
 nav.bottom a{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:7px 1px;color:#757575;text-align:center}
 nav.bottom a .i{color:inherit;font-size:22px;width:auto}
 nav.bottom a.on{background:transparent;color:var(--pri)}
 nav.bottom a{position:relative} nav.bottom .nbadge{position:absolute;top:2px;left:50%;margin-left:6px}
}
/* lista no estilo Drive Parts (etiquetas) */
.dp-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#e8e8e8;margin:-22px -26px 18px;padding:10px 26px}
.dp-busca{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;color:#757575;margin:0}
.dp-busca input{border:0;background:transparent;padding:9px 0;font-size:15px}
.dp-busca input:focus{box-shadow:none}
.dp-ops{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dp-op{display:flex;align-items:center;gap:6px;color:#757575;font-size:13.5px;white-space:nowrap}
.dp-op select{width:auto;border:0;padding:4px 2px;color:#424242;font-size:13.5px;background:transparent}
.dp-op select:focus{box-shadow:none}
.dp-gerar{display:inline-flex;align-items:center;gap:6px;background:#4caf50;color:#fff;border:0;border-radius:2px;padding:9px 14px;font-weight:500;font-size:13px;letter-spacing:.02em;cursor:pointer;box-shadow:var(--sh)}
.dp-gerar:hover{filter:brightness(1.07)}
.dp-gerar .material-icons{font-size:17px}
.dp-gerar .n{background:rgba(255,255,255,.28);border-radius:9px;padding:0 7px;font-size:12px}
.dp-mini{max-width:960px;margin:0 auto 8px;font-size:13px;color:#9e9e9e;text-align:right}
.dp-mini a{color:var(--pri);cursor:pointer}
.dp-lista{background:#fff;box-shadow:var(--sh);border-radius:2px;margin:0 auto;max-width:960px}
.dp-row{display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid #eee;cursor:pointer}
.dp-row:last-child{border-bottom:0}
.dp-row:hover{background:#fafafa}
.dp-ft{width:84px;height:84px;flex-shrink:0;background:#eceff1;display:grid;place-items:center;color:#90a4ae;overflow:hidden;position:relative}
.dp-ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dp-ft .material-icons{font-size:36px}
.dp-tx{flex:1;min-width:0}
.dp-tt{color:#1e88e5;font-size:15px;line-height:1.3}
.dp-sb{color:#9e9e9e;font-size:13px;margin-top:4px;line-height:1.4}
.dp-ck{width:36px;height:36px;border-radius:50%;border:0;background:#9e9e9e;color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0}
.dp-ck .material-icons{font-size:20px}
.dp-row.on .dp-ck{background:#eeeeee;color:#757575}
.dp-chk{max-height:52vh;overflow:auto;padding:4px 0}
.dp-ci{display:flex;align-items:center;gap:14px;padding:6px 4px;color:#616161;font-size:14px;cursor:pointer}
.dp-ci input{width:18px;height:18px;margin:0;flex-shrink:0}
.dp-cfg{display:flex;gap:18px;flex-wrap:wrap;padding:12px 4px 4px;border-top:1px solid #eee;margin-top:8px;font-size:13px;color:#757575;align-items:center}
.dp-cfg input{width:62px;display:inline-block;text-align:center}
.dp-rod{display:flex;justify-content:center;gap:30px;border-top:1px solid #eee;margin-top:10px;padding:14px 0 2px}
.dp-tb{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:#424242;font-size:14px;letter-spacing:.03em;cursor:pointer;padding:6px}
.dp-tb .material-icons{font-size:17px}
.dp-azul{background:var(--pri)}
.dp-gerar:disabled{background:#bdbdbd;cursor:not-allowed;box-shadow:none}
.dp-st{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#9e9e9e}
.dp-st .material-icons{font-size:18px}
.dp-st.ok{color:var(--ok)}
.dp-cx{max-width:960px;margin:0 auto 14px}
.dp-pub{display:inline-block;margin-top:5px;font-size:12px;color:#9e9e9e}
.dp-pub.on{color:var(--ok);font-weight:500}
.dp-ac{flex-shrink:0}
.dp-act{display:inline-flex;align-items:center;gap:5px;color:var(--pri);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.02em;padding:8px 6px}
.dp-act .material-icons{font-size:17px}
.dp-act.mut{color:#9e9e9e}
@media(max-width:760px){
 .dp-bar{margin:-14px -12px 12px;padding:8px 12px}
 .dp-ops{gap:10px;width:100%}.dp-gerar{margin-left:auto}
 .dp-row{padding:12px;gap:12px}.dp-ft{width:58px;height:58px}
 .dp-tt{font-size:14px}.dp-sb{font-size:12px}
 .dp-row{flex-wrap:wrap}.dp-ac{width:100%;display:flex;justify-content:flex-end}
}
.lc-row{display:flex;align-items:center;gap:10px;padding:10px 14px 10px calc(12px + var(--d,0)*24px);border-bottom:1px solid #eee}
.lc-row:last-child{border-bottom:0}
.lc-row:hover{background:#fafafa}
.lc-tg{width:24px;color:#757575;cursor:pointer;flex-shrink:0;user-select:none}
.lc-ic{color:#90a4ae;flex-shrink:0}
.lc-tx{flex:1;min-width:0}
.lc-nm{font-weight:500;font-size:15px}
.lc-sig{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-t);border-radius:3px;padding:1px 6px;letter-spacing:.03em;vertical-align:1px}
.lc-sb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:#9e9e9e}
.lc-sb .ct{cursor:pointer}
.lc-rg{display:inline-flex;align-items:center;gap:3px;color:#7e57c2}
.lc-rg .material-icons{font-size:14px}
.lc-ac{display:flex;gap:2px;flex-shrink:0}
.lc-b{width:36px;height:36px;border:0;background:none;border-radius:50%;color:#757575;display:grid;place-items:center;cursor:pointer;padding:0}
.lc-b:hover{background:#eee;color:var(--ink)}
.lc-b .material-icons{font-size:20px}
@media(max-width:760px){.lc-row{padding-left:calc(6px + var(--d,0)*12px)}.lc-b{width:34px;height:34px}.lc-pn{font-size:13.5px}}
.mlsec{margin:14px 0 4px;padding-top:12px;border-top:1px solid #eee}
.mlcats{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.mlcat{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid #e0e0e0;border-radius:var(--rad);cursor:pointer;font-size:13.5px;line-height:1.35}
.mlcat.on{border-color:var(--pri);background:var(--pri-t)}
.mlcat input{width:auto;margin:3px 0 0;flex-shrink:0}
.mlbusca{display:flex;gap:8px;align-items:center}
.mlattrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 16px}
.mlmais{margin-top:8px}.mlmais summary{cursor:pointer;color:var(--pri);font-size:13px;padding:6px 0}
.lc-pc{cursor:pointer;background:#fcfcfc}
.lc-pc:hover{background:#f3f6ff}
.lc-ft{width:36px;height:36px;flex-shrink:0;border-radius:4px;overflow:hidden;background:#eceff1;color:#90a4ae;display:grid;place-items:center;position:relative}
.lc-ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lc-ft .material-icons{font-size:20px}
.lc-pn{font-size:14px;color:#1e88e5}
.lc-ir{color:#bdbdbd;flex-shrink:0}
.lc-sep{padding:10px 14px 6px;font-size:12px;font-weight:500;color:#9e9e9e;text-transform:uppercase;letter-spacing:.04em;background:#fafafa;border-bottom:1px solid #eee}
.lc-mnu{position:fixed;z-index:70;background:#fff;border-radius:4px;box-shadow:var(--sh2);padding:6px 0;min-width:250px;max-width:94vw}
.lc-mnu button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:10px 16px;font-size:14.5px;color:var(--ink);cursor:pointer;text-align:left}
.lc-mnu button:hover{background:#f5f5f5}
.lc-mnu button .material-icons{color:#757575;font-size:21px}
.lc-mnu button.red,.lc-mnu button.red .material-icons{color:var(--red)}
.lc-mnu button:disabled{opacity:.4;cursor:default}
.rel-tot{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.rel-tot div{flex:1;min-width:120px;background:var(--pri-t);border-radius:var(--rad);padding:8px 12px}
.rel-tot span{display:block;font-size:12px;color:var(--mut)}.rel-tot b{font-size:18px}
.chk2{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}
.chk2 label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
.chk2 input{width:auto}
.sec-t{margin-top:14px;padding-top:12px;border-top:1px solid #eee;font-weight:500}
.thumbs .star{position:absolute;left:4px;bottom:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:13px;cursor:pointer;line-height:1}
.thumbs .princ img{outline:3px solid var(--amber);outline-offset:-3px}
.thumbs .princ .star{background:var(--amber)}
.mlbox{margin-top:16px;padding:12px 14px;border:1px solid #e0e0e0;border-radius:var(--rad);background:#fafafa}
.mlact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.red{color:var(--red)}
.pr{margin-top:14px}.pr-t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.pr-b{height:6px;background:#eee;border-radius:3px;overflow:hidden}.pr-b i{display:block;height:100%}
.pr-c{margin-top:6px;max-width:260px}.pr-c .pr-t{font-size:11.5px;color:var(--mut)}
.pm{margin:10px 0;padding:12px;border:1px solid #e0e0e0;border-radius:var(--rad);background:#fafafa}
.pm-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pm-v{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.pm-b{border:1px solid #c5cae9;background:#fff;border-radius:var(--rad);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.pm-b small{color:var(--mut);font-size:11px}.pm-b b{font-size:15px;color:var(--ink)}.pm-b span{font-size:11px;color:var(--pri)}
.pm-b:nth-child(2){border-color:var(--pri);background:var(--pri-t)}
.pm-a{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee;color:inherit;text-decoration:none;font-size:13px}

.pc-ac{display:flex;border-top:1px solid #eee;margin-top:auto}

.kp2 .kpi .v{font-size:21px}

@media(max-width:600px){.form.emb4{grid-template-columns:repeat(2,1fr)}}
.iabadge{position:absolute;right:4px;bottom:4px;background:#3f51b5;color:#fff;font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px}
.iaprev{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.iaprev figure{margin:0;border:1px solid #e0e0e0;border-radius:var(--rad);overflow:hidden;background:#fafafa}
.iaprev img{width:100%;display:block;aspect-ratio:1;object-fit:contain;background:#fff}.iaprev figcaption{padding:8px;font-size:13px}
.spin-s{display:inline-block;width:14px;height:14px;border:2px solid #c5cae9;border-top-color:var(--pri);border-radius:50%;animation:gira .8s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes gira{to{transform:rotate(360deg)}}
.iaph{aspect-ratio:1;display:grid;place-items:center;background:#fff;font-size:13px;color:var(--mut)}
/* componentes */
.btn{border:1px solid #d7dbe0;background:#fff;border-radius:var(--rad-lg);padding:10px 18px;cursor:pointer;font-weight:500;color:var(--ink-light);text-decoration:none;display:inline-block;transition:all var(--transition);font-size:14px;letter-spacing:-.01em}
.btn:hover{background:#f8f9fa;border-color:var(--pri);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn.p{background:linear-gradient(135deg,var(--pri),var(--pri2));border:none;color:#fff;box-shadow:0 4px 12px rgba(44,142,196,.3)}
.btn.p:hover{box-shadow:0 6px 16px rgba(44,142,196,.4);transform:translateY(-1px)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:var(--sh)}
.btn.p:hover,.btn.g:hover{filter:brightness(1.08)}
.nbadge{display:inline-block;background:var(--red);color:#fff;border-radius:9px;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;margin-left:6px;text-align:center;font-weight:600}
.perg{background:var(--card);box-shadow:var(--sh);border-radius:var(--rad);padding:12px;margin:0 auto 10px;max-width:760px}
.perg .q{font-size:16px;margin:8px 0;white-space:pre-wrap}
.perg textarea{width:100%;min-height:80px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:var(--rad);resize:vertical}
/* ficha da peça (abre pelo QR da etiqueta) */
.fcard{background:var(--card);box-shadow:var(--sh);border-radius:var(--rad);max-width:760px;width:100%;margin:0 auto}
.ftabs{display:flex;border-bottom:1px solid var(--line)}
.ftabs button{flex:1;padding:15px 8px;border:0;background:none;font:inherit;font-size:16px;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer}
.ftabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:500}
.frow{display:flex;gap:16px;align-items:flex-start;padding:15px 16px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.35}
.frow>.material-icons{font-size:28px;flex:none;width:30px;color:var(--ink)}
.frow b{font-weight:600}
.frow a{color:var(--pri);font-size:14px}
.fimgs{padding:12px}
.fimgs img{display:block;width:100%;background:#fff;margin:0 0 12px;border-radius:var(--rad);box-shadow:var(--sh)}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:16px}
.facts .btn{min-width:150px;justify-content:center}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55}
.card{background:#fff;border:1px solid rgba(0,0,0,.04);border-radius:var(--rad-lg);padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:all var(--transition)}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-2px)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px;margin-bottom:18px}
.kpi .l{color:var(--mut);font-size:12.5px;font-weight:600}.kpi .v{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.kpi.clic{cursor:pointer;transition:box-shadow .15s,transform .15s}
.kpi.clic:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}
.pc{position:relative;background:#fff;border:0;border-radius:var(--rad);overflow:hidden;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.pc:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.pc.sel{outline:3px solid var(--pri);outline-offset:-2px}
.selck{position:absolute;left:7px;top:7px;z-index:3;width:24px;height:24px;border-radius:6px;background:#fff;border:2px solid var(--pri);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:14px}
.bulkbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1d1f23;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.28);flex-wrap:wrap;max-width:94vw}
.pc .ph{position:relative;height:150px;background:linear-gradient(135deg,#eef1f4,#e3e7ec);display:grid;place-items:center;color:#9aa1ab;font-size:30px;overflow:hidden}
.pc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .ph .loc{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(21,101,192,.94);color:#fff;font-size:10.5px;font-weight:700;border-radius:7px;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ph .loc.none{background:rgba(198,40,40,.94)}
.pc .b{padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.pc .n{font-weight:700;font-size:13.5px;line-height:1.25}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:5px;padding:2px 7px;background:#eef0f3;color:#333;white-space:nowrap}
.tag.price{background:#e7f6ee;color:var(--ok);font-weight:700}.tag.ml{background:#fff6d6;color:#8a6d00}.tag.olx{background:#efe3ff;color:#54279e}.tag.zero{background:#fdecea;color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #d7dbe0;border-radius:20px;padding:6px 12px;background:#fff;cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.sugbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh);background:#fff}
.sughd{background:#f7f8fa;padding:7px 11px;font-size:12px;color:var(--mut);font-weight:700}
.sugitem{padding:9px 11px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.sugitem:hover{background:var(--pri-t)}
.sugpr{color:var(--ok);font-weight:700}
.withmic{position:relative}
.withmic>input,.withmic>textarea{width:100%;padding-right:46px}
.mic{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#eef0f3;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
.withmic.ta .mic{top:8px;transform:none}
.mic.on{background:var(--pri-t);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.mut{color:var(--mut)}.small{font-size:13px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed #d7dbe0}
.tree>ul{padding-left:0;border:0}
.node{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:7px}.node:hover{background:#f4f5f7}
.node .tg{width:20px;text-align:center;cursor:pointer;color:var(--mut)}
.node .nm{font-weight:700}.node .ct{font-size:12px;color:var(--mut);cursor:pointer}
.node .act{margin-left:auto;display:flex;gap:4px}
.occ{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.occ .track{display:inline-block;height:7px;border-radius:4px;background:#eef0f3;overflow:hidden}
.occ .fill{display:block;height:100%;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:26px 12px;overflow:auto}
.modal .box{background:#fff;border-radius:var(--rad);box-shadow:var(--sh2);max-width:680px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:23px;cursor:pointer;color:var(--mut)}
.photos{display:flex;gap:8px;overflow-x:auto}.photos img{height:130px;border-radius:9px;object-fit:cover}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:21px;height:21px;background:var(--red);color:#fff;cursor:pointer;font-size:12px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lbl{border:1px dashed #9ca3af;border-radius:7px;background:#fff;padding:8px;display:flex;gap:8px;align-items:center}
.lbl svg{width:80px;height:80px;flex-shrink:0}.lbl .t{font-size:12px;line-height:1.25;overflow:hidden}.lbl .t b{font-size:14px;display:block}
.sel{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:9px;z-index:60;font-size:14px;max-width:90vw}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.bar2{height:8px;border-radius:4px;background:var(--pri2)}
.adbox{white-space:pre-wrap;background:#f7f8fa;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13.5px}

/* ===== visual novo: barra branca, menu lateral em grupos, cartões arredondados ===== */
:root{--bg:#f2f4fb;--rad:12px;--line:#e3e6f1;--pri-t:#e6e9fb;--sh:0 1px 2px rgba(20,24,60,.05),0 2px 10px rgba(20,24,60,.06);--sh2:0 10px 30px rgba(20,24,60,.18)}
html,body{background:var(--bg)}
.topbar{background:#fff;color:var(--ink);box-shadow:none;border-bottom:1px solid var(--line)}
.tb-brand{display:flex;align-items:center;gap:10px;width:252px}
.tb-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--pri),#7986cb);color:#fff;display:grid;place-items:center;font-weight:900;font-style:italic;font-size:19px;flex:none}
.tb-brand b{color:var(--pri);font-size:17px}.tb-brand small{color:var(--mut)}
.tb-search{padding:0 16px 0 18px}
.tb-search input{background:#f4f5fb;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tb-search input:focus{box-shadow:0 0 0 2px var(--pri-t)}
.tb-acts{margin-left:auto;display:flex;align-items:center;gap:2px;padding-right:12px}
.tb-ham{display:none;color:#5f6475;font-size:26px}
.tb-btn{color:#5f6475;margin:0;position:relative;width:42px;height:42px}
.tb-btn:hover{background:#f1f3fb}.tb-btn .material-icons{font-size:23px}
.tb-badge{position:absolute;top:3px;right:2px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px;font-weight:700}
.tb-user{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:4px 12px 4px 4px;margin-left:8px;cursor:pointer;background:#fff;position:relative}
.tb-av{width:32px;height:32px;border-radius:9px;background:var(--pri-t);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.tb-user b{display:block;font-size:12.5px;line-height:1.2}.tb-user small{display:block;font-size:11px;color:var(--mut);line-height:1.2}
.tb-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);min-width:170px;padding:6px;display:none;z-index:40}
.tb-menu.on{display:block}.tb-menu a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--ink);cursor:pointer;font-size:14px}.tb-menu a:hover{background:#f4f5fb}
nav.side{width:252px;background:#fff;border-right:1px solid var(--line);padding:10px 0 14px}
.sd-busca{display:flex;gap:6px;padding:4px 12px 8px}
.sd-busca label{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:#f7f8fc;min-width:0}
.sd-busca label .material-icons{font-size:18px;color:#9aa0b4}
.sd-busca input{border:0;padding:7px 0;background:transparent;font-size:13px;min-width:0}
.sd-busca input:focus{box-shadow:none}
.sd-rec{border:1px solid var(--line);background:#fff;border-radius:10px;width:34px;flex:none;cursor:pointer;color:#5f6475;display:grid;place-items:center}
nav.side a{gap:11px;padding:7px 10px;margin:2px 10px;border-radius:11px;font-size:14px;color:#2b2f3a}
nav.side a .i{width:30px;height:30px;border-radius:9px;background:#f2f4fb;display:grid;place-items:center;font-size:18px;color:#5f6475;flex:none}
nav.side a.on{background:var(--pri-t);color:var(--pri);font-weight:600}
nav.side a.on .i{background:#fff;color:var(--pri)}
nav.side a:not(.on):hover{background:#f5f6fb}
nav.side .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.side .chev{font-size:19px;color:#9aa0b4;transition:transform .15s;flex:none}
nav.side .grp.aberto>a .chev{transform:rotate(180deg)}
nav.side .sub{display:none;margin-left:14px;border-left:1px dashed var(--line);padding-left:2px}
nav.side .grp.aberto .sub,nav.side.filtrando .sub{display:block}
nav.side .sub a{font-size:13.5px;padding:5px 8px}
nav.side .sub a .i{width:26px;height:26px;font-size:16px}
nav.side .sd-sep{height:1px;background:var(--line);margin:8px 14px}
.app.rec nav.side{width:76px}
.app.rec nav.side .sd-busca label,.app.rec nav.side .t,.app.rec nav.side .chev,.app.rec nav.side .nbadge{display:none!important}
.app.rec nav.side .sub{margin-left:0;border:0;padding:0}
.app.rec .tb-brand{width:auto}
main{background:linear-gradient(180deg,#e8ebfa 0,var(--bg) 280px)}
.card{border-radius:14px}
.btn{border-radius:10px;border-color:var(--line)}
.btn.p{box-shadow:0 2px 8px rgba(63,81,181,.28)}
.top h2{font-weight:700;letter-spacing:-.01em}
/* pendências */
.pd-row{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.pd-ft{width:56px;height:56px;border-radius:10px;background:#f2f4fb;display:grid;place-items:center;overflow:hidden;flex:none;color:#9aa0b4}
.pd-ft img{width:100%;height:100%;object-fit:cover}
.pd-tx{flex:1;min-width:0}.pd-tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-bar{height:6px;border-radius:4px;background:#eceef6;overflow:hidden;margin-top:6px;max-width:260px}.pd-bar i{display:block;height:100%;background:var(--pri)}
.pd-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.pd-chips span{font-size:11px;background:#fff4e5;color:#8a5a00;border-radius:6px;padding:1px 6px}
.kpi .v{overflow-wrap:anywhere;font-size:clamp(19px,2.1vw,30px)}
@media(max-width:760px){
 .tb-brand{width:auto;padding:0 6px 0 10px;gap:6px}.tb-brand>span:not(.tb-logo):not(.tb-ham){display:none}.tb-ham{display:block}
 .tb-search{padding:0 6px 0 4px}
 .tb-user b,.tb-user small{display:none}.tb-user{padding:3px;margin-left:2px}
 .tb-acts{padding-right:6px}.tb-acts .tb-hide-m{display:none}
 .pd-row{flex-wrap:wrap}.pd-row .pd-tx{flex-basis:calc(100% - 70px)}.pd-row>.btn{margin-left:auto}
 .pd-chips .chip{font-size:11.5px!important;padding:4px 8px}
}

/* ===== cadastro em 7 etapas ===== */
.wz-steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:thin}
.wz-step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px 7px 7px;cursor:pointer;white-space:nowrap;font-size:13px;color:#4a4f60;flex:none}
.wz-step i{font-style:normal;width:24px;height:24px;border-radius:8px;background:#f2f4fb;display:grid;place-items:center;font-weight:700;font-size:12px;color:#5f6475}
.wz-step.on{border-color:var(--pri);color:var(--pri);font-weight:600;box-shadow:0 0 0 3px var(--pri-t)}
.wz-step.on i{background:var(--pri);color:#fff}
.wz-step.ok i{background:#e7f6ec;color:var(--ok)}
.wz-card{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:20px 22px;margin-bottom:12px}
.wz-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.wz-n{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.wz-h small{color:var(--mut);font-size:12px}.wz-h h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}.wz-h p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.wz-sec{font-weight:600;font-size:14px;margin:18px 0 4px}.wz-dica{font-size:12.5px;color:var(--mut);margin:0 0 6px}
.wz-modos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.wz-modo{border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:500;color:var(--ink);position:relative}
.wz-modo.on{border:2px solid var(--pri);box-shadow:0 0 0 3px var(--pri-t)}.wz-modo:disabled{opacity:.6;cursor:not-allowed}
.wz-modo .tag{position:absolute;top:8px;right:8px;font-size:10px}
.wz-res{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.wz-res-h{padding:12px 14px;border-bottom:1px solid var(--line)}.wz-res-h b{display:block}
.wz-it{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.wz-it:last-child{border-bottom:0}.wz-it:hover{background:#f7f8fd}
.wz-mini{position:relative;width:52px;height:52px;border-radius:10px;background:#f2f4fb;display:grid;place-items:center;overflow:hidden;flex:none;color:#9aa0b4}.wz-mini[data-gal]{cursor:zoom-in}
.wz-mais{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-weight:700;line-height:14px;border-radius:7px;padding:0 5px}.wz-ref{position:absolute;left:2px;top:2px;background:rgba(255,230,0,.95);color:#333;font-size:9px;font-weight:800;line-height:12px;border-radius:5px;padding:0 3px}.wz-mini img{width:100%;height:100%;object-fit:cover}.wz-mini .wz-img-fallback{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wz-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.wz-tags span{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:1px 7px;color:#4a4f60;background:#fafbff}
.wz-vazio{padding:22px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px;margin-top:12px}
.wz-det{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:12px}
.wz-det .ft{border:1px solid var(--line);border-radius:12px;background:#fafbff;min-height:220px;display:grid;place-items:center;overflow:hidden}.wz-det .ft img{max-width:100%;max-height:300px}
.wz-ths{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.wz-ths img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.wz-kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wz-kv div{background:#f7f8fd;border-radius:10px;padding:8px 10px}.wz-kv small{display:block;color:var(--mut);font-size:11px}
.wz-cons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.wz-con{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 6px;cursor:pointer;text-align:center;font-size:13px}
.wz-con b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#f2f4fb;margin-bottom:4px}
.wz-con.on{border:2px solid var(--pri);background:var(--pri-t)}.wz-con.on b{background:var(--pri);color:#fff}
.wz-nota{border-left:3px solid var(--pri);background:#f4f6ff;border-radius:8px;padding:8px 12px;font-size:13px;margin-top:8px}
.wz-mk{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

<body>
<div id="root"><div class="splash"><div class="spin"></div></div></div>
<div id="modal"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cod = n => '#'+String(n).padStart(6,'0');
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

async function api(path, opts={}){
  const o = { headers:{}, cache:'no-store', ...opts };   // sempre busca a versão nova (o iPhone às vezes reaproveita a resposta antiga)
  if (o.body && !(o.body instanceof Blob) && typeof o.body!=='string'){ o.body=JSON.stringify(o.body); o.headers['content-type']='application/json'; }
  const r = await fetch('/api'+path, o);
  let d={}; try{ d=await r.json(); }catch{}
  if(!r.ok) throw new Error(d.erro || ('erro '+r.status));
  return d;
}

const S = { user:null, view:'painel', pecas:[], locais:{}, ui:{ q:'', loc:'', status:'todos', periodo:'mes', editId:null, fotos:[], etqTipo:'pecas', etqW:100, etqH:50, etqSel:new Set(), open:new Set(), selMode:false, sel:new Set() } };
// [view, ícone Material, nome no menu, nome curto (celular)]
const VIEWS = [['painel','home','Início','Início'],['etiquetas','label','Etiquetas','Etiquetas'],['download','file_download','Download Estoque','Download'],['nova','view_list','Cadastro de Peças','Cadastrar'],['estoque','search','Consulta de Peças','Consulta'],['locais','place','Localização','Locais'],['mover','swap_horiz','Movimentar','Mover'],['vendas','shopping_cart','Vendas','Vendas'],['perguntas','question_answer','Perguntas ML','Perguntas'],['integracoes','store','Anúncios ML','ML']];

// ---------- boot / auth ----------
let codigoDoLink=null; // /p/000123 ou /l/<id> vindo do QR lido pela câmera do celular
// foto que não abre na tela: o sistema conserta sozinho (tira a quebrada e, sem foto, busca de novo no anúncio do ML)
const FOTO_VAZIA='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" fill="#eef1f4"/><path d="M7 15l3-4 2.5 3 1.5-2 3 3z" fill="#b8c0c8"/></svg>');
const fotosConserto={feitas:new Set(),fila:[],rodando:false};
document.addEventListener('error',e=>{ const im=e.target; if(!im||im.tagName!=='IMG')return;
  const m=String(im.getAttribute('src')||'').match(/^\/api\/foto\/(pecas\/([\w-]+)\/[^?#]+)/); if(!m)return;
  im.dataset.fotoQuebrada=m[1]; im.src=FOTO_VAZIA;
  if(!S.user||fotosConserto.feitas.has(m[2]))return; fotosConserto.feitas.add(m[2]); fotosConserto.fila.push(m[2]); consertaFotos(); },true);
async function consertaFotos(){ if(fotosConserto.rodando)return; fotosConserto.rodando=true;
  while(fotosConserto.fila.length){ const id=fotosConserto.fila.shift();
    try{ const r=await api('/pecas/'+id+'/fotos/conferir',{method:'POST'});
      (S.pecas||[]).forEach(p=>{ if(p.id===id)p.fotos=r.fotos; });
      if(S.ui&&S.ui.editId===id&&Array.isArray(S.ui.fotos)){ S.ui.fotos=S.ui.fotos.filter(f=>!f.key||r.fotos.includes(f.key)); if(typeof drawThumbs==='function')drawThumbs(); }
      document.querySelectorAll('img[data-foto-quebrada^="pecas/'+id+'/"]').forEach(im=>{
        if(im.closest('.photos,.thumbs,a')||!r.fotos.length){ if(im.closest('.photos,.thumbs,a'))(im.closest('a')||im).style.display='none'; return; }
        delete im.dataset.fotoQuebrada; im.src='/api/foto/'+r.fotos[0]; });
    }catch(_){ } }
  fotosConserto.rodando=false; }
async function boot(){
  if(location.pathname==='/api/ml/callback'){ return mlFinaliza(); }
  const lk=location.pathname.match(/^\/(p|l)\/([^/]+)\/?$/i);
  if(lk){ codigoDoLink=lk[1].toUpperCase()+':'+decodeURIComponent(lk[2]); history.replaceState(null,'','/'); }
  try{ const { user } = await api('/me'); S.user=user; shell(); }
  catch{ login(false); }
}
async function mlFinaliza(){
  $('#root').innerHTML='<div class="center"><div class="authcard"><div class="brand"><span class="logo">🔧</span> Rafa Busca Peças</div><p class="mut">Finalizando conexão com o Mercado Livre…</p></div></div>';
  const p=new URLSearchParams(location.search);
  try{
    const err=p.get('error'); if(err) throw new Error('Mercado Livre recusou: '+err);
    await api('/ml/exchange',{method:'POST',body:{code:p.get('code'),state:p.get('state')}});
  }catch(e){ /* o motivo fica salvo e aparece na tela de Integrações */ }
  location.replace('/#integracoes');
}
function login(primeiro){
  $('#root').innerHTML = `<div class="center"><form class="authcard" id="f">
    <div class="brand"><span class="logo">🔧</span> Rafa Busca Peças</div>
    <h3>${primeiro?'Criar acesso do administrador':'Entrar'}</h3>
    ${codigoDoLink&&!primeiro?`<p class="small mut">Entre para ver ${codigoDoLink[0]==='P'?'a peça '+esc(codigoDoLink.slice(2)):'a localização'}.</p>`:''}
    ${primeiro?'<label class="f">Seu nome</label><input name="nome" placeholder="Ex.: Rafael">':''}
    <label class="f">Login</label><input name="login" autocomplete="username" required>
    <label class="f">Senha</label><input name="senha" type="password" autocomplete="${primeiro?'new-password':'current-password'}" required>
    <button class="btn p" style="width:100%;margin-top:16px" type="submit">${primeiro?'Criar acesso':'Entrar'}</button>
    <div class="msg" id="m"></div>
    <button class="linkb" type="button" id="alt">${primeiro?'Já tenho acesso — entrar':'Primeiro acesso? Criar administrador'}</button>
  </form></div>`;
  $('#alt').onclick=()=>login(!primeiro);
  $('#f').onsubmit=async e=>{
    e.preventDefault(); const b=Object.fromEntries(new FormData(e.target)); const btn=e.target.querySelector('button'); btn.disabled=true;
    try{ if(primeiro) await api('/setup',{method:'POST',body:b});
      const { user }=await api('/login',{method:'POST',body:{login:b.login,senha:b.senha}}); S.user=user; shell();
    }catch(err){ $('#m').className='msg err'; $('#m').textContent=err.message; btn.disabled=false; }
  };
}

// ---------- shell ----------
function shell(){
  const ini=String((S.user&&(S.user.nome||S.user.login))||'R').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  $('#root').innerHTML = `<header class="topbar">
      <div class="tb-brand" id="tbhome" title="Menu"><span class="material-icons tb-ham">menu</span><span class="tb-logo img"><img src="/icones/logo-topo.png" alt="Rafa Busca Peças"></span><span><b>RAFA</b><small>busca peças</small></span></div>
      <div class="tb-search"><input id="gbusca" type="search" placeholder="Código, nome, part number ou veículo…" autocomplete="off"></div>
      <div class="tb-acts">

async function pendencias(tipo){

  if(S.view!==tipo)return;
  const ui=S.ui; ui.pdFalta=ui.pdFalta||'';

  const desenha=()=>{
    let lista=tipo==='medidas'?ativos.filter(semMed).map(p=>({p,r:prontidao(p)})):ativos.map(p=>({p,r:prontidao(p)})).filter(x=>x.r.falta.length);

      ${tipo==='incompletos'?`<div class="filters" style="margin-bottom:10px"><button class="chip ${!ui.pdFalta?'on':''}" data-pf="">Tudo</button>${Object.entries(conta).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="chip ${ui.pdFalta===k?'on':''}" data-pf="${esc(k)}">Sem ${esc(k)} (${n})</button>`).join('')}</div>`:''}
      ${lista.length?lista.slice(0,300).map(({p,r})=>`<div class="pd-row"><div class="pd-ft">${p.fotos&&p.fotos[0]?`<img src="/api/foto/${p.fotos[0]}" loading="lazy" alt="">`:'<span class="material-icons">image</span>'}</div>
        <div class="pd-tx"><b>${cod(p.codigo)} · ${esc(p.nome)}</b><span class="small mut">${p.local_id&&S.locais[p.local_id]?'📍 '+esc(codigoTxt(p.local_id))+' · ':''}${brl(p.preco)} · ${Number(p.qtd)||0} un</span>
          ${tipo==='medidas'?`<div class="pd-chips" style="margin-top:6px">${EMB_PRESETS.map((e,i)=>`<button class="chip" data-pe="${esc(p.id)}:${i}" style="font-size:12px">${esc(e[0])}</button>`).join('')}</div>`
            :`<div class="pd-bar"><i style="width:${r.pct}%"></i></div><div class="pd-chips">${r.falta.map(f=>`<span>${esc(f)}</span>`).join('')}</div>`}</div>
        <button class="btn sm p" data-pc2="${esc(p.id)}">Completar</button></div>`).join('')+(lista.length>300?`<p class="small mut">Mostrando 300 de ${lista.length}.</p>`:'')
        :'<div class="card">✅ Nada pendente aqui.</div>'}`;
    document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{ ui.pdFalta=b.dataset.pf; desenha(); });
    document.querySelectorAll('[data-pc2]').forEach(b=>b.onclick=()=>{ const p=S.pecas.find(x=>x.id===b.dataset.pc2); if(!p)return;
      const r=prontidao(p), et=tipo==='medidas'?4:(ETAPA_DO_ITEM[(ui.pdFalta&&r.falta.includes(ui.pdFalta))?ui.pdFalta:r.falta[0]]||2);
      S.ui.etapaInicial=et; S.ui.voltaPara=tipo; editar(p.id); });
    document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=async()=>{ const [id,i]=b.dataset.pe.split(':'), e=EMB_PRESETS[+i]; b.disabled=true;
      try{ const r=await api('/pecas/'+id,{method:'PATCH',body:{peso_g:e[1],alt_cm:e[2],larg_cm:e[3],comp_cm:e[4]}}); const p=S.pecas.find(x=>x.id===id); if(p)Object.assign(p,{peso_g:e[1],alt_cm:e[2],larg_cm:e[3],comp_cm:e[4]});
        toast('📦 '+e[0]+' aplicada em '+cod(p?p.codigo:'')); desenha(); }catch(err){ toast(err.message); b.disabled=false; } });
  };
  desenha();
}

// aberto pelo ícone da Tela de Início (modo aplicativo): o celular não deixa abrir janelas nem PDFs soltos,
// então o arquivo vai pela folha de compartilhar (Imprimir / Salvar em Arquivos / WhatsApp)
const emApp=()=>{ try{ return navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches; }catch(_){ return false; } };
function novaJanela(aviso,titulo){ if(emApp())return null; const w=window.open('','_blank');
  if(w&&aviso){ try{ w.document.write('<title>'+esc(titulo||'')+'</title><p style="font-family:sans-serif;padding:20px">'+esc(aviso)+'</p>'); }catch(_){ } } return w; }
async function entregaArquivo(blob,nome,win){
  if(emApp()&&navigator.share&&typeof File==='function'){
    const f=new File([blob],nome,{type:blob.type||'application/octet-stream'});
    if(!navigator.canShare||navigator.canShare({files:[f]})){
      const vai=()=>navigator.share({files:[f],title:nome});
      try{ await vai(); return; }
      catch(e){ if(e&&e.name==='AbortError')return;
        // o toque "venceu" enquanto o arquivo era preparado: pede um toque novo
        modal(`<h3>Pronto: ${esc(nome)}</h3><p class="small" style="margin:8px 0 14px">Toque no botão e escolha <b>Imprimir</b> ou <b>Salvar em Arquivos</b>.</p>
          <div class="row" style="gap:8px"><button class="btn p" id="eaok"><span class="material-icons" style="font-size:18px;vertical-align:-4px">print</span> Imprimir / Salvar</button><button class="btn" id="eafe">Fechar</button></div>`);
        $('#eaok').onclick=async()=>{ try{ await vai(); fecha(); }catch(er){ if(er&&er.name!=='AbortError')toast(er.message); } };
        $('#eafe').onclick=fecha; return; }
    }
  }
  const u=URL.createObjectURL(blob);
  if(win&&!win.closed){ win.location.href=u; return; }
  const a=document.createElement('a'); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);
}
// modo aplicativo: imprime pela própria tela (só aparece no papel)
function imprimeAqui(html){
  let d=$('#impr'); if(!d){ d=document.createElement('div'); d.id='impr'; document.body.appendChild(d); }
  d.innerHTML=html; document.body.classList.add('imprimindo');
  const fim=()=>{ document.body.classList.remove('imprimindo'); d.innerHTML=''; removeEventListener('afterprint',fim); };
  addEventListener('afterprint',fim); print();
}
async function abrePdf(caminho,nome){
  const win=novaJanela('Buscando no Mercado Livre…',nome);
  try{ const r=await fetch(caminho); const ct=r.headers.get('content-type')||'';
    if(!r.ok||!ct.includes('pdf')){ const j=await r.json().catch(()=>({})); throw new Error(j.erro||('HTTP '+r.status)); }
    await entregaArquivo(await r.blob(),nome,win);
  }catch(e){ if(win&&!win.closed)win.close(); toast(e.message); }
}
async function etiquetaEnvio(id,pedido){
  const win=novaJanela('Buscando a etiqueta no Mercado Livre…','Etiqueta de envio');
  try{ const r=await fetch('/api/ml/etiqueta-envio/'+encodeURIComponent(id)); const ct=r.headers.get('content-type')||'';
    if(!r.ok||!ct.includes('pdf')){ const j=await r.json().catch(()=>({})); throw new Error(j.erro||('HTTP '+r.status)); }
    await entregaArquivo(await r.blob(),'etiqueta-envio-'+id+'.pdf',win);
  }catch(e){ if(win&&!win.closed)win.close();
    if(pedido&&/invoice_pending/i.test(e.message)){ if(confirm('O Mercado Livre só libera a etiqueta depois da declaração de conteúdo (DC-e). Emitir a DC-e deste pedido agora?'))emiteDce(pedido,false); }
    else toast(e.message); }
}

// ficha técnica que veio do anúncio do ML: [[id, nome, valor], ...]
function attrsML(p){ try{ const a=typeof p.ml_attrs==='string'?JSON.parse(p.ml_attrs||'[]'):(p.ml_attrs||[]); return Array.isArray(a)?a:[]; }catch(_){ return []; } }
// ---------- Vincular anúncios do ML às peças que já estão no sistema (ex.: vindas do iBR) ----------
// ---------- casamento anúncio do ML ↔ peça do estoque (roda no navegador) ----------
// ads: [{id,titulo,preco,sku,marca,modelo,pns:[],desc?,status,ja:{peca_id,extra}?}]
// pecas: [{id,codigo,nome,preco,marca,modelo,pn,ml_id}]
// devolve por anúncio: {tipo:'ja'|'certo'|'provavel'|'extra'|'criar'|'duvida', peca, nota, porque, opcoes}
const CASA_SIN={diant:'dianteiro',dianteira:'dianteiro',diantei:'dianteiro',dian:'dianteiro',dt:'dianteiro',frontal:'dianteiro',frente:'dianteiro',
  tras:'traseiro',traseira:'traseiro',traz:'traseiro',tra:'traseiro',tr:'traseiro',
  esq:'esquerdo',esquerda:'esquerdo',le:'esquerdo',motorista:'esquerdo',mot:'esquerdo',
  dir:'direito',direita:'direito',ld:'direito',passageiro:'direito',pass:'direito',carona:'direito',
  sup:'superior',inf:'inferior',cx:'caixa',mod:'modulo',mdl:'modulo',vw:'volkswagen',volks:'volkswagen',gm:'chevrolet',chev:'chevrolet',
  mb:'mercedes',merc:'mercedes',benz:'mercedes',farois:'farol',retrovisores:'retrovisor',retrov:'retrovisor',retro:'retrovisor',
  puxador:'macaneta',interrup:'interruptor',interr:'interruptor',sens:'sensor',comp:'completo',compl:'completa',
  ign:'ignicao',injecao:'injecao',inj:'injecao',ecu:'modulo',centralina:'modulo',central:'modulo',vid:'vidro',acab:'acabamento',
  };
const CASA_PARA=new Set(['para','pc','de','da','do','das','dos','pra','com','sem','em','no','na','nos','nas','ao','aos','um','uma','the','and','for','with',
  'original','orig','originais','genuino','genuina','usado','usada','usados','usadas','peca','pecas','lado','oem','bom','boa','estado','otimo','otima',
  'perfeito','perfeita','funcionando','revisado','revisada','semi','novo','nova','envio','imediato','pronta','entrega','garantia','frete','gratis','ref','cod','codigo','marca']);
function casaSing(w){ if(w.length<=4||/\d/.test(w))return w; return w.replace(/oes$/,'ao').replace(/aes$/,'ao').replace(/ois$/,'ol').replace(/ais$/,'al').replace(/eis$/,'el').replace(/ns$/,'m').replace(/([^s])s$/,'$1'); }
function casaNorm(s){ return String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function casaComp(s){ return casaNorm(s).replace(/[^a-z0-9]/g,''); }
// palavras do título: sinônimos, plural, anos (2013 → a13), cilindrada (1.6 → 1p6), códigos (part number)
function casaTokens(s){
  const t=casaNorm(s).replace(/\bpara[\s-]?(choque|brisa|lama|sol)/g,'para$1').replace(/\bporta[\s-]?(malas|luvas|objeto|treco)/g,'porta$1').replace(/\bquebra[\s-]?sol/g,'quebrasol').replace(/\bl\s*[\/.\-]\s*e\b/g,' esquerdo ').replace(/\bl\s*[\/.\-]\s*d\b/g,' direito ')
    .replace(/(\d)[.,](\d)/g,'$1p$2').replace(/[^a-z0-9]+/g,' ').trim(); const out=[];
  for(let w of t.split(' ')){ if(!w)continue;
    if(/^(19[6-9]\d|20[0-4]\d)$/.test(w)){ out.push('a'+w.slice(2)); continue; }
    if(/^\d{2}$/.test(w)){ out.push('a'+w); continue; }
    if(w.length<2||CASA_PARA.has(w))continue;
    if(w in CASA_SIN){ w=CASA_SIN[w]; if(!w)continue; }
    out.push(casaSing(w)); }
  return out; }
// "códigos" que identificam a peça: com letra e número (8k0959831) ou só número comprido (3425423)
const casaEhPN=w=>w.length>=6&&/\d/.test(w)&&(/[a-z]/.test(w)||w.length>=7)&&!/^a\d\d$/.test(w)&&!/^(19|20)\d\d(19|20)\d\d$/.test(w);
function casaPNs(...txt){ const s=new Set(), mista=w=>/\d/.test(w)&&/[a-z]/.test(w);
  for(const x of txt){ if(!x)continue; const n=casaNorm(x);
    for(const w of n.split(/[^a-z0-9]+/))if(casaEhPN(w))s.add(w);
    // código escrito com traço ou ponto (93BB-12A650-BC)
    for(const m of n.matchAll(/[a-z0-9]+(?:[-.\/][a-z0-9]+){1,4}/g)){ const c=m[0].replace(/[^a-z0-9]/g,''); if(c.length>=8&&mista(c))s.add(c); }
    // ou com espaço (93BB 12A650 BC): pedaços misturando letra e número
    const ws=n.split(/[^a-z0-9]+/).filter(Boolean);
    for(let i=0;i<ws.length;i++)for(let k=2;k<=3&&i+k<=ws.length;k++){ const g=ws.slice(i,i+k);
      if(g.filter(mista).length>=2&&g.every(w=>mista(w)||w.length<=2)){ const c=g.join(''); if(c.length>=8)s.add(c); } } }
  return s; }
const CASA_OPOSTOS=[['esquerdo','direito'],['dianteiro','traseiro'],['superior','inferior'],['interno','externo']];
const casaPNforte=c=>c.length>=7&&(c.match(/\d/g)||[]).length>=4;
const CASA_GENERICO=new Set(['original','generico','generica','nao','naoseaplica','oem','na','sm','sem','outro','outra','universal','paralelo']);
function casaAnuncios(ads,pecas){
  // ---- preparo ----
  const P=pecas.map(p=>{ const tk=casaTokens(p.nome); return {p,tk:new Set(tk),tipo:tk.find(w=>!/^a\d\d$/.test(w)&&!/\d/.test(w))||'',
    pns:casaPNs(p.nome,p.pn,casaEhPN(casaComp(p.modelo))?p.modelo:''),comp:casaComp([p.nome,p.pn,p.modelo].join(' ')),nomeN:casaTokens(p.nome).join(' '),
    marca:casaComp(p.marca),modelo:casaComp(p.modelo),preco:Number(p.preco)||0,cod:Number(p.codigo)}; });
  const A=ads.map(a=>{ const tk=casaTokens(a.titulo); const attrs=[a.marca,a.modelo,...(a.pns||[])].join(' ');
    return {a,tk:new Set(tk),tipo:tk.find(w=>!/^a\d\d$/.test(w)&&!/\d/.test(w))||'',pns:casaPNs(a.titulo,...(a.pns||[]),a.modelo,a.desc||''),comp:casaComp([a.titulo,attrs,a.desc||''].join(' ')),nomeN:tk.join(' '),

  const df=new Map(); for(const x of [...P,...A])for(const w of x.tk)df.set(w,(df.get(w)||0)+1);

    for(const [u,v] of CASA_OPOSTOS){ const xu=x.tk.has(u),xv=x.tk.has(v),au=a.tk.has(u),av=a.tk.has(v);

// quão pronta a peça está pra virar anúncio
function prontidao(p){
  const nf=(p.fotos||[]).length;
  const itens=[['foto',nf>0,1],['3 fotos ou mais',nf>=3],['preço',Number(p.preco)>0,1],['estoque',Number(p.qtd)>0,1],['marca e modelo',!!(p.marca&&p.modelo)],
    ['ano',!!p.ano],['part number',!!p.pn],['condição',!!p.cond],['embalagem (peso e medidas)',!!(p.peso_g&&p.alt_cm&&p.larg_cm&&p.comp_cm)],['localização',!!p.local_id]];
  const ok=itens.filter(i=>i[1]).length;
  return { pct:Math.round(ok*100/itens.length), falta:itens.filter(i=>!i[1]).map(i=>i[0]), bloqueia:itens.filter(i=>i[2]&&!i[1]).map(i=>i[0]) };
}
function barraPront(p,compacta){
  const r=prontidao(p), cor=r.pct>=80?'var(--ok)':r.pct>=50?'var(--amber)':'var(--red)';
  return `<div class="pr${compacta?' pr-c':''}" title="${r.falta.length?'Falta: '+esc(r.falta.join(', ')):'Tudo pronto'}"><div class="pr-t"><span>Pronta pra publicar</span><b style="color:${cor}">${r.pct}%</b></div><div class="pr-b"><i style="width:${r.pct}%;background:${cor}"></i></div>`
    +(compacta?'':r.falta.length?`<div class="small mut" style="margin-top:4px">Falta: ${esc(r.falta.join(', '))}</div>`:'<div class="small" style="margin-top:4px;color:var(--ok)">Tudo pronto ✓</div>')+'</div>';
}

let _sugT;
function bindSugestoes(){
  const box=()=>$('#sugwrap'); const f=$('#pf'); if(!f) return;
  const atualiza=()=>{ clearTimeout(_sugT); _sugT=setTimeout(async()=>{
    const b=box(); if(!b) return;
    const q=(f.elements.nome.value+' '+f.elements.pn.value).trim();
    if(q.length<2){ b.innerHTML=''; return; }
    let r; try{ r=await api('/sugestoes?q='+encodeURIComponent(q)); }catch{ return; }
    if(!r.sugestoes||!r.sugestoes.length){ b.innerHTML=''; return; }
    b.innerHTML=`<div class="sugbox"><div class="sughd">📋 Peças parecidas no seu cadastro — toque para preencher</div>${r.sugestoes.map((s,i)=>`<div class="sugitem" data-si="${i}"><b>${esc(s.nome)}</b> <span class="mut">${esc([s.marca,s.modelo,s.ano].filter(Boolean).join(' '))}${s.pn?' · PN '+esc(s.pn):''}</span> <span class="sugpr">${brl(s.preco)}</span>${s.n>1?` <span class="mut">· ${s.n}×</span>`:''}</div>`).join('')}</div>`;
    b.querySelectorAll('[data-si]').forEach(el=>el.onclick=()=>{ preencheDe(r.sugestoes[+el.dataset.si]); b.innerHTML=''; });
  },220); };
  ['nome','pn'].forEach(k=>{ const el=f.elements[k]; if(el) el.addEventListener('input',atualiza); });
}
function preencheDe(s){ const f=$('#pf'); const set=(k,v)=>{ if(f.elements[k]!=null && v!=null && v!=='') f.elements[k].value=v; };
  set('nome',s.nome); set('marca',s.marca); set('modelo',s.modelo); set('ano',s.ano); set('pn',s.pn); if(s.cond)set('cond',s.cond); if(s.preco)set('preco',s.preco);
  toast('Preenchido a partir do seu cadastro — confira e ajuste'); if(f.elements.preco)f.elements.preco.focus();
}
// ditar por voz (Web Speech API — grátis; funciona no Google Chrome, em português)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function iniciaDitado(btn){
  if(!SR){ toast('Ditado por voz não disponível aqui. Use o Google Chrome.'); return; }
  const campo=btn.closest('.withmic').querySelector('input,textarea'); if(!campo||btn.classList.contains('on'))return;
  const rec=new SR(); rec.lang='pt-BR'; rec.interimResults=false; rec.maxAlternatives=1;
  btn.classList.add('on'); btn.textContent='🔴';
  rec.onresult=e=>{ let t=(e.results[0][0].transcript||'').trim(); if(!t)return;
    if(!campo.value.trim()) t=t.charAt(0).toUpperCase()+t.slice(1);
    campo.value=campo.value.trim()?(campo.value.trim()+' '+t):t;
    campo.dispatchEvent(new Event('input',{bubbles:true})); campo.focus(); };
  rec.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed')toast('Permita o microfone no navegador.'); else if(ev.error!=='no-speech'&&ev.error!=='aborted')toast('Não consegui ouvir. Tente de novo.'); };
  rec.onend=()=>{ btn.classList.remove('on'); btn.textContent='🎤'; };
  try{ rec.start(); }catch{ btn.classList.remove('on'); btn.textContent='🎤'; }
}
function bindMics(){ document.querySelectorAll('.mic').forEach(b=>{ if(!b._b){ b._b=1; b.onclick=()=>iniciaDitado(b); } }); }
// sugere uma caixa (folha) com espaço livre — tecnologia de "localização inteligente"
function sugereCaixa(){
  const f=$('#pf'), r=regraPara(f.elements.nome.value), alvo=melhorCaixa(r?r.l.id:'');
  if(!alvo){ toast('Nenhuma caixa com espaço. Crie uma em Localizações.'); return; }
  f.elements.local_id.value=alvo.id; dicaLocal(alvo,r);
}
function dicaLocal(cx,r){ const el=$('#locdica'); if(el)el.innerHTML=`📍 <b>${esc(codigoTxt(cx.id))}</b> — ${esc(locPath(cx.id))}${r?` <span class="mut">· regra “${esc(r.w)}”</span>`:''}`; }
// localização inteligente: ao terminar de digitar o nome, se o local estiver vazio, escolhe pela regra
function autoLocal(){ const f=$('#pf'); if(!f||f.elements.local_id.value)return; const r=regraPara(f.elements.nome.value); if(!r)return;
  const cx=melhorCaixa(r.l.id); if(cx){ f.elements.local_id.value=cx.id; dicaLocal(cx,r); } }
function drawThumbs(){ const t=$('#thumbs'); if(!t)return; t.innerHTML=S.ui.fotos.map((f,i)=>`<div class="${i?'':'princ'}"><img src="${f.key?'/api/foto/'+f.key:URL.createObjectURL(f.blob)}"><button type="button" data-i="${i}">×</button><span class="star" data-p="${i}" title="${i?'Usar como principal':'Foto principal'}">★</span>${f.ia?`<span class="iabadge">${f.ia==='arte'?'ARTE':'IA'}</span>`:''}</div>`).join('');
  t.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{ S.ui.fotos.splice(+b.dataset.i,1); drawThumbs(); });
  t.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.p; if(!i)return; const [f]=S.ui.fotos.splice(i,1); S.ui.fotos.unshift(f); drawThumbs(); }); }
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{ const M=1600,r=Math.min(1,M/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*r|0; c.height=img.height*r|0; c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>res(b),'image/jpeg',0.85); };
  img.onerror=()=>{ URL.revokeObjectURL(u); rej(); }; img.src=u; }); }

let ortProm=null, sesProm=null;

async function mascaraPeca(img){

  const d=x.getImageData(0,0,S,S).data, f=new Float32Array(3*S*S), media=[0.485,0.456,0.406], dp=[0.229,0.224,0.225];

  for(let i=0,p=0;i<d.length;i+=4,p++)for(let k=0;k<3;k++)f[k*S*S+p]=(d[i+k]/mx-media[k])/dp[k];

  const r=await ses.run({[ses.inputNames[0]]:new ort.Tensor('float32',f,[1,3,S,S])}), m=r[ses.outputNames[0]].data;
  let mn=Infinity, ma=-Infinity; for(const v of m){ if(v<mn)mn=v; if(v>ma)ma=v; }
  const mc=document.createElement('canvas'); mc.width=mc.height=S; const mx2=mc.getContext('2d'), md=mx2.createImageData(S,S);
  for(let p=0;p<S*S;p++){ md.data[p*4]=md.data[p*4+1]=md.data[p*4+2]=255; md.data[p*4+3]=Math.round(255*(m[p]-mn)/((ma-mn)||1)); }
  mx2.putImageData(md,0,0); return mc;
}

// recorta a peça e devolve a foto 1200x1200 (JPEG) + recorte transparente (pra arte). op = o que o comando pediu
async function fotoFundoBranco(fonte,op={}){

    const oc=op.ocupa||0.84, s=Math.min(T*oc/rec.width,T*oc/rec.height), dw=rec.width*s, dh=rec.height*s, px=(T-dw)/2, py=(T-dh)/2;

}
function giraCanvas(c,graus,espelhar){
  const r=graus*Math.PI/180, cs=Math.abs(Math.cos(r)), sn=Math.abs(Math.sin(r)), w=Math.round(c.width*cs+c.height*sn), h=Math.round(c.width*sn+c.height*cs);

}
// balanço de cores realista (puxa só 30% em direção ao neutro, no máximo 6%)
function balancoCor(d){ let r=0,g=0,b=0,n=0; for(let i=0;i<d.length;i+=4){ if(d[i+3]<128)continue; r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; } if(!n)return;

// reflexo estourado de luz: comprime só os pontos quase brancos da peça, sem mudar a cor
function suavizaReflexos(d){ for(let i=0;i<d.length;i+=4){ if(d[i+3]<128)continue; const l=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114; if(l<=222)continue;

// redução leve de ruído: só mistura onde a variação é pequena (bordas e escritas ficam intactas)
function reduzRuido(o,T,a){ const x0=Math.max(1,a.x|0), y0=Math.max(1,a.y|0), w=Math.min(T-2,(a.x+a.w)|0)-x0, h=Math.min(T-2,(a.y+a.h)|0)-y0; if(w<3||h<3)return;

  for(let y=1;y<=h;y++)for(let x=1;x<=w;x++){ const i=(y*W+x)*4; for(let k=0;k<3;k++){ let s=0; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)s+=src[((y+dy)*W+x+dx)*4+k]; const m=s/9, v=src[i+k];
    if(Math.abs(v-m)<10)d[i+k]=v*0.45+m*0.55; } }

// nitidez (máscara de nitidez leve) — corrige micro-desfoque sem inventar detalhe
function aplicaNitidez(o,T,a){ const x0=Math.max(1,a.x|0), y0=Math.max(1,a.y|0), w=Math.min(T-2,(a.x+a.w)|0)-x0, h=Math.min(T-2,(a.y+a.h)|0)-y0; if(w<3||h<3)return;

// lê o comando (prompt) da foto e diz o que vai aplicar
function leComandoFoto(txt){
  const t=nrm(txt||''), op={}, ok=[];
  const cores=[['cinza claro','#f2f2f2'],['cinza','#e9e9e9'],['preto','#111111'],['azul','#e3f2fd'],['bege','#f5efe6'],['branco','#ffffff']];
  const mf=t.match(/fundo\s+(cinza claro|cinza|preto|azul|bege|branco)/); op.fundo=mf?cores.find(c=>c[0]===mf[1])[1]:'#ffffff'; ok.push('fundo '+(mf?mf[1]:'branco'));
  if(/sem sombra/.test(t))ok.push('sem sombra'); else if(/com sombra|sombra suave/.test(t)){ op.sombra=true; ok.push('sombra suave embaixo'); }
  ok.push('1200 × 1200 px');
  if(/reflex/.test(t)&&/remov|tir|reduz|elimin|suaviz/.test(t)){ op.reflexos=true; ok.push('reflexos de luz suavizados'); }
  if(/nitidez|desfoque|upscale|defini|canon|lente/.test(t)){ op.nitidez=true; ok.push('mais nitidez (corrige micro-desfoque)'); }
  if(/ruido|granulad/.test(t)){ op.ruido=true; ok.push('ruído de sensor reduzido'); }
  if(/balanco de cor|balanco das cor|equilibr\w* (as )?cor/.test(t)){ op.cor=true; ok.push('balanço de cores realista'); }
  if(/sem (clarear|realce|ajuste|tratamento)|cores naturais/.test(t)){ op.realce=false; ok.push('sem clarear'); }
  else{ if(/mais clar|mais brilho|mais luz/.test(t)){ op.claro=25; ok.push('mais claro'); } else if(/mais escur/.test(t)){ op.claro=-20; ok.push('mais escuro'); }
    if(/contraste/.test(t)){ op.contraste=/menos contraste/.test(t)?0.93:1.06; ok.push((/menos contraste/.test(t)?'menos':'contraste otimizado')); } }
  if(/(mant\w*|preserv\w*).{0,20}(tonalidade|cor)/.test(t))ok.push('tonalidade das cores mantida');
  let m; if((m=t.match(/(\d{2})\s*%/))){ op.ocupa=Math.min(.98,Math.max(.4,+m[1]/100)); ok.push('peça ocupando '+m[1]+'%'); }
  else if(/peca maior|mais zoom|aproxim/.test(t)){ op.ocupa=.94; ok.push('peça maior'); } else if(/peca menor|mais margem|menos zoom|afast/.test(t)){ op.ocupa=.7; ok.push('mais margem'); }
  if((m=t.match(/gir\w*\s*(-?\d{1,3})/))){ op.girar=((+m[1])%360+360)%360; ok.push('girar '+op.girar+'°'); }
  if(/espelh/.test(t)){ op.espelhar=true; ok.push('espelhar'); }
  if(/recorte mais justo|limpar borda/.test(t)){ op.corte=.35; ok.push('recorte mais justo'); } else if(/recorte mais solto/.test(t)){ op.corte=.08; ok.push('recorte mais solto'); }
  if(/canon|lente|camera/.test(t))ok.push('acabamento de foto profissional (a lente em si não dá pra simular)');
  return {op,ok,branco:op.fundo==='#ffffff'};
}

// clareia/contrasta só a peça (fotos de desmanche costumam sair escuras)
function realcePeca(d,claro=0,contraste=1){
  const hist=new Uint32Array(256); let n=0;
  for(let i=0;i<d.length;i+=4){ if(d[i+3]<128)continue; hist[(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0]++; n++; }

  for(let v=0;v<256;v++){ a+=hist[v]; if(a>=n*0.02){ lo=v; break; } } a=0;
  for(let v=255;v>=0;v--){ a+=hist[v]; if(a>=n*0.02){ hi=v; break; } }
  const g=Math.min(1.6,Math.max(1,225/Math.max(1,hi-lo)))*contraste, off=Math.max(0,18-lo*g)+claro;
  if(g<1.03&&g>0.97&&Math.abs(off)<2)return;
  for(let i=0;i<d.length;i+=4)for(let k=0;k<3;k++){ const v=(d[i+k]-lo)*g+lo+off; d[i+k]=v<0?0:v>255?255:v; }
}

const hexA=(h,a)=>{ const n=parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
// lê o comando da arte: regras gerais (português, 1200, sem dizer usada/nova) + ajustes curtos opcionais
function leComandoArte(txt){
  const op={}, ok=['1200 × 1200 px','tudo em português','não diz se a peça é usada ou nova','foto real da peça (não redesenhada)'];
  for(const linha of String(txt||'').split(/\n|;/)){ const l=linha.trim(); if(!l)continue; const n=nrm(l); let m;
    if((m=l.match(/^t[ií]tulo\s*[:\-]\s*(.+)$/i))){ op.titulo=m[1].trim().slice(0,40); ok.push('título: '+op.titulo); }
    else if(/^sem t[ií]tulo/i.test(l)){ op.semTitulo=true; ok.push('sem título'); }
    else if((m=l.match(/^(legenda|texto|frase)\s*[:\-]\s*(.+)$/i))){ op.legenda=m[2].trim().slice(0,90); ok.push('legenda própria'); }
    else if((m=l.match(/^lado\s*[:\-]?\s*(.+)$/i))){ const x=nrm(m[1]); op.lado=/dir/.test(x)?'Lado direito (passageiro)':/esq/.test(x)?'Lado esquerdo (motorista)':m[1].trim().slice(0,40); ok.push(op.lado); }
    else if((m=l.match(/^(local|onde|fica)\s*[:\-]\s*(.+)$/i))){ const z=zonaDe(m[2]); if(z){ op.zona=z; ok.push('local: '+ZONAS[z].n); } }
    else if((m=n.match(/^(destaque|cor)\s+(vermelho|azul|verde|laranja|amarelo|roxo)/))){ op.cor=COR_DESTAQUE[m[2]]; ok.push('destaque '+m[2]); }
    else if(/^sem (veiculo|carro)/.test(n)){ op.semVeiculo=true; ok.push('sem o veículo escrito'); }
    else if(/^sem (foto|peca)/.test(n)){ op.semFoto=true; ok.push('sem a foto da peça'); }
    else if(/^sem aviso/.test(n)){ op.semAviso=true; ok.push('sem o aviso de ilustração'); } }
  return {op,ok};

function textoCabe(x,txt,cx,y,maxW,tam,peso,F){ let t=tam; for(;t>24;t-=2){ x.font=`${peso} ${t}px ${F}`; if(x.measureText(txt).width<=maxW)break; }

  const ps=txt.split(' '); let l1=''; for(const w of ps){ if(x.measureText((l1+' '+w).trim()).width>maxW)break; l1=(l1+' '+w).trim(); }
  x.fillText(l1,cx,y-t*0.55); x.fillText(txt.slice(l1.length).trim(),cx,y+t*0.55); return y+t*0.55; }

    const g=x.createRadialGradient(zx,zy,8,zx,zy,90); g.addColorStop(0,hexA(cor,.55)); g.addColorStop(1,hexA(cor,0)); x.fillStyle=g; x.beginPath(); x.arc(zx,zy,90,0,Math.PI*2); x.fill();
    x.strokeStyle=cor; x.lineWidth=7; x.beginPath(); x.arc(zx,zy,40,0,Math.PI*2); x.stroke(); x.fillStyle=cor; x.beginPath(); x.arc(zx,zy,11,0,Math.PI*2); x.fill(); }

  const lado=op.lado!==undefined?op.lado:ladoDe(p.nome||''); if(lado){ x.fillStyle='#546e7a'; y=textoCabe(x,lado.charAt(0).toUpperCase()+lado.slice(1),T/2,y+58,1120,38,'',F); }

function veicDoNome(nome,marca,modelo,ano){

  const mk=MARCAS.find(m=>new RegExp('\\b'+m+'\\b','i').test(t))||marca||'';   // o carro escrito no nome vale mais que os campos

const ICON_NIVEL=['warehouse','view_week','layers'];
// sigla curta de cada nível (ex.: GALPÃO-1 → 01, PRT-17E → 17E, NÍVEL-A → A, CAIXA-1 → CX1)
function siglaDe(id){ const l=S.locais[id]; if(!l)return ''; if(l.sigla)return String(l.sigla).toUpperCase();
  const d=depth(id), folha=d>0&&!locChildren(id).length, t=String(l.nome).trim().split(/[-\s]+/).pop()||l.nome;
  let s=t.length<=4?t:t.slice(0,3);
  if(d===0&&/^\d+$/.test(s))s=s.padStart(2,'0');
  if(folha&&/^(caixa|cx)/.test(nrm(l.nome))&&!/^cx/i.test(s))s='CX'+s;
  return s.toUpperCase(); }
// código curto no padrão da etiqueta da caixa: caixa → ['01 – 17E D 6','CX1'] · demais níveis → ['','01 – 17E D']
function siglasAte(id){ const ids=[]; let c=S.locais[id],g=0; while(c&&g++<20){ ids.unshift(c.id); c=S.locais[c.pai]; } return ids.map(siglaDe); }
const juntaSig=sg=>sg.length?sg[0]+(sg.length>1?' – '+sg.slice(1).join(' '):''):'';
const ehCaixa=id=>depth(id)>0&&!locChildren(id).length;
function codigoLocal(id){ const sg=siglasAte(id); if(ehCaixa(id)){ const u=sg.pop(); return [juntaSig(sg),u]; } return ['',juntaSig(sg)]; }
const codigoTxt=id=>codigoLocal(id).filter(Boolean).join(' · ');
const regrasDe=l=>String(l&&l.regras||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
// regra que casa com o nome da peça (a palavra mais específica vence)
function regraPara(nome){ const t=nrm(nome); let m=null;
  for(const l of Object.values(S.locais))for(const w of regrasDe(l)){ const n=nrm(w); if(n&&t.includes(n)&&(!m||n.length>m.n.length))m={l,w,n}; }
  return m; }
function folhasDe(raiz){ const r=[]; const v=id=>{ const ch=locChildren(id); if(!ch.length){ if(id)r.push(S.locais[id]); } else ch.forEach(c=>v(c.id)); }; v(raiz||''); return r; }
// caixa com mais espaço livre (dentro da área, se houver); sem limite fica por último
function melhorCaixa(raiz){ const f=folhasDe(raiz);
  const com=f.filter(l=>l.capacidade&&(Number(l.ocupacao)||0)<l.capacidade).sort((a,b)=>(b.capacidade-(Number(b.ocupacao)||0))-(a.capacidade-(Number(a.ocupacao)||0)));
  return com[0]||f.find(l=>!l.capacidade)||null; }

      html=l.map(id=>nodeHTML(id,0,true)).join('');

      if(ps.length)html+=`<div class="lc-sep">Peças encontradas</div>`+ps.map(p=>linhaPeca(p,0,true)).join(''); }
    else html=locChildren('').map(l=>nodeHTML(l.id,0)).join('');
    $('#llista').innerHTML=html||`<div class="empty">${q.length?'Nada encontrado.':'Nenhuma localização ainda. Comece criando um Galpão/Pátio.'}</div>`;

    $('#lfver').onclick=e=>{ e.preventDefault(); st.aberto=!st.aberto; pinta(); };
    if($('#lfcomp'))$('#lfcomp').onclick=completarFotos;
    el.querySelectorAll('[data-lfp]').forEach(a=>a.onclick=e=>{ e.preventDefault(); abrePeca(a.dataset.lfp); });
    if($('#lfbusca'))$('#lfbusca').onclick=async()=>{ st.rodando=true; pinta(); let ok=0;
      for(let i=0;i<com.length;i++){ if(!$('#lfprog'))return; $('#lfprog').innerHTML=`<span class="spin-s"></span> Buscando ${i+1} de ${com.length}…`;
        try{ const x=await api('/pecas/'+com[i].id+'/fotos/conferir',{method:'POST'}); com[i].erro=x.erro; com[i].tentou=Date.now(); if(x.fotos&&x.fotos.length){ ok++; (S.pecas||[]).forEach(p=>{ if(p.id===com[i].id)p.fotos=x.fotos; }); } }
        catch(e){ com[i].erro=e.message; } }
      st.rodando=false; toast(`🖼️ ${ok} peça(s) ganharam foto`); if(S.ui._redesenhaLoc)S.ui._redesenhaLoc(); avisoSemFoto(); };
  };
  pinta(); }

// ---------- varredura dos anúncios do ML (usada pelo scanner e pela tela de compatibilidade) ----------
async function varreAnuncios(prog){
  const l=[];
  for(const st of ['active','paused','under_review']){ let off=0;
    while(off!=null){ let r; try{ r=await api(`/ml/scanner?status=${st}&offset=${off}`); }catch(e){ if(st==='active')throw e; break; }
      l.push(...r.lista); off=r.proximo; if(prog)prog(l.length); if(off!=null&&off>=1000)break; } }
  S.ui.varredura={quando:Date.now(),lista:l}; return l; }
const ehCompat=it=>it.status==='under_review'||[...(it.tags||[]),...(it.sub||[])].some(t=>/compatib/i.test(t));
const PROB_SC=[
  ['estoque','Estoque diferente do sistema','inventory',(it,p)=>p&&!it.protegido&&['active','paused'].includes(it.status)&&Number(it.qtd)!==Math.max(0,Number(p.qtd)||0)?`estoque ML ${it.qtd} · sistema ${Number(p.qtd)||0}`:null,true],
  ['preco','Preço diferente do sistema','sell',(it,p)=>{ if(!p||it.protegido)return null; const alvo=Number(p.preco_mkp)>0?Number(p.preco_mkp):Number(p.preco)||0; return alvo&&Math.abs(Number(it.preco)-alvo)>0.5?`ML ${brl(it.preco)} · sistema ${brl(alvo)}`:null; },true],
  ['sempeca','Sem peça ligada','link_off',(it,p)=>p?null:'sem peça no sistema'],
  ['pausado','Pausados','pause_circle',it=>it.status==='paused'?'pausado'+(it.sub&&it.sub.length?': '+subML(it.sub):''):null],
  ['revisao','Em revisão / compatibilidade','car_crash',it=>ehCompat(it)?(it.status==='under_review'?'em revisão no ML':'compatibilidade incompleta'):null],
  ['fotos','Poucas fotos (menos de 3)','photo_library',it=>it.nfotos<3?it.nfotos+' foto(s)':null],
  ['pn','Sem part number','pin',it=>it.pn?null:'sem part number'],
  ['titulo','Título curto','short_text',it=>(it.titulo||'').length<40?(it.titulo||'').length+' letras no título':null],
  ['saude','Qualidade do anúncio baixa','health_and_safety',it=>it.saude!=null&&it.saude<0.75?'qualidade '+Math.round(it.saude*100)+'%':null],
];

function itemPeca(p){
  const c=String(p.codigo).padStart(6,'0');

  return { tipo:'peca', id:p.id, rotulo:cod(p.codigo)+' · '+p.nome, qr:linkQR('p',c), loja:LOJA.toUpperCase(), num:String(p.codigo), titulo:limpaEtq(p.nome), local };

function itemLocal(id){ const [cima,baixo]=codigoLocal(id); return { tipo:'local', rotulo:codigoTxt(id)+' — '+locPath(id), qr:linkQR('l',id), acima:cima, grande:baixo }; }

const linkQR=(t,v)=>location.origin+'/'+t+'/'+encodeURIComponent(v);
// entende o que veio do leitor/câmera: link novo (…/p/000123), etiqueta antiga (P:000123) ou só o número

function lePeca(v){ v=String(v||'').trim(); const ibr=/ibrsoft/i.test(v)&&v.match(/code=0*(\d{1,12})/i); if(ibr)return parseInt(ibr[1],10); let m=v.match(/^0*(\d{1,9})$/)||v.match(/(?:^|[^a-z])p[^a-z0-9]{0,2}0*(\d{1,9})[^a-z0-9]{0,2}$/i); return m?parseInt(m[1],10):null; }
function leLocal(v){ v=String(v||'').trim(); const m=v.match(/(?:^|[^a-z])l[^a-z0-9]{1,2}([\w-]+)[^\w-]{0,2}$/i); return m?decodeURIComponent(m[1]):null; }

  for(const it of itens)for(let c=0;c<(copias||1);c++){ if(n++)doc.addPage([W,H],ori); it.tipo==='local'?desenhaLocal(doc,it,W,H):desenhaPeca(doc,it,W,H); }
  const ids=[...new Set(itens.filter(i=>i.tipo==='peca'&&i.id).map(i=>i.id))];
  if(ids.length)api('/pecas/etiquetas',{method:'POST',body:{ids}}).then(r=>ids.forEach(id=>{ const p=(S.pecas||[]).find(x=>x.id===id); if(p)p.etq_em=r.em; })).catch(()=>{});
  return doc.output('bloburl');
}
function qrPDF(doc,txt,x,y,t){ const q=qrcode(0,'M'); q.addData(txt); q.make(); const n=q.getModuleCount(), m=t/n; doc.setFillColor(0,0,0);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))doc.rect(x+c*m,y+r*m,m+0.02,m+0.02,'F'); }
// quebra o texto em linhas; se for centralizado, estreita a largura até o limite para as linhas ficarem equilibradas
function quebra(doc,t,w,centro){
  let ls=doc.splitTextToSize(t,w); if(!centro||ls.length<2)return ls;
  for(let ww=w*0.97;ww>w*0.45;ww*=0.97){ const m=doc.splitTextToSize(t,ww); if(m.length>ls.length)break; ls=m; }
  return ls;
}
// escreve um bloco de linhas centralizado na altura, reduzindo a fonte até caber
// opções por linha: centro (texto centralizado), min (até quanto a fonte pode encolher p/ caber em max linhas; padrão 0.6),
// antes (espaço em mm antes da linha)
function blocoTexto(doc,partes,x,w,H,pad,top){
  if(top==null)top=pad; // top = onde começa a área do texto (padrão: margem)
  // 1º: cada linha longa encolhe sozinha (até 60%) pra caber no nº de linhas dela
  for(const pt of partes){ pt.k=1; const t=pdfTxt(pt.t); if(!t)continue; doc.setFont('helvetica',pt.bold?'bold':'normal');
    while(pt.k>(pt.min||0.6)){ doc.setFontSize(pt.size*pt.k); if(doc.splitTextToSize(t,w).length<=(pt.max||2))break; pt.k-=0.02; } }
  // 2º: se o bloco não couber na altura, reduz tudo junto
  for(let k=1;;k-=0.05){
    const lin=[]; let alt=0, estourou=false, ultimo=k<=0.42;
    for(const pt of partes){ const t=pdfTxt(pt.t); if(!t)continue; const fs=pt.size*pt.k*k;
      doc.setFont('helvetica',pt.bold?'bold':'normal'); doc.setFontSize(fs);
      let ls=quebra(doc,t,w,pt.centro); const mx=pt.max||2;
      if(ls.length>mx){ estourou=true; if(ultimo){ ls=ls.slice(0,mx); ls[mx-1]=ls[mx-1].replace(/\s*\S{0,3}$/,'')+'...'; } }
      let gap=pt.antes||0; for(const l of ls){ lin.push({l,fs,b:pt.bold,c:pt.centro,gap}); alt+=fs*PT*1.2+gap; gap=0; } }
    if((alt<=H-top-pad&&!estourou)||ultimo){ let y=top+Math.max(0,(H-top-pad-alt)/2);
      for(const L of lin){ y+=L.gap; doc.setFont('helvetica',L.b?'bold':'normal'); doc.setFontSize(L.fs); if(L.c)doc.text(L.l,x+w/2,y+L.fs*PT*0.92,{align:'center'}); else doc.text(L.l,x,y+L.fs*PT*0.92); y+=L.fs*PT*1.2; }
      return; }
  }
}
// etiqueta de peça: QR grande à esquerda · à direita: cabeçalho da loja, nº da peça bem grande,
// nome da peça (centralizado) e, afastado dele, o local de estoque (caminho completo, numa linha só)
function desenhaPeca(doc,it,W,H){
  const pad=Math.min(W,H)*0.06, k=H/50;
  const box=Math.min(H-2*pad,W*0.46), quiet=box*0.05, q=box-2*quiet; // quiet = margem branca em volta do QR (o leitor precisa)
  qrPDF(doc,it.qr,pad+quiet,(H-q)/2,q);
  const x=pad+box+pad*0.6, w=W-x-pad;
  // cabeçalho em destaque, ajustado à largura, sem linha embaixo
  const cab=pdfTxt(it.loja); doc.setFont('helvetica','bold'); doc.setFontSize(10); const w10=doc.getTextWidth(cab);
  const fs=Math.min(13*k,10*w/w10); doc.setFontSize(fs);
  const yb=pad+fs*PT*0.78; doc.text(cab,x+w/2,yb,{align:'center'});
  const yl=yb+fs*PT*0.3;
  blocoTexto(doc,[{t:it.num,size:38*k,bold:true,max:1,centro:true},{t:it.titulo,size:9.5*k,bold:true,max:3,centro:true},{t:it.local?'Local: '+it.local:'',size:7*k,bold:true,max:1,min:0.3,antes:3.5*k,centro:true}],x,w,H,pad,yl+pad*0.5);
}
// etiqueta de caixa/prateleira: QR à esquerda, caminho e nome grande
function desenhaLocal(doc,it,W,H){
  const pad=Math.min(W,H)*0.06, q=Math.min(H-2*pad,W*0.42);
  qrPDF(doc,it.qr,pad,(H-q)/2,q);
  const x=pad+q+pad*1.5, k=H/50;
  blocoTexto(doc,[{t:it.acima,size:26*k,bold:true,max:1,centro:true},{t:it.grande,size:30*k,bold:true,max:1,centro:true}],x,W-x-pad,H,pad);
}

function leCSV(txt){
  txt=String(txt).replace(/^﻿/,''); const l1=txt.split(/\r?\n/)[0]||'';
  const sep=[';','\t',','].map(c=>[c,l1.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const linhas=[]; let lin=[], cel='', q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cel+='"'; i++; } else q=false; } else cel+=ch; continue; }
    if(ch==='"')q=true; else if(ch===sep){ lin.push(cel); cel=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n')i++; lin.push(cel); cel=''; if(lin.some(x=>x.trim()))linhas.push(lin); lin=[]; } else cel+=ch; }
  lin.push(cel); if(lin.some(x=>x.trim()))linhas.push(lin);
  return linhas;
}

    $('#impok').onclick=async()=>{ const b=$('#impok'); b.disabled=true; const conf=(document.querySelector('[name=impc]:checked')||{}).value||'pular';
