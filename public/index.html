<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafa Busca Peças</title>
<meta name="theme-color" content="#3f51b5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="/qrcode.min.js"></script>
<style>
:root{--pri:#3f51b5;--pri2:#5c6bc0;--pri-t:#e8eaf6;--red:#d32f2f;--red2:#e53935;--ink:#212121;--mut:#757575;--line:#e0e0e0;--bg:#f5f5f5;--card:#fff;--ok:#2e7d32;--amber:#f9a825;--olx:#6e0ad6;--blue:#1565c0;--rad:4px;--sh:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12);--sh2:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px 0 rgba(0,0,0,.14),0 1px 18px 0 rgba(0,0,0,.12);--tb:64px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.material-icons{font-family:'Material Icons';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
/* carregando */
.splash{position:fixed;inset:0;background:var(--pri);display:grid;place-items:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--pri)}
.authcard{background:#fff;border-radius:var(--rad);box-shadow:var(--sh2);padding:26px;width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand .logo{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:18px}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:400;margin:14px 0 2px}
input,select,textarea{width:100%;border:0;border-bottom:1px solid #bdbdbd;border-radius:0;padding:8px 2px;background:transparent;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{border:1px solid #bdbdbd;border-radius:var(--rad);padding:8px 10px}
input:focus,select:focus{outline:0;border-bottom-color:var(--pri);box-shadow:0 1px 0 0 var(--pri)}
textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.msg{margin-top:12px;font-size:13px;min-height:16px}.msg.err{color:var(--red)}
.linkb{background:none;border:0;color:var(--pri);font-weight:500;cursor:pointer;font-size:13px;padding:0;margin-top:14px}
/* barra superior */
.topbar{position:sticky;top:0;z-index:30;height:var(--tb);background:var(--pri);color:#fff;display:flex;align-items:center;box-shadow:0 2px 4px -1px rgba(0,0,0,.2),0 4px 5px 0 rgba(0,0,0,.14),0 1px 10px 0 rgba(0,0,0,.12)}
.tb-brand{width:235px;flex-shrink:0;padding-left:28px;line-height:1;cursor:pointer;user-select:none}
.tb-brand b{display:block;font-size:20px;font-weight:900;letter-spacing:.12em;font-style:italic}
.tb-brand small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin-top:3px}
.tb-search{flex:1;max-width:710px;padding:0 16px 0 84px}
.tb-search input{background:#fff;border:0;border-radius:2px;padding:11px 16px;color:var(--ink)}
.tb-search input:focus{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.tb-btn{margin-left:auto;margin-right:14px;background:none;border:0;color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.tb-btn:hover{background:rgba(255,255,255,.14)}
.tb-btn .material-icons{font-size:26px}
.scanbox{position:relative;background:#000;border-radius:var(--rad);overflow:hidden;height:min(78vw,380px);margin:10px 0}
.scanbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanmira{position:absolute;left:50%;top:50%;width:62%;height:62%;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.95);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
/* shell */
.app{display:flex;min-height:calc(100vh - var(--tb))}
nav.side{width:235px;background:#fff;border-right:1px solid var(--line);padding:12px 0;flex-shrink:0;position:sticky;top:var(--tb);align-self:flex-start;height:calc(100vh - var(--tb));overflow-y:auto}
nav a{position:relative;display:flex;align-items:center;gap:22px;padding:12px 26px;color:#424242;text-decoration:none;font-weight:400;font-size:14.5px;cursor:pointer;transition:background .13s,color .13s}
nav a .i{width:24px;text-align:center;color:#616161}
nav a.on{background:var(--pri-t);color:var(--pri);font-weight:500}
nav a.on .i{color:var(--pri)}
nav a:not(.on):hover{background:#f5f5f5}
main{flex:1;min-width:0;padding:22px 26px 30px;display:flex;flex-direction:column}
#main{flex:1}
.foot{text-align:center;color:#9e9e9e;font-size:13px;padding:28px 0 6px}
nav.bottom{display:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h2{margin:0;font-size:21px;font-weight:500;flex:1}
.q input{width:100%}
@media(max-width:760px){
 :root{--tb:56px}
 .tb-brand{width:auto;padding:0 12px 0 14px}
 .tb-brand b{font-size:16px}.tb-brand small{font-size:8px}
 .tb-search{padding:0 4px 0 0}
 .tb-btn{margin-right:6px}
 .tb-search input{padding:9px 12px}
 nav.side{display:none}main{padding:14px 12px 96px}
 #main>.top{flex-wrap:wrap}#main>.top h2{flex-basis:100%}
 nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;box-shadow:0 -2px 6px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom)}
 nav.bottom a{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:7px 1px;color:#757575;text-align:center}
 nav.bottom a .i{color:inherit;font-size:22px;width:auto}
 nav.bottom a.on{background:transparent;color:var(--pri)}
 nav.bottom a{position:relative} nav.bottom .nbadge{position:absolute;top:2px;left:50%;margin-left:6px}
}
/* lista no estilo Drive Parts (etiquetas) */
.dp-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#e8e8e8;margin:-22px -26px 18px;padding:10px 26px}
.dp-busca{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;color:#757575;margin:0}
.dp-busca input{border:0;background:transparent;padding:9px 0;font-size:15px}
.dp-busca input:focus{box-shadow:none}
.dp-ops{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dp-op{display:flex;align-items:center;gap:6px;color:#757575;font-size:13.5px;white-space:nowrap}
.dp-op select{width:auto;border:0;padding:4px 2px;color:#424242;font-size:13.5px;background:transparent}
.dp-op select:focus{box-shadow:none}
.dp-gerar{display:inline-flex;align-items:center;gap:6px;background:#4caf50;color:#fff;border:0;border-radius:2px;padding:9px 14px;font-weight:500;font-size:13px;letter-spacing:.02em;cursor:pointer;box-shadow:var(--sh)}
.dp-gerar:hover{filter:brightness(1.07)}
.dp-gerar .material-icons{font-size:17px}
.dp-gerar .n{background:rgba(255,255,255,.28);border-radius:9px;padding:0 7px;font-size:12px}
.dp-mini{max-width:960px;margin:0 auto 8px;font-size:13px;color:#9e9e9e;text-align:right}
.dp-mini a{color:var(--pri);cursor:pointer}
.dp-lista{background:#fff;box-shadow:var(--sh);border-radius:2px;margin:0 auto;max-width:960px}
.dp-row{display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid #eee;cursor:pointer}
.dp-row:last-child{border-bottom:0}
.dp-row:hover{background:#fafafa}
.dp-ft{width:84px;height:84px;flex-shrink:0;background:#eceff1;display:grid;place-items:center;color:#90a4ae;overflow:hidden;position:relative}
.dp-ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dp-ft .material-icons{font-size:36px}
.dp-tx{flex:1;min-width:0}
.dp-tt{color:#1e88e5;font-size:15px;line-height:1.3}
.dp-sb{color:#9e9e9e;font-size:13px;margin-top:4px;line-height:1.4}
.dp-ck{width:36px;height:36px;border-radius:50%;border:0;background:#9e9e9e;color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0}
.dp-ck .material-icons{font-size:20px}
.dp-row.on .dp-ck{background:#eeeeee;color:#757575}
.dp-chk{max-height:52vh;overflow:auto;padding:4px 0}
.dp-ci{display:flex;align-items:center;gap:14px;padding:6px 4px;color:#616161;font-size:14px;cursor:pointer}
.dp-ci input{width:18px;height:18px;margin:0;flex-shrink:0}
.dp-cfg{display:flex;gap:18px;flex-wrap:wrap;padding:12px 4px 4px;border-top:1px solid #eee;margin-top:8px;font-size:13px;color:#757575;align-items:center}
.dp-cfg input{width:62px;display:inline-block;text-align:center}
.dp-rod{display:flex;justify-content:center;gap:30px;border-top:1px solid #eee;margin-top:10px;padding:14px 0 2px}
.dp-tb{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:#424242;font-size:14px;letter-spacing:.03em;cursor:pointer;padding:6px}
.dp-tb .material-icons{font-size:17px}
.dp-azul{background:var(--pri)}
.dp-gerar:disabled{background:#bdbdbd;cursor:not-allowed;box-shadow:none}
.dp-st{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#9e9e9e}
.dp-st .material-icons{font-size:18px}
.dp-st.ok{color:var(--ok)}
.dp-cx{max-width:960px;margin:0 auto 14px}
.dp-pub{display:inline-block;margin-top:5px;font-size:12px;color:#9e9e9e}
.dp-pub.on{color:var(--ok);font-weight:500}
.dp-ac{flex-shrink:0}
.dp-act{display:inline-flex;align-items:center;gap:5px;color:var(--pri);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.02em;padding:8px 6px}
.dp-act .material-icons{font-size:17px}
.dp-act.mut{color:#9e9e9e}
@media(max-width:760px){
 .dp-bar{margin:-14px -12px 12px;padding:8px 12px}
 .dp-ops{gap:10px;width:100%}.dp-gerar{margin-left:auto}
 .dp-row{padding:12px;gap:12px}.dp-ft{width:58px;height:58px}
 .dp-tt{font-size:14px}.dp-sb{font-size:12px}
 .dp-row{flex-wrap:wrap}.dp-ac{width:100%;display:flex;justify-content:flex-end}
}
.lc-row{display:flex;align-items:center;gap:10px;padding:10px 14px 10px calc(12px + var(--d,0)*24px);border-bottom:1px solid #eee}
.lc-row:last-child{border-bottom:0}
.lc-row:hover{background:#fafafa}
.lc-tg{width:24px;color:#757575;cursor:pointer;flex-shrink:0;user-select:none}
.lc-ic{color:#90a4ae;flex-shrink:0}
.lc-tx{flex:1;min-width:0}
.lc-nm{font-weight:500;font-size:15px}
.lc-sig{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-t);border-radius:3px;padding:1px 6px;letter-spacing:.03em;vertical-align:1px}
.lc-sb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:#9e9e9e}
.lc-sb .ct{cursor:pointer}
.lc-rg{display:inline-flex;align-items:center;gap:3px;color:#7e57c2}
.lc-rg .material-icons{font-size:14px}
.lc-ac{display:flex;gap:2px;flex-shrink:0}
.lc-b{width:36px;height:36px;border:0;background:none;border-radius:50%;color:#757575;display:grid;place-items:center;cursor:pointer;padding:0}
.lc-b:hover{background:#eee;color:var(--ink)}
.lc-b .material-icons{font-size:20px}
@media(max-width:760px){.lc-row{padding-left:calc(6px + var(--d,0)*12px)}.lc-b{width:34px;height:34px}.lc-pn{font-size:13.5px}}
.mlsec{margin:14px 0 4px;padding-top:12px;border-top:1px solid #eee}
.mlcats{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.mlcat{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid #e0e0e0;border-radius:var(--rad);cursor:pointer;font-size:13.5px;line-height:1.35}
.mlcat.on{border-color:var(--pri);background:var(--pri-t)}
.mlcat input{width:auto;margin:3px 0 0;flex-shrink:0}
.mlbusca{display:flex;gap:8px;align-items:center}
.mlattrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 16px}
.mlmais{margin-top:8px}.mlmais summary{cursor:pointer;color:var(--pri);font-size:13px;padding:6px 0}
.lc-pc{cursor:pointer;background:#fcfcfc}
.lc-pc:hover{background:#f3f6ff}
.lc-ft{width:36px;height:36px;flex-shrink:0;border-radius:4px;overflow:hidden;background:#eceff1;color:#90a4ae;display:grid;place-items:center;position:relative}
.lc-ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lc-ft .material-icons{font-size:20px}
.lc-pn{font-size:14px;color:#1e88e5}
.lc-ir{color:#bdbdbd;flex-shrink:0}
.lc-sep{padding:10px 14px 6px;font-size:12px;font-weight:500;color:#9e9e9e;text-transform:uppercase;letter-spacing:.04em;background:#fafafa;border-bottom:1px solid #eee}
.lc-mnu{position:fixed;z-index:70;background:#fff;border-radius:4px;box-shadow:var(--sh2);padding:6px 0;min-width:250px;max-width:94vw}
.lc-mnu button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:10px 16px;font-size:14.5px;color:var(--ink);cursor:pointer;text-align:left}
.lc-mnu button:hover{background:#f5f5f5}
.lc-mnu button .material-icons{color:#757575;font-size:21px}
.lc-mnu button.red,.lc-mnu button.red .material-icons{color:var(--red)}
.lc-mnu button:disabled{opacity:.4;cursor:default}
.rel-tot{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.rel-tot div{flex:1;min-width:120px;background:var(--pri-t);border-radius:var(--rad);padding:8px 12px}
.rel-tot span{display:block;font-size:12px;color:var(--mut)}.rel-tot b{font-size:18px}
.chk2{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}
.chk2 label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
.chk2 input{width:auto}
.sec-t{margin-top:14px;padding-top:12px;border-top:1px solid #eee;font-weight:500}
.thumbs .star{position:absolute;left:4px;bottom:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:13px;cursor:pointer;line-height:1}
.thumbs .princ img{outline:3px solid var(--amber);outline-offset:-3px}
.thumbs .princ .star{background:var(--amber)}
.mlbox{margin-top:16px;padding:12px 14px;border:1px solid #e0e0e0;border-radius:var(--rad);background:#fafafa}
.mlact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.red{color:var(--red)}
.pr{margin-top:14px}.pr-t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.pr-b{height:6px;background:#eee;border-radius:3px;overflow:hidden}.pr-b i{display:block;height:100%}
.pr-c{margin-top:6px;max-width:260px}.pr-c .pr-t{font-size:11.5px;color:var(--mut)}
.pm{margin:10px 0;padding:12px;border:1px solid #e0e0e0;border-radius:var(--rad);background:#fafafa}
.pm-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pm-v{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.pm-b{border:1px solid #c5cae9;background:#fff;border-radius:var(--rad);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.pm-b small{color:var(--mut);font-size:11px}.pm-b b{font-size:15px;color:var(--ink)}.pm-b span{font-size:11px;color:var(--pri)}
.pm-b:nth-child(2){border-color:var(--pri);background:var(--pri-t)}
.pm-a{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee;color:inherit;text-decoration:none;font-size:13px}
.pm-a img{width:40px;height:40px;object-fit:cover;border-radius:3px}
.pc-ac{display:flex;border-top:1px solid #eee;margin-top:auto}
.pc-ac button{flex:1;border:0;background:none;padding:7px 0;cursor:pointer;color:var(--mut);display:grid;place-items:center}
.pc-ac button:hover:not(:disabled){color:var(--pri);background:var(--pri-t)}.pc-ac button:disabled{opacity:.3;cursor:default}
.pc-ac .material-icons{font-size:20px}
.fpanel{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 18px;background:#fff;padding:6px 16px 14px;border-radius:var(--rad);box-shadow:var(--sh);margin-bottom:12px}
.fpanel[hidden]{display:none}.fpanel .chk2{margin-top:18px}
#ford{width:auto}
.atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.atl{border:0;background:#fff;box-shadow:var(--sh);border-radius:var(--rad);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink)}
.atl .material-icons{color:var(--pri);font-size:26px}.atl:hover{background:var(--pri-t)}
@media(max-width:600px){.atalhos{grid-template-columns:repeat(4,1fr);gap:8px}.atl{font-size:11px;padding:10px 2px}.atl .material-icons{font-size:24px}}
.kp2 .kpi .v{font-size:21px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}.pgrid>.card{margin:0}
.exp-o{border:1px solid #e0e0e0;border-radius:var(--rad);padding:10px 12px;margin-top:10px;background:#fff;color:var(--ink);font-size:14px}
.exp-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.exp-h .tag{white-space:normal;max-width:100%}
.exp-i{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed #eee}
#mlcatv .mlcat{display:flex;align-items:center;gap:10px}
.form.emb4{grid-template-columns:repeat(4,1fr)}
@media(max-width:600px){.form.emb4{grid-template-columns:repeat(2,1fr)}}
.iabadge{position:absolute;right:4px;bottom:4px;background:#3f51b5;color:#fff;font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px}
.iaprev{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.iaprev figure{margin:0;border:1px solid #e0e0e0;border-radius:var(--rad);overflow:hidden;background:#fafafa}
.iaprev img{width:100%;display:block;aspect-ratio:1;object-fit:contain;background:#fff}.iaprev figcaption{padding:8px;font-size:13px}
.spin-s{display:inline-block;width:14px;height:14px;border:2px solid #c5cae9;border-top-color:var(--pri);border-radius:50%;animation:gira .8s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes gira{to{transform:rotate(360deg)}}
.iaph{aspect-ratio:1;display:grid;place-items:center;background:#fff;font-size:13px;color:var(--mut)}
/* componentes */
.btn{border:1px solid #d0d0d0;background:#fff;border-radius:var(--rad);padding:9px 16px;cursor:pointer;font-weight:500;color:var(--ink);text-decoration:none;display:inline-block;transition:filter .13s,box-shadow .13s,background .13s}
.btn:hover{background:#f5f5f5}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:var(--sh)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:var(--sh)}
.btn.p:hover,.btn.g:hover{filter:brightness(1.08)}
.nbadge{display:inline-block;background:var(--red);color:#fff;border-radius:9px;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;margin-left:6px;text-align:center;font-weight:600}
.perg{background:var(--card);box-shadow:var(--sh);border-radius:var(--rad);padding:12px;margin:0 auto 10px;max-width:760px}
.perg .q{font-size:16px;margin:8px 0;white-space:pre-wrap}
.perg textarea{width:100%;min-height:80px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:var(--rad);resize:vertical}
/* ficha da peça (abre pelo QR da etiqueta) */
.fcard{background:var(--card);box-shadow:var(--sh);border-radius:var(--rad);max-width:760px;width:100%;margin:0 auto}
.ftabs{display:flex;border-bottom:1px solid var(--line)}
.ftabs button{flex:1;padding:15px 8px;border:0;background:none;font:inherit;font-size:16px;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer}
.ftabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:500}
.frow{display:flex;gap:16px;align-items:flex-start;padding:15px 16px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.35}
.frow>.material-icons{font-size:28px;flex:none;width:30px;color:var(--ink)}
.frow b{font-weight:600}
.frow a{color:var(--pri);font-size:14px}
.fimgs{padding:12px}
.fimgs img{display:block;width:100%;background:#fff;margin:0 0 12px;border-radius:var(--rad);box-shadow:var(--sh)}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:16px}
.facts .btn{min-width:150px;justify-content:center}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55}
.card{background:#fff;border:0;border-radius:var(--rad);padding:14px;box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px;margin-bottom:18px}
.kpi .l{color:var(--mut);font-size:12.5px;font-weight:600}.kpi .v{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.kpi.clic{cursor:pointer;transition:box-shadow .15s,transform .15s}
.kpi.clic:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}
.pc{position:relative;background:#fff;border:0;border-radius:var(--rad);overflow:hidden;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.pc:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.pc.sel{outline:3px solid var(--pri);outline-offset:-2px}
.selck{position:absolute;left:7px;top:7px;z-index:3;width:24px;height:24px;border-radius:6px;background:#fff;border:2px solid var(--pri);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:14px}
.bulkbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1d1f23;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.28);flex-wrap:wrap;max-width:94vw}
.pc .ph{position:relative;height:150px;background:linear-gradient(135deg,#eef1f4,#e3e7ec);display:grid;place-items:center;color:#9aa1ab;font-size:30px;overflow:hidden}
.pc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .ph .loc{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(21,101,192,.94);color:#fff;font-size:10.5px;font-weight:700;border-radius:7px;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ph .loc.none{background:rgba(198,40,40,.94)}
.pc .b{padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.pc .n{font-weight:700;font-size:13.5px;line-height:1.25}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:5px;padding:2px 7px;background:#eef0f3;color:#333;white-space:nowrap}
.tag.price{background:#e7f6ee;color:var(--ok);font-weight:700}.tag.ml{background:#fff6d6;color:#8a6d00}.tag.olx{background:#efe3ff;color:#54279e}.tag.zero{background:#fdecea;color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #d7dbe0;border-radius:20px;padding:6px 12px;background:#fff;cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.sugbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh);background:#fff}
.sughd{background:#f7f8fa;padding:7px 11px;font-size:12px;color:var(--mut);font-weight:700}
.sugitem{padding:9px 11px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.sugitem:hover{background:var(--pri-t)}
.sugpr{color:var(--ok);font-weight:700}
.withmic{position:relative}
.withmic>input,.withmic>textarea{width:100%;padding-right:46px}
.mic{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#eef0f3;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
.withmic.ta .mic{top:8px;transform:none}
.mic.on{background:var(--pri-t);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.mut{color:var(--mut)}.small{font-size:13px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed #d7dbe0}
.tree>ul{padding-left:0;border:0}
.node{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:7px}.node:hover{background:#f4f5f7}
.node .tg{width:20px;text-align:center;cursor:pointer;color:var(--mut)}
.node .nm{font-weight:700}.node .ct{font-size:12px;color:var(--mut);cursor:pointer}
.node .act{margin-left:auto;display:flex;gap:4px}
.occ{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.occ .track{display:inline-block;height:7px;border-radius:4px;background:#eef0f3;overflow:hidden}
.occ .fill{display:block;height:100%;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:26px 12px;overflow:auto}
.modal .box{background:#fff;border-radius:var(--rad);box-shadow:var(--sh2);max-width:680px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:23px;cursor:pointer;color:var(--mut)}
.photos{display:flex;gap:8px;overflow-x:auto}.photos img{height:130px;border-radius:9px;object-fit:cover}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:21px;height:21px;background:var(--red);color:#fff;cursor:pointer;font-size:12px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lbl{border:1px dashed #9ca3af;border-radius:7px;background:#fff;padding:8px;display:flex;gap:8px;align-items:center}
.lbl svg{width:80px;height:80px;flex-shrink:0}.lbl .t{font-size:12px;line-height:1.25;overflow:hidden}.lbl .t b{font-size:14px;display:block}
.sel{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:9px;z-index:60;font-size:14px;max-width:90vw}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.bar2{height:8px;border-radius:4px;background:var(--pri2)}
.adbox{white-space:pre-wrap;background:#f7f8fa;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13.5px}
</style>
</head>
<body>
<div id="root"><div class="splash"><div class="spin"></div></div></div>
<div id="modal"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cod = n => '#'+String(n).padStart(6,'0');
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

async function api(path, opts={}){
  const o = { headers:{}, ...opts };
  if (o.body && !(o.body instanceof Blob) && typeof o.body!=='string'){ o.body=JSON.stringify(o.body); o.headers['content-type']='application/json'; }
  const r = await fetch('/api'+path, o);
  let d={}; try{ d=await r.json(); }catch{}
  if(!r.ok) throw new Error(d.erro || ('erro '+r.status));
  return d;
}

const S = { user:null, view:'painel', pecas:[], locais:{}, ui:{ q:'', loc:'', status:'todos', periodo:'mes', editId:null, fotos:[], etqTipo:'pecas', etqW:100, etqH:50, etqSel:new Set(), open:new Set(), selMode:false, sel:new Set() } };
// [view, ícone Material, nome no menu, nome curto (celular)]
const VIEWS = [['painel','home','Início','Início'],['etiquetas','label','Etiquetas','Etiquetas'],['download','file_download','Download Estoque','Download'],['nova','view_list','Cadastro de Peças','Cadastrar'],['estoque','search','Consulta de Peças','Consulta'],['locais','place','Localização','Locais'],['mover','swap_horiz','Movimentar','Mover'],['vendas','shopping_cart','Vendas','Vendas'],['perguntas','question_answer','Perguntas ML','Perguntas'],['integracoes','store','Anúncios ML','ML']];

// ---------- boot / auth ----------
let codigoDoLink=null; // /p/000123 ou /l/<id> vindo do QR lido pela câmera do celular
async function boot(){
  if(location.pathname==='/api/ml/callback'){ return mlFinaliza(); }
  const lk=location.pathname.match(/^\/(p|l)\/([^/]+)\/?$/i);
  if(lk){ codigoDoLink=lk[1].toUpperCase()+':'+decodeURIComponent(lk[2]); history.replaceState(null,'','/'); }
  try{ const { user } = await api('/me'); S.user=user; shell(); }
  catch{ login(false); }
}
async function mlFinaliza(){
  $('#root').innerHTML='<div class="center"><div class="authcard"><div class="brand"><span class="logo">🔧</span> Rafa Busca Peças</div><p class="mut">Finalizando conexão com o Mercado Livre…</p></div></div>';
  const p=new URLSearchParams(location.search);
  try{
    const err=p.get('error'); if(err) throw new Error('Mercado Livre recusou: '+err);
    await api('/ml/exchange',{method:'POST',body:{code:p.get('code'),state:p.get('state')}});
  }catch(e){ /* o motivo fica salvo e aparece na tela de Integrações */ }
  location.replace('/#integracoes');
}
function login(primeiro){
  $('#root').innerHTML = `<div class="center"><form class="authcard" id="f">
    <div class="brand"><span class="logo">🔧</span> Rafa Busca Peças</div>
    <h3>${primeiro?'Criar acesso do administrador':'Entrar'}</h3>
    ${codigoDoLink&&!primeiro?`<p class="small mut">Entre para ver ${codigoDoLink[0]==='P'?'a peça '+esc(codigoDoLink.slice(2)):'a localização'}.</p>`:''}
    ${primeiro?'<label class="f">Seu nome</label><input name="nome" placeholder="Ex.: Rafael">':''}
    <label class="f">Login</label><input name="login" autocomplete="username" required>
    <label class="f">Senha</label><input name="senha" type="password" autocomplete="${primeiro?'new-password':'current-password'}" required>
    <button class="btn p" style="width:100%;margin-top:16px" type="submit">${primeiro?'Criar acesso':'Entrar'}</button>
    <div class="msg" id="m"></div>
    <button class="linkb" type="button" id="alt">${primeiro?'Já tenho acesso — entrar':'Primeiro acesso? Criar administrador'}</button>
  </form></div>`;
  $('#alt').onclick=()=>login(!primeiro);
  $('#f').onsubmit=async e=>{
    e.preventDefault(); const b=Object.fromEntries(new FormData(e.target)); const btn=e.target.querySelector('button'); btn.disabled=true;
    try{ if(primeiro) await api('/setup',{method:'POST',body:b});
      const { user }=await api('/login',{method:'POST',body:{login:b.login,senha:b.senha}}); S.user=user; shell();
    }catch(err){ $('#m').className='msg err'; $('#m').textContent=err.message; btn.disabled=false; }
  };
}

// ---------- shell ----------
function shell(){
  $('#root').innerHTML = `<header class="topbar">
      <div class="tb-brand" id="tbhome"><b>RAFA</b><small>busca peças</small></div>
      <div class="tb-search"><input id="gbusca" type="search" placeholder="Busca..." autocomplete="off"></div>
      <button class="tb-btn" id="scanbtn" title="Escanear etiqueta (QR)"><span class="material-icons">qr_code_scanner</span></button>
    </header>
    <div class="app">
      <nav class="side"><div id="nav"></div>
        <a id="sair"><span class="i material-icons">cancel</span>Sair</a></nav>
      <main><div id="main"></div><footer class="foot">Copyright © ${new Date().getFullYear()} RAFA BUSCA PEÇAS</footer></main>
    </div>
    <nav class="bottom" id="navb"></nav>`;
  $('#sair').onclick=async()=>{ await api('/logout',{method:'POST'}); location.reload(); };
  $('#tbhome').onclick=()=>go('painel');
  $('#scanbtn').onclick=escanear;
  $('#gbusca').onkeydown=e=>{ if(e.key==='Enter'){ S.ui.q=e.target.value.trim(); S.ui.status='todos'; S.ui.loc=''; e.target.blur(); go('estoque'); } };
  renderNav(); go(location.hash.indexOf('integracoes')>=0 ? 'integracoes' : S.view);
  contaPerguntas(); clearInterval(window._pergT); window._pergT=setInterval(contaPerguntas,120000);
  if(codigoDoLink){ const c=codigoDoLink; codigoDoLink=null; tratarCodigo(c); }
}
function renderNav(){
  const link=curto=>([k,i,l,c])=>`<a data-v="${k}" class="${k===S.view?'on':''}"><span class="i material-icons">${i}</span>${curto?c:l}${k==='perguntas'&&S.nPerg?`<span class="nbadge">${S.nPerg>99?'99+':S.nPerg}</span>`:''}</a>`;
  $('#nav').innerHTML=VIEWS.map(link(false)).join('');
  $('#navb').innerHTML=VIEWS.filter(v=>v[0]!=='nova'&&v[0]!=='download').map(link(true)).join('');
  document.querySelectorAll('[data-v]').forEach(a=>a.onclick=()=>a.dataset.v==='download'?baixarEstoque():go(a.dataset.v));
}
async function go(v){ S.view=v; if(v!=='nova'){ S.ui.editId=null; S.ui.fotos=[]; } renderNav(); window.scrollTo(0,0);
  const f={painel,estoque,nova,locais,mover,etiquetas,vendas,integracoes,perguntas,ficha:fichaPeca}[v]; $('#main').innerHTML='<p class="mut">carregando…</p>'; try{ await f(); }catch(e){ $('#main').innerHTML='<div class="empty">Erro: '+esc(e.message)+'</div>'; } }

// ---------- dados ----------
async function carregaLocais(){ const { locais }=await api('/locais'); S.locais={}; locais.forEach(l=>S.locais[l.id]=l); }
function locPath(id){ const p=[]; let c=S.locais[id],g=0; while(c&&g++<20){ p.unshift(c.nome); c=S.locais[c.pai]; } return p.join(' › '); }
function locChildren(pai){ return Object.values(S.locais).filter(l=>(l.pai||'')===(pai||'')).sort((a,b)=>a.nome.localeCompare(b.nome,'pt',{numeric:true})); }
function locOptions(sel){ return Object.keys(S.locais).map(id=>[id,locPath(id)]).sort((a,b)=>a[1].localeCompare(b[1],'pt',{numeric:true}))
  .map(([id,p])=>`<option value="${id}" ${sel===id?'selected':''}>${esc(p)}</option>`).join(''); }

// ---------- Painel ----------
async function painel(){
  const p=await api('/painel');
  const canais=p.porCanal||[], maxC=Math.max(1,...canais.map(c=>c.total));
  const pags=p.porPagamento||[], maxP=Math.max(1,...pags.map(c=>c.total));
  const prod=(await api('/relatorios/produtividade?periodo=hoje').catch(()=>({}))).porFuncionario||[];
  const ant=p.mesAnterior||{}, var_=ant.mesmoPeriodo?Math.round((p.vendasMes.total-ant.mesmoPeriodo)/ant.mesmoPeriodo*100):null;
  const ml=p.anunciosML||{}, nML=Object.values(ml).reduce((a,b)=>a+b,0);
  const at=[['nova','add_box','Cadastrar peça'],['estoque','search','Consultar'],['etiquetas','label','Etiquetas'],['mover','swap_horiz','Movimentar'],['vendas','point_of_sale','Vendas'],['integracoes','store','Anúncios ML']];
  if(S.view!=='painel')return; // usuário já foi para outra tela
  $('#main').innerHTML=`<div class="top"><h2>Início</h2></div>
  <div class="atalhos">${at.map(([v,ic,t])=>`<button class="atl" data-go="${v}"><span class="material-icons">${ic}</span>${t}</button>`).join('')}<button class="atl" id="atscan"><span class="material-icons">qr_code_scanner</span>Ler etiqueta</button></div>
  ${S.nPerg?`<div class="card" style="background:#fff7e6;box-shadow:none;margin:0 0 12px;cursor:pointer" data-go="perguntas">❓ <b>${S.nPerg} pergunta(s) sem resposta</b> no Mercado Livre — toque para responder</div>`:''}
  <div class="kpis">
    <div class="card kpi"><div class="l">Vendas hoje</div><div class="v">${brl(p.vendasHoje?p.vendasHoje.total:0)}</div><div class="small mut">${p.vendasHoje?p.vendasHoje.n:0} venda(s)</div></div>
    <div class="card kpi"><div class="l">Vendas no mês</div><div class="v">${brl(p.vendasMes.total)}</div><div class="small mut">${p.vendasMes.n} vendas${var_!=null?` · <b style="color:${var_>=0?'var(--ok)':'var(--red)'}">${var_>=0?'▲':'▼'} ${Math.abs(var_)}%</b> vs mês passado`:''}</div></div>
    <div class="card kpi"><div class="l">Ticket médio</div><div class="v">${brl(p.vendasMes.ticket||0)}</div><div class="small mut">mês passado: ${brl(ant.n?ant.total/ant.n:0)}</div></div>
    <div class="card kpi"><div class="l">Mês passado (total)</div><div class="v">${brl(ant.total||0)}</div><div class="small mut">${ant.n||0} vendas</div></div>
    <div class="card kpi"><div class="l">Peças em estoque</div><div class="v">${p.estoque.pecas}</div><div class="small mut">${p.estoque.cadastros} cadastros</div></div>
    <div class="card kpi"><div class="l">Valor do estoque</div><div class="v">${brl(p.estoque.valor)}</div></div>
  </div>
  <div class="small mut" style="margin:-6px 0 8px;font-weight:600">PENDÊNCIAS — toque para ver</div>
  <div class="kpis kp2">
    <div class="card kpi clic" data-st="semanuncio"><div class="l">Sem anúncio</div><div class="v">${p.semAnuncio}</div></div>
    <div class="card kpi clic" data-st="semlocal"><div class="l">Sem localização</div><div class="v">${p.semLocal}</div></div>
    <div class="card kpi clic" data-fx="fotos:sem"><div class="l">Sem foto</div><div class="v">${p.semFoto??'—'}</div></div>
    <div class="card kpi clic" data-fx="etq:nao"><div class="l">Etiqueta não impressa</div><div class="v">${p.semEtiqueta??'—'}</div></div>
    <div class="card kpi clic" data-st="parado"><div class="l">Paradas +90 dias</div><div class="v">${p.parado}</div></div>
  </div>
  <div class="card" id="expd"><div class="top" style="margin:0"><b>📦 Expedição — pedidos do Mercado Livre para enviar</b><button class="btn sm" id="expr">Atualizar</button></div><div id="expl" class="small mut" style="margin-top:8px">Carregando pedidos…</div></div>
  <div class="pgrid">
   <div class="card"><b>Vendas do mês por canal</b>
    ${canais.length?canais.map(c=>`<div style="margin-top:10px"><div class="small" style="display:flex;justify-content:space-between"><span>${esc(c.canal)}</span><b>${brl(c.total)}</b></div><div class="bar2" style="width:${c.total/maxC*100}%"></div></div>`).join(''):'<p class="mut small">Nenhuma venda este mês.</p>'}</div>
   <div class="card"><b>Formas de pagamento (mês)</b>
    ${pags.length?pags.map(c=>`<div style="margin-top:10px"><div class="small" style="display:flex;justify-content:space-between"><span>${esc(c.pagamento)} <span class="mut">· ${c.n}</span></span><b>${brl(c.total)}</b></div><div class="bar2" style="width:${c.total/maxP*100}%;background:#7986cb"></div></div>`).join(''):'<p class="mut small">Nenhuma venda este mês.</p>'}</div>
   <div class="card"><b>Mais vendidas no mês</b>
    ${(p.maisVendidas||[]).length?p.maisVendidas.map((v,i)=>`<div class="sel small"><span style="width:18px" class="mut">${i+1}.</span><span style="flex:1">${esc(v.nome)} <span class="mut">${cod(v.codigo)}</span></span><span class="mut">${v.qtd} un</span>&nbsp;<b>${brl(v.total)}</b></div>`).join(''):'<p class="mut small">Nenhuma venda este mês.</p>'}</div>
   <div class="card"><b>Anúncios no Mercado Livre</b>
    ${nML?[['active','Ativos','var(--ok)'],['paused','Pausados','var(--amber)'],['paused_venda','Pausados (sem estoque)','var(--amber)'],['under_review','Em revisão','var(--mut)'],['closed','Finalizados','var(--red)']].filter(([k])=>ml[k]).map(([k,t,c])=>`<div class="sel small"><span style="flex:1"><span style="color:${c}">●</span> ${t}</span><b>${ml[k]}</b></div>`).join(''):'<p class="mut small">Nenhuma peça publicada ainda.</p>'}</div>
   <div class="card"><b>Cadastros de hoje por funcionário</b>
    ${prod.length?prod.map(f=>`<div class="sel small"><span style="flex:1">${esc(f.nome)}</span><b>${f.cadastros}</b></div>`).join(''):'<p class="mut small">Nenhum cadastro hoje ainda.</p>'}</div>
  </div>`;
  document.querySelectorAll('[data-st]').forEach(e=>e.onclick=()=>{ S.ui.status=e.dataset.st; S.ui.loc=''; S.ui.q=''; S.ui.f={}; go('estoque'); });

      ${o.itens.map((it,i)=>`<div class="exp-i"><div style="flex:1"><div>${it.qtd}× ${esc(it.titulo)}</div>

      ${e.sub==='invoice_pending'?`<div class="small" style="color:var(--amber);margin-top:6px">📄 <b>1º passo:</b> toque em <b>Emitir DC-e</b>. A etiqueta de envio aparece logo depois. Prazo: 3 dias da venda, senão o ML cancela o pedido.</div>`:''}
      <div class="mlact">${e.sub==='invoice_pending'?`<button class="btn sm p" data-dce="${esc(o.id)}">📄 Emitir DC-e</button>`:''}${e.id&&e.status==='ready_to_ship'&&e.sub!=='invoice_pending'?`<button class="btn sm p" data-lb="${esc(e.id)}" data-lbo="${esc(o.id)}"><span class="material-icons" style="font-size:16px;vertical-align:-3px">print</span> Etiqueta de envio</button>`:''}<button class="btn sm" data-dcev="${esc(o.id)}">📄 DC-e</button>
        ${o.itens.some(it=>it.peca)?`<button class="btn sm" data-ab="${esc(o.itens.find(it=>it.peca).peca.id)}">Abrir peça</button>`:''}</div></div>`; }).join('')}</div>`;
  el.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>etiquetaEnvio(b.dataset.lb,b.dataset.lbo));
  el.querySelectorAll('[data-dce]').forEach(b=>b.onclick=()=>emiteDce(b.dataset.dce,true));

  if($('#dceall'))$('#dceall').onclick=async()=>{ if(!confirm(`Emitir a declaração de conteúdo (DC-e) de ${semDce.length} pedidos? Ela usa os itens e valores de cada venda.`))return;
    let ok=0; for(const o of semDce){ try{ await api('/ml/dce/'+o.id,{method:'POST'}); ok++; }catch(e){ toast('Pedido '+o.id+': '+e.message); } }
    toast(ok+' DC-e emitida(s). A etiqueta é liberada em instantes.'); setTimeout(expedicao,6000); };

  if(perguntar&&!confirm('Emitir a declaração de conteúdo (DC-e) do pedido '+orderId+'? Ela usa os itens e valores da venda.'))return;

  catch(e){ modal(`<h3 style="margin:0 28px 8px 0">📄 DC-e do pedido ${esc(orderId)}</h3><p style="color:var(--red)">⚠️ ${esc(e.message)}</p>
    <p class="small mut">Se o erro falar de permissão, abra o seu aplicativo no site de desenvolvedores do Mercado Livre e libere as permissões de vendas, envios e faturamento; depois toque em Conexão e conecte de novo. Mande um print desta tela que eu ajusto.</p>
    <div class="top"><button class="btn" onclick="fecha()">Fechar</button></div>`); }
}
async function verDce(orderId){
  modal(`<h3 style="margin:0 28px 8px 0">📄 DC-e do pedido ${esc(orderId)}</h3><div id="dcex" class="small mut">Consultando no Mercado Livre…</div>`);
  let d; try{ d=await api('/ml/dce/'+orderId); }
  catch(e){ if($('#dcex'))$('#dcex').innerHTML=`<p>${/404|encontr/i.test(e.message)?'Ainda não tem DC-e emitida para este pedido.':'⚠️ '+esc(e.message)}</p><div class="top"><button class="btn p" id="dceem">📄 Emitir DC-e agora</button></div>`; if($('#dceem'))$('#dceem').onclick=()=>emiteDce(orderId,true); return; }
  if(!$('#dcex'))return;
  $('#dcex').innerHTML=`${d.status?`<p>Situação: <b>${esc(d.status)}</b></p>`:''}
    ${d.docs.length?d.docs.map(x=>`<div class="sel"><span style="flex:1">DC-e ${esc(x.numero||x.id)}${x.status?' · '+esc(x.status):''}${x.chave?`<br><span class="mut" style="font-size:11px">chave ${esc(x.chave)}</span>`:''}</span><button class="btn sm p" data-dpdf="${esc(x.id)}">Abrir PDF</button></div>`).join('')
      :'<p>Nenhum documento encontrado ainda. <button class="btn sm p" id="dceem">📄 Emitir DC-e</button></p>'}
    <details style="margin-top:8px"><summary>Resposta do Mercado Livre (para suporte)</summary><pre style="white-space:pre-wrap;font-size:11px;max-height:220px;overflow:auto">${esc(JSON.stringify(d.info,null,1)).slice(0,4000)}</pre></details>`;
  if($('#dceem'))$('#dceem').onclick=()=>emiteDce(orderId,true);
  document.querySelectorAll('[data-dpdf]').forEach(b=>b.onclick=()=>abrePdf('/api/ml/dce/'+orderId+'/doc/'+encodeURIComponent(b.dataset.dpdf),'dce-'+orderId+'.pdf'));

async function abrePdf(caminho,nome){
  const win=window.open('','_blank'); if(win){ try{ win.document.write('<title>'+nome+'</title><p style="font-family:sans-serif;padding:20px">Buscando no Mercado Livre…</p>'); }catch(_){} }
  try{ const r=await fetch(caminho); const ct=r.headers.get('content-type')||'';
    if(!r.ok||!ct.includes('pdf')){ const j=await r.json().catch(()=>({})); throw new Error(j.erro||('HTTP '+r.status)); }
    const u=URL.createObjectURL(await r.blob());
    if(win&&!win.closed) win.location.href=u; else { const a=document.createElement('a'); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ if(win&&!win.closed)win.close(); toast(e.message); }
}
async function etiquetaEnvio(id,pedido){
  const win=window.open('','_blank'); if(win){ try{ win.document.write('<title>Etiqueta de envio</title><p style="font-family:sans-serif;padding:20px">Buscando a etiqueta no Mercado Livre…</p>'); }catch(_){} }
  try{ const r=await fetch('/api/ml/etiqueta-envio/'+encodeURIComponent(id)); const ct=r.headers.get('content-type')||'';
    if(!r.ok||!ct.includes('pdf')){ const j=await r.json().catch(()=>({})); throw new Error(j.erro||('HTTP '+r.status)); }
    const url=URL.createObjectURL(await r.blob());
    if(win&&!win.closed) win.location.href=url; else { const a=document.createElement('a'); a.href=url; a.download='etiqueta-envio-'+id+'.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ if(win&&!win.closed)win.close();
    if(pedido&&/invoice_pending/i.test(e.message)){ if(confirm('O Mercado Livre só libera a etiqueta depois da declaração de conteúdo (DC-e). Emitir a DC-e deste pedido agora?'))emiteDce(pedido,false); }
    else toast(e.message); }
}

async function importarML(){
  await carregaLocais();
  const st={status:'active',offset:0,lim:50,itens:[],total:0,sel:new Map(),rodando:false};
  modal(`<h3>⬇️ Importar anúncios do Mercado Livre</h3>
   <p class="small mut">Cria as peças no sistema com <b>todas as fotos</b>, título, preço, estoque, condição, marca, modelo, part number, embalagem, categoria, descrição e a <b>ficha técnica completa</b> do anúncio. O anúncio fica ligado à peça: vender no sistema atualiza o estoque no ML. Nada muda no Mercado Livre.</p>
   <div class="filters">${[['active','Ativos'],['paused','Pausados'],['todos','Todos']].map(([k,l])=>`<button class="chip" data-ist="${k}">${l}</button>`).join('')}</div>
   <label class="f">Guardar as peças em (opcional)<select id="imloc"><option value="">— sem localização —</option>${locOptions('')}</select></label>
   <div class="small" style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="impag" style="width:18px;height:18px;flex:none;margin:0"> Marcar todos desta página</label><button class="btn sm" id="imtodos">Marcar todos os anúncios</button><span class="mut" id="imcont"></span></div>
   <div id="imlista"><p class="small mut">Carregando os seus anúncios…</p></div>
   <div id="improg" class="small" style="margin-top:8px"></div>
   <div class="top" style="margin-top:12px"><button class="btn p" id="imok" disabled>Importar</button><button class="btn" id="imcc">Fechar</button></div>`);
  const conta=()=>{ const n=st.sel.size; if($('#imok')){ $('#imok').disabled=!n||st.rodando; $('#imok').textContent=n?`Importar ${n} anúncio(s)`:'Importar'; } if($('#imcont'))$('#imcont').textContent=n?n+' marcado(s)':''; };
  const pinta=()=>{ const el=$('#imlista'); if(!el)return;
    document.querySelectorAll('[data-ist]').forEach(b=>b.classList.toggle('on',b.dataset.ist===st.status));
    el.innerHTML=st.itens.length?st.itens.map(x=>`<label class="sel small" style="align-items:center;gap:8px;${x.peca?'opacity:.6':''}">
        <input type="checkbox" data-imid="${esc(x.id)}" ${x.peca?'disabled':st.sel.has(x.id)?'checked':''} style="width:20px;height:20px;flex:none;margin:0">
        ${x.foto?`<img src="${esc(x.foto)}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:4px;flex:none">`:''}
        <span style="flex:1"><b>${esc(x.titulo)}</b><br><span class="mut">${brl(x.preco)} · ${x.qtd} em estoque · ${x.vendidos||0} vendido(s) · ${x.nfotos} foto(s) · ${esc(stML(x.status))} · ${esc(x.id)}</span>
        ${x.peca?`<br><span style="color:var(--ok)">✔ já está no sistema (${cod(x.peca.codigo)})</span>`:''}</span></label>`).join('')
      +`<div class="top small" style="margin-top:8px"><span class="mut">Mostrando ${st.offset+1}–${st.offset+st.itens.length} de ${st.total}</span>
        ${st.offset>0?'<button class="btn sm" id="imant">‹ Anteriores</button>':''}${st.offset+st.lim<st.total?'<button class="btn sm" id="improx">Próximos ›</button>':''}</div>`
      :'<p class="small mut">Nenhum anúncio encontrado com esse filtro.</p>';
    el.querySelectorAll('[data-imid]').forEach(c=>c.onchange=()=>{ const x=st.itens.find(i=>i.id===c.dataset.imid); if(c.checked)st.sel.set(x.id,x.titulo); else st.sel.delete(x.id); conta(); });
    if($('#imant'))$('#imant').onclick=()=>carrega(st.offset-st.lim); if($('#improx'))$('#improx').onclick=()=>carrega(st.offset+st.lim);
    if($('#impag'))$('#impag').checked=st.itens.filter(x=>!x.peca).length>0&&st.itens.filter(x=>!x.peca).every(x=>st.sel.has(x.id));
    conta(); };

  const carrega=async off=>{ if($('#imlista'))$('#imlista').innerHTML='<p class="small mut">Carregando…</p>';
    try{ const r=await busca(Math.max(0,off)); Object.assign(st,{offset:r.offset,total:r.total,itens:r.itens}); pinta(); }
    catch(e){ if($('#imlista'))$('#imlista').innerHTML='<p class="small" style="color:var(--red)">⚠️ '+esc(e.message)+'</p>'; } };
  document.querySelectorAll('[data-ist]').forEach(b=>b.onclick=()=>{ st.status=b.dataset.ist; carrega(0); });
  $('#impag').onchange=e=>{ st.itens.filter(x=>!x.peca).forEach(x=>e.target.checked?st.sel.set(x.id,x.titulo):st.sel.delete(x.id)); pinta(); };
  $('#imtodos').onclick=async()=>{ const b=$('#imtodos'); b.disabled=true;
    try{ for(let off=0;off<Math.min(st.total,1000);off+=50){ b.textContent=`Lendo ${Math.min(off+50,st.total)} de ${st.total}…`; const r=await busca(off,50); r.itens.filter(x=>!x.peca).forEach(x=>st.sel.set(x.id,x.titulo)); }
      if(st.total>1000)toast('O ML só deixa listar 1.000 anúncios por filtro: importe e depois use o filtro Pausados/Ativos para o resto');
    }catch(e){ toast(e.message); } if($('#imtodos')){ b.disabled=false; b.textContent='Marcar todos os anúncios'; } pinta(); };
  $('#imcc').onclick=fecha;
  $('#imok').onclick=async()=>{ if(!st.sel.size)return; st.rodando=true; conta();
    const fila=[...st.sel.entries()], loc=$('#imloc').value, res={ok:0,ja:0,fotos:0,falhas:0,erros:[]};
    for(let i=0;i<fila.length;i++){ const [id,tit]=fila[i];
      if($('#improg'))$('#improg').innerHTML=`<span class="spin-s"></span><b>Importando ${i+1} de ${fila.length}:</b> ${esc(tit||id)} (não feche esta tela)`;
      try{ const r=await api('/ml/importar/'+id,{method:'POST',body:{local_id:loc||undefined}}); if(r.ja)res.ja++; else { res.ok++; res.fotos+=r.fotos||0; res.falhas+=r.falhas||0; } st.sel.delete(id); }
      catch(e){ res.erros.push(id+': '+e.message); } }
    st.rodando=false;
    const msg=`✅ ${res.ok} peça(s) importada(s) com ${res.fotos} foto(s)`+(res.ja?` · ${res.ja} já estavam no sistema`:'')+(res.falhas?` · ${res.falhas} foto(s) não baixaram do ML`:'')+(res.erros.length?` · ⚠️ ${res.erros.length} com erro`:'');
    toast(msg); if($('#improg'))$('#improg').innerHTML=esc(msg)+(res.erros.length?'<br><span style="color:var(--red)">'+res.erros.map(esc).join('<br>')+'</span>':'');
    try{ const {pecas}=await api('/pecas?todas=1'); S.pecas=pecas; }catch(_){ }
    if($('#imlista'))carrega(st.offset);
    if(S.view==='integracoes'&&!$('#imlista'))integracoes(); };
  carrega(0);
}

// quão pronta a peça está pra virar anúncio
function prontidao(p){
  const nf=(p.fotos||[]).length;
  const itens=[['foto',nf>0,1],['3 fotos ou mais',nf>=3],['preço',Number(p.preco)>0,1],['estoque',Number(p.qtd)>0,1],['marca e modelo',!!(p.marca&&p.modelo)],
    ['ano',!!p.ano],['part number',!!p.pn],['condição',!!p.cond],['embalagem (peso e medidas)',!!(p.peso_g&&p.alt_cm&&p.larg_cm&&p.comp_cm)],['localização',!!p.local_id]];
  const ok=itens.filter(i=>i[1]).length;
  return { pct:Math.round(ok*100/itens.length), falta:itens.filter(i=>!i[1]).map(i=>i[0]), bloqueia:itens.filter(i=>i[2]&&!i[1]).map(i=>i[0]) };
}
function barraPront(p,compacta){
  const r=prontidao(p), cor=r.pct>=80?'var(--ok)':r.pct>=50?'var(--amber)':'var(--red)';
  return `<div class="pr${compacta?' pr-c':''}" title="${r.falta.length?'Falta: '+esc(r.falta.join(', ')):'Tudo pronto'}"><div class="pr-t"><span>Pronta pra publicar</span><b style="color:${cor}">${r.pct}%</b></div><div class="pr-b"><i style="width:${r.pct}%;background:${cor}"></i></div>`
    +(compacta?'':r.falta.length?`<div class="small mut" style="margin-top:4px">Falta: ${esc(r.falta.join(', '))}</div>`:'<div class="small" style="margin-top:4px;color:var(--ok)">Tudo pronto ✓</div>')+'</div>';
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function iniciaDitado(btn){
  if(!SR){ toast('Ditado por voz não disponível aqui. Use o Google Chrome.'); return; }
  const campo=btn.closest('.withmic').querySelector('input,textarea'); if(!campo||btn.classList.contains('on'))return;
  const rec=new SR(); rec.lang='pt-BR'; rec.interimResults=false; rec.maxAlternatives=1;
  btn.classList.add('on'); btn.textContent='🔴';
  rec.onresult=e=>{ let t=(e.results[0][0].transcript||'').trim(); if(!t)return;
    if(!campo.value.trim()) t=t.charAt(0).toUpperCase()+t.slice(1);
    campo.value=campo.value.trim()?(campo.value.trim()+' '+t):t;
    campo.dispatchEvent(new Event('input',{bubbles:true})); campo.focus(); };
  rec.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed')toast('Permita o microfone no navegador.'); else if(ev.error!=='no-speech'&&ev.error!=='aborted')toast('Não consegui ouvir. Tente de novo.'); };

// máscara 320x320 (U²-Net): quanto cada ponto é "peça" (0..255 no alfa)
async function mascaraPeca(img){

  if(pt){ const zx=pt.x, zy=pt.y+130;
    x.strokeStyle=cor; x.lineWidth=5; x.setLineDash([14,10]); x.beginPath(); x.moveTo(T/2,op.semFoto?150:cy0+ch); x.lineTo(zx,zy); x.stroke(); x.setLineDash([]);
    const g=x.createRadialGradient(zx,zy,8,zx,zy,90); g.addColorStop(0,hexA(cor,.55)); g.addColorStop(1,hexA(cor,0)); x.fillStyle=g; x.beginPath(); x.arc(zx,zy,90,0,Math.PI*2); x.fill();
    x.strokeStyle=cor; x.lineWidth=7; x.beginPath(); x.arc(zx,zy,40,0,Math.PI*2); x.stroke(); x.fillStyle=cor; x.beginPath(); x.arc(zx,zy,11,0,Math.PI*2); x.fill(); }
  x.fillStyle='#212121'; let y=textoCabe(x,op.legenda||(z?z.n:(pt?'Local da peça':'Toque no carro para marcar o local')),T/2,1000,1120,50,'bold',F);
  const lado=op.lado!==undefined?op.lado:ladoDe(p.nome||''); if(lado){ x.fillStyle='#546e7a'; y=textoCabe(x,lado.charAt(0).toUpperCase()+lado.slice(1),T/2,y+58,1120,38,'',F); }
  const veic=[p.marca,p.modelo,p.ano].filter(Boolean).join(' '); if(veic&&!op.semVeiculo){ x.fillStyle='#37474f'; textoCabe(x,veic.toUpperCase(),T/2,y+62,1120,40,'bold',F); }
  if(!op.semAviso){ x.fillStyle='#9e9e9e'; x.font='24px '+F; x.fillText('Ilustração: a posição exata pode variar conforme o modelo',T/2,1172); }
  return new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
}

const ICON_NIVEL=['warehouse','view_week','layers'];
// sigla curta de cada nível (ex.: GALPÃO-1 → 01, PRT-17E → 17E, NÍVEL-A → A, CAIXA-1 → CX1)
function siglaDe(id){ const l=S.locais[id]; if(!l)return ''; if(l.sigla)return String(l.sigla).toUpperCase();

const LOJA='Rafa Busca Peças', SITE='rafabuscapecas';
const nrm=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const dataBR=ms=>ms?new Date(Number(ms)).toLocaleDateString('pt-BR'):'—';
function itemPeca(p){
  const veic=([(p.marca||'').toUpperCase(),p.modelo].filter(Boolean).join(' ')+(p.ano?' - '+p.ano:'')).trim();
  const c=String(p.codigo).padStart(6,'0'), linhas=[];
  if(p.pn)linhas.push('PN:'+p.pn); else if(p.veiculo)linhas.push('Sucata:'+p.veiculo);
  linhas.push('Cod:'+c);
  const local=p.local_id&&S.locais[p.local_id]?codigoTxt(p.local_id):'';
  return { tipo:'peca', id:p.id, rotulo:cod(p.codigo)+' · '+p.nome, qr:linkQR('p',c), loja:LOJA, titulo:veic||p.nome, linhas, local, rodape:veic?p.nome:'' };
}
function itemLocal(id){ const [cima,baixo]=codigoLocal(id); return { tipo:'local', rotulo:codigoTxt(id)+' — '+locPath(id), qr:linkQR('l',id), acima:cima, grande:baixo }; }
// o QR leva um link: lido pela câmera do celular, abre a peça (ou a caixa) direto no sistema
const linkQR=(t,v)=>location.origin+'/'+t+'/'+encodeURIComponent(v);
// entende o que veio do leitor/câmera: link novo (…/p/000123), etiqueta antiga (P:000123) ou só o número
// (aceita também ; e Ç no lugar de / e :, que é o que o leitor USB digita com o teclado ABNT2)
function lePeca(v){ v=String(v||'').trim(); let m=v.match(/^0*(\d{1,9})$/)||v.match(/(?:^|[^a-z])p[^a-z0-9]{0,2}0*(\d{1,9})[^a-z0-9]{0,2}$/i); return m?parseInt(m[1],10):null; }
function leLocal(v){ v=String(v||'').trim(); const m=v.match(/(?:^|[^a-z])l[^a-z0-9]{1,2}([\w-]+)[^\w-]{0,2}$/i); return m?decodeURIComponent(m[1]):null; }

  const ehP=ui.etqTipo==='pecas';
  if(S.view!=='etiquetas')return; // usuário já foi para outra tela
  $('#main').innerHTML=`<div class="dp-bar">
     <label class="dp-busca"><span class="material-icons">search</span><input id="eq" placeholder="${ehP?'Procurar por peça...':'Procurar por localização...'}" value="${esc(ui.etqQ)}" autocomplete="off"></label>
     <div class="dp-ops">
       <span class="dp-op">Tipo: <select id="etipo"><option value="pecas" ${ehP?'selected':''}>Peças</option><option value="locais" ${ehP?'':'selected'}>Localizações</option></select></span>

     </div></div>

   <div class="dp-lista" id="elista"></div>`;
  if(ehP){ $('#eord').value=ui.etqOrd; $('#emos').value=ui.etqMos; }
  let vis=[];
  const linha=(id,foto,tit,sub)=>{ const on=ui.etqSel.has(id); return `<div class="dp-row${on?' on':''}" data-id="${id}"><div class="dp-ft">${foto}</div><div class="dp-tx"><div class="dp-tt">${esc(tit)}</div><div class="dp-sb">${esc(sub)}</div></div><button class="dp-ck" title="Selecionar"><span class="material-icons">${on?'check':'crop_square'}</span></button></div>`; };
  const conta=()=>{ const n=ui.etqSel.size; $('#en').textContent=n?n:''; $('#en').style.display=n?'':'none'; };
  const desenha=()=>{
    const q=nrm(ui.etqQ).split(/\s+/).filter(Boolean);
    let html='';
    if(ehP){
      let l=S.pecas.filter(p=>ui.etqMos==='todos'||(ui.etqMos==='semetq'?(Number(p.qtd)||0)>0&&!p.etq_em:ui.etqMos==='ativos'?(Number(p.qtd)||0)>0:(Number(p.qtd)||0)<=0));
      if(q.length)l=l.filter(p=>{ const t=nrm([p.nome,p.marca,p.modelo,p.ano,p.pn,p.veiculo,cod(p.codigo)].join(' ')); return q.every(w=>t.includes(w)); });
      l.sort(ui.etqOrd==='recentes'?(a,b)=>(b.criado_em||0)-(a.criado_em||0):ui.etqOrd==='codigo'?(a,b)=>a.codigo-b.codigo:(a,b)=>String(a.nome).localeCompare(String(b.nome),'pt',{numeric:true}));
      vis=l.map(p=>p.id);
      html=l.map(p=>{ const v=([(p.marca||'').toUpperCase(),p.modelo].filter(Boolean).join(' ')+(p.ano?' - '+p.ano:'')).trim();
        const sub=[v,'Data de cadastro: '+dataBR(p.criado_em),'Cod: '+String(p.codigo).padStart(6,'0'),p.pn?'PN: '+p.pn:'',p.etq_em?'Etiqueta impressa: '+dataBR(p.etq_em):'Etiqueta não impressa'].filter(Boolean).join(' | ');
        return linha(p.id,p.fotos&&p.fotos[0]?`<img src="/api/foto/${p.fotos[0]}" loading="lazy" alt="">`:'<span class="material-icons">build</span>',p.nome,sub); }).join('');
    } else {
      let l=Object.keys(S.locais).map(id=>[id,locPath(id)]);
      if(q.length)l=l.filter(([,c])=>q.every(w=>nrm(c).includes(w)));
      l.sort((a,b)=>a[1].localeCompare(b[1],'pt',{numeric:true}));
      vis=l.map(x=>x[0]);
      html=l.map(([id,c])=>{ const n=ocupacaoTotal(id); return linha(id,'<span class="material-icons">inventory_2</span>',S.locais[id].nome,c+' | '+n+' peça(s)'); }).join('');
    }
    $('#elista').innerHTML=html||`<div class="empty">${ehP?'Nenhuma peça encontrada.':'Nenhuma localização cadastrada.'}</div>`;
    document.querySelectorAll('.dp-row').forEach(r=>r.onclick=()=>{ const id=r.dataset.id, on=!ui.etqSel.has(id); on?ui.etqSel.add(id):ui.etqSel.delete(id);
      r.classList.toggle('on',on); r.querySelector('.dp-ck .material-icons').textContent=on?'check':'crop_square'; conta(); });
    conta();
  };
  $('#eq').oninput=e=>{ ui.etqQ=e.target.value; desenha(); };
  $('#etipo').onchange=e=>{ ui.etqTipo=e.target.value; ui.etqSel=new Set(); ui.etqQ=''; etiquetas(); };
  if(ehP){ $('#eord').onchange=e=>{ ui.etqOrd=e.target.value; desenha(); }; $('#emos').onchange=e=>{ ui.etqMos=e.target.value; desenha(); }; }
  $('#etodos').onclick=()=>{ vis.forEach(id=>ui.etqSel.add(id)); desenha(); };
  $('#elimpa').onclick=()=>{ ui.etqSel=new Set(); desenha(); };
  $('#egerar').onclick=()=>{ const its=ehP?[...ui.etqSel].map(id=>S.pecas.find(p=>p.id===id)).filter(Boolean).map(itemPeca):[...ui.etqSel].filter(id=>S.locais[id]).map(itemLocal); abreGerador(its); };
  desenha();
}
// janela "Gerar etiquetas": confere a lista, cópias e tamanho → IMPRIMIR abre o PDF
function abreGerador(itens){
  if(!itens.length)return toast('Selecione ao menos um item na lista');
  const W=parseFloat(S.ui.etqW)||100, H=parseFloat(S.ui.etqH)||50;
  modal(`<div class="dp-chk">${itens.map((it,i)=>`<label class="dp-ci"><input type="checkbox" data-i="${i}" checked> ${esc(it.rotulo)}</label>`).join('')}</div>
   <div class="dp-cfg"><label>Cópias de cada <input id="gcop" type="number" min="1" max="50" value="1"></label>
     <label>Tamanho da etiqueta (mm) <input id="gw" type="number" min="20" value="${W}"> × <input id="gh" type="number" min="15" value="${H}"></label></div>
   <div class="dp-rod"><button class="dp-tb" id="gimp"><span class="material-icons">add_circle_outline</span>IMPRIMIR</button><button class="dp-tb" id="gfec"><span class="material-icons">highlight_off</span>FECHAR</button></div>`);
  $('#gfec').onclick=fecha;
  $('#gimp').onclick=async()=>{
    const sel=[...document.querySelectorAll('.dp-ci input')].filter(c=>c.checked).map(c=>itens[+c.dataset.i]);
    if(!sel.length)return toast('Marque ao menos uma etiqueta');
    S.ui.etqW=$('#gw').value; S.ui.etqH=$('#gh').value;
    const cop=Math.min(50,Math.max(1,parseInt($('#gcop').value,10)||1));
    const win=window.open('','_blank'); if(win){ try{ win.document.write('<title>Gerador de Etiquetas</title><p style="font-family:sans-serif;padding:20px">Gerando etiquetas…</p>'); }catch(_){} }
    try{ const url=await gerarPDF(sel,cop);
      if(win&&!win.closed) win.location.href=url; else { const a=document.createElement('a'); a.href=url; a.download='etiquetas.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
      fecha(); }
    catch(e){ if(win)win.close(); toast('Erro: '+e.message); }
  };
}
let pdfPromessa=null;
function carregaPDF(){ if(window.jspdf)return Promise.resolve();
  if(!pdfPromessa)pdfPromessa=new Promise((ok,err)=>{ const sc=document.createElement('script'); sc.src='/jspdf.umd.min.js'; sc.onload=ok; sc.onerror=()=>{ pdfPromessa=null; err(new Error('não carregou o gerador de PDF')); }; document.head.appendChild(sc); });
  return pdfPromessa; }
const PT=0.3528; // 1 ponto em mm
const pdfTxt=x=>String(x??'').replace(/›/g,'>').replace(/[–—]/g,'-').replace(/[^\x20-\x7E -ÿ]/g,'').trim();
async function gerarPDF(itens,copias){
  await carregaPDF();
  const W=Math.max(20,parseFloat(S.ui.etqW)||100), H=Math.max(15,parseFloat(S.ui.etqH)||50), ori=W>=H?'landscape':'portrait';
  const doc=new window.jspdf.jsPDF({orientation:ori,unit:'mm',format:[W,H]});
  doc.setProperties({title:'Gerador de Etiquetas',creator:LOJA});
  let n=0;
  for(const it of itens)for(let c=0;c<(copias||1);c++){ if(n++)doc.addPage([W,H],ori); it.tipo==='local'?desenhaLocal(doc,it,W,H):desenhaPeca(doc,it,W,H); }
  const ids=[...new Set(itens.filter(i=>i.tipo==='peca'&&i.id).map(i=>i.id))];
  if(ids.length)api('/pecas/etiquetas',{method:'POST',body:{ids}}).then(r=>ids.forEach(id=>{ const p=(S.pecas||[]).find(x=>x.id===id); if(p)p.etq_em=r.em; })).catch(()=>{});
  return doc.output('bloburl');
}
function qrPDF(doc,txt,x,y,t){ const q=qrcode(0,'M'); q.addData(txt); q.make(); const n=q.getModuleCount(), m=t/n; doc.setFillColor(0,0,0);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))doc.rect(x+c*m,y+r*m,m+0.02,m+0.02,'F'); }
// escreve um bloco de linhas centralizado na altura, reduzindo a fonte até caber
function blocoTexto(doc,partes,x,w,H,pad){
  // 1º: cada linha longa encolhe sozinha (até 60%) pra caber no nº de linhas dela
  for(const pt of partes){ pt.k=1; const t=pdfTxt(pt.t); if(!t)continue; doc.setFont('helvetica',pt.bold?'bold':'normal');
    while(pt.k>0.6){ doc.setFontSize(pt.size*pt.k); if(doc.splitTextToSize(t,w).length<=(pt.max||2))break; pt.k-=0.04; } }
  // 2º: se o bloco não couber na altura, reduz tudo junto
  for(let k=1;;k-=0.05){
    const lin=[]; let alt=0, estourou=false, ultimo=k<=0.42;
    for(const pt of partes){ const t=pdfTxt(pt.t); if(!t)continue; const fs=pt.size*pt.k*k;
      doc.setFont('helvetica',pt.bold?'bold':'normal'); doc.setFontSize(fs);
      let ls=doc.splitTextToSize(t,w); const mx=pt.max||2;
      if(ls.length>mx){ estourou=true; if(ultimo){ ls=ls.slice(0,mx); ls[mx-1]=ls[mx-1].replace(/\s*\S{0,3}$/,'')+'...'; } }
      for(const l of ls){ lin.push({l,fs,b:pt.bold,c:pt.centro}); alt+=fs*PT*1.2; } }
    if((alt<=H-2*pad&&!estourou)||ultimo){ let y=Math.max(pad,(H-alt)/2);
      for(const L of lin){ doc.setFont('helvetica',L.b?'bold':'normal'); doc.setFontSize(L.fs); if(L.c)doc.text(L.l,x+w/2,y+L.fs*PT*0.92,{align:'center'}); else doc.text(L.l,x,y+L.fs*PT*0.92); y+=L.fs*PT*1.2; }
      return; }
  }
}
// etiqueta de peça: loja, veículo em negrito, PN/sucata, código, peça · QR à direita · site na vertical
function desenhaPeca(doc,it,W,H){
  const pad=Math.min(W,H)*0.06, vt=H*0.09, q=Math.min(H-2*pad,W*0.33), folga=q*0.1; // folga branca entre o QR e o texto (o leitor precisa)
  const qx=W-pad-vt-folga-q; qrPDF(doc,it.qr,qx,(H-q)/2,q);
  doc.setFont('helvetica','bold'); doc.setFontSize(10); const w10=doc.getTextWidth(SITE);
  const fsv=Math.min(10*(H-2*pad)*0.78/w10, vt/(0.72*PT)); doc.setFontSize(fsv); const sw=doc.getTextWidth(SITE);
  doc.text(SITE, W-pad-vt+(vt-fsv*PT*0.72)/2, (H-sw)/2, {angle:-90});
  const k=H/50;
  blocoTexto(doc,[{t:it.loja,size:10*k,max:1},{t:it.titulo,size:14*k,bold:true,max:2},...it.linhas.map(l=>({t:l,size:10*k,max:1})),{t:it.local?'Local: '+it.local:'',size:11*k,bold:true,max:1},{t:it.rodape,size:11*k,max:2}],pad,qx-folga-pad,H,pad);
}
// etiqueta de caixa/prateleira: QR à esquerda, caminho e nome grande
function desenhaLocal(doc,it,W,H){
  const pad=Math.min(W,H)*0.06, q=Math.min(H-2*pad,W*0.42);
  qrPDF(doc,it.qr,pad,(H-q)/2,q);
  const x=pad+q+pad*1.5, k=H/50;
  blocoTexto(doc,[{t:it.acima,size:26*k,bold:true,max:1,centro:true},{t:it.grande,size:30*k,bold:true,max:1,centro:true}],x,W-x-pad,H,pad);
}

async function contaPerguntas(){ try{ const r=await api('/ml/perguntas/contagem'); const n=r.n||0; S.nPergMais=!!r.mais; if(n!==S.nPerg){ S.nPerg=n; renderNav(); } }catch(_){ } }
const ASSIN_PADRAO='Att, Rafa Busca Peças';
const assinatura=()=>{ try{ const v=localStorage.getItem('rafa_assin'); return v==null?ASSIN_PADRAO:v; }catch(_){ return ASSIN_PADRAO; } };
async function perguntas(){
  const ui=S.ui; ui.pergSt=ui.pergSt||'sem'; ui.pergOff=ui.pergOff||0; ui.pergPilha=ui.pergPilha||[];
  let d; try{ d=await api(`/ml/perguntas?status=${{sem:'',resp:'respondidas',todas:'todas'}[ui.pergSt]}&offset=${ui.pergOff}`); }
  catch(e){ if(S.view!=='perguntas')return; $('#main').innerHTML=`<div class="top"><h2>Perguntas do Mercado Livre</h2></div><div class="card small" style="color:var(--red)">⚠️ ${esc(e.message)}</div>`; return; }
  if(S.view!=='perguntas')return; // usuário já foi para outra tela
  if(ui.pergSt==='sem'&&!ui.pergOff&&d.proximo==null&&d.perguntas.length!==S.nPerg){ S.nPerg=d.perguntas.length; renderNav(); }
  const oc=Object.entries(d.ocultas||{}), nOc=oc.reduce((a,[,n])=>a+n,0);
  const quando=t=>{ const ms=Date.now()-new Date(t).getTime(), m=Math.round(ms/6e4); return m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:new Date(t).toLocaleDateString('pt-BR'); };
  $('#main').innerHTML=`<div class="top"><h2>Perguntas do Mercado Livre</h2><button class="btn sm" id="pgatu">↻ Atualizar</button></div>
   <div class="filters">${[['sem','Sem resposta'+(S.nPerg?' ('+S.nPerg+(S.nPergMais?'+':'')+')':'')],['resp','Respondidas'],['todas','Todas']].map(([k,l])=>`<button class="chip ${ui.pergSt===k?'on':''}" data-pg="${k}">${l}</button>`).join('')}</div>
   ${nOc?`<div class="small mut" style="max-width:760px;margin:0 auto 8px">Escondi ${nOc} pergunta(s) que o Mercado Livre não mostra como pendente: ${oc.map(([m,n])=>esc(m)+' ('+n+')').join(', ')}.</div>`:''}
   <label class="small" style="display:flex;gap:6px;align-items:center;margin:0 auto 10px;max-width:760px">Assinatura no fim da resposta:<input id="pgass" value="${esc(assinatura())}" placeholder="(sem assinatura)" style="flex:1"></label>
   ${d.perguntas.length?d.perguntas.map(q=>{ const it=q.item||{}, pc=q.peca;
     return `<div class="perg" data-q="${q.id}"><div style="display:flex;gap:10px;align-items:flex-start">${it.foto?`<img src="${esc(it.foto)}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:4px;flex:none">`:''}
       <div class="small" style="flex:1"><a href="${esc(it.link||'#')}" target="_blank" rel="noopener"><b>${esc(it.titulo||it.id||'')}</b></a><br>
       <span class="mut">${it.preco!=null?brl(it.preco)+' · ':''}${pc?`${cod(pc.codigo)} · ${pc.qtd} em estoque${pc.local?' · 📍 '+esc(pc.local):''}${pc.pn?' · PN '+esc(pc.pn):''}`:(it.qtd!=null?it.qtd+' no anúncio · peça não está no sistema':'')}</span></div>
       <span class="small mut" style="flex:none">${quando(q.data)}</span></div>
       <div class="q">❓ ${esc(q.texto)}</div>
       ${ui.pergSt==='todas'&&q.oculta&&!q.resposta?`<div class="small mut">No ML: ${esc(q.oculta)}</div>`:''}
       ${q.resposta?`<div class="small" style="background:var(--pri-t);padding:8px;border-radius:var(--rad)">💬 ${esc(q.resposta.texto)}<br><span class="mut">${quando(q.resposta.data)}</span></div>`
        :q.status==='UNANSWERED'&&!q.oculta?`<textarea data-r="${q.id}" maxlength="2000" placeholder="Escreva a resposta…"></textarea>

        :''}</div>`; }).join('')
     :`<div class="empty">${ui.pergSt==='sem'?'✅ Nenhuma pergunta sem resposta.':'Nenhuma pergunta.'}</div>`}
   <div class="top small" style="max-width:760px;margin:0 auto">${ui.pergPilha.length?'<button class="btn sm" id="pgant">‹ Anteriores</button>':''}${d.proximo!=null?'<button class="btn sm" id="pgprox">Mais antigas ›</button>':''}</div>`;
